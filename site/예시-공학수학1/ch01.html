<script>
var CH = {"subject": "공학수학 1", "chapterNumber": 1, "chapterTitle": "1계 상미분방정식 (First-Order ODEs)", "chapterIntro": {"summary": "공학의 많은 양이 '변화율' — 곧 도함수입니다. 그래서 물리 법칙을 식으로 옮기면 도함수를 품은 방정식이 되고, 그걸 푸는 것이 이 과목의 일입니다. 1장은 그중 가장 단순한 **최고 도함수가 \\(y'\\)뿐인 방정식**을 다룹니다. 방법이 여섯 가지 나오는데, 외울 것은 공식이 아니라 **어떤 식에 어떤 방법을 쓰는가**입니다.", "question": "\\(y'\\)이 들어간 방정식이 주어졌을 때, 어떤 방법으로 풀어야 하나요? 그리고 그 해는 존재하는가·유일한가요?", "prerequisite": "적분(치환, 부분적분, 유리함수 적분)과 편미분의 뜻. 미적분에서 \\(y'\\)이 곡선의 기울기라는 것 정도면 충분합니다.", "nextLink": "2장은 \\(y''\\)이 들어간 **2계**로 올라갑니다. 거기서는 방법이 갈리기보다 '선형'이라는 구조가 중심이 되는데, 그 발판이 여기 [[ch01:sec-linear|4절 선형 ODE]]입니다 — 표준형, 제차/비제차, 입력과 출력이라는 말이 그대로 이어집니다."}, "learningObjectives": [{"id": "lo1", "statement": "ODE(상미분방정식)의 정의, 차수, 양함수꼴/음함수꼴을 구별하고, 해, 일반해, 특수해의 뜻을 설명하며, IVP(초기값문제)에서 초기조건으로 특수해를 결정할 수 있습니다.", "relatedSections": ["sec-what-is-ode"], "relatedFormulas": []}, {"id": "lo2", "statement": "방향장(direction field)으로 해곡선의 개형을 읽고, 오일러법으로 초기값문제의 근사해를 계산하는 원리를 설명할 수 있습니다.", "relatedSections": ["sec-direction-fields"], "relatedFormulas": []}, {"id": "lo3", "statement": "변수분리형 ODE를 판별하고 변수분리법으로 일반해를 구하며, 치환 \\(u = \\frac{y}{x}\\)로 분리형으로 바꿀 수 있습니다.", "relatedSections": ["sec-separable"], "relatedFormulas": ["separable-general"]}, {"id": "lo4", "statement": "완전미분방정식을 판정(\\(\\frac{∂M}{∂y} = \\frac{∂N}{∂x}\\))하고 퍼텐셜 함수로 음함수 해를 구하며, 적분인자로 비완전식을 완전식으로 바꿀 수 있습니다. 적분인자는 \\(x\\)만의 함수 \\(F(x)\\)와 \\(y\\)만의 함수 \\(F^{*}(y)\\) 두 경우를 모두 시도할 수 있습니다.", "relatedSections": ["sec-exact"], "relatedFormulas": ["exact-condition", "integrating-factor"]}, {"id": "lo5", "statement": "선형 ODE를 표준형으로 정리하고 적분인자로 일반해 공식을 유도·적용하며, 베르누이 방정식을 \\(u = y^{1-a}\\) 치환으로 선형으로 바꿔 풀 수 있습니다.", "relatedSections": ["sec-linear"], "relatedFormulas": ["linear-general", "bernoulli-reduction"]}, {"id": "lo6", "statement": "존재 정리·유일성 정리의 조건을 말하고, 주어진 초기값문제에서 해의 존재와 유일성을 판정할 수 있습니다.", "relatedSections": ["sec-existence"], "relatedFormulas": []}], "keywords": ["상미분방정식", "ODE", "편미분방정식", "차수", "양함수꼴", "음함수꼴", "해", "해곡선", "일반해", "특수해", "초기조건", "초기값문제", "IVP", "방향장", "등경사선", "오일러법", "변수분리", "변수분리형", "치환", "완전미분방정식", "전미분", "적분인자", "음함수 해", "퍼텐셜 함수", "필요충분조건", "선형 ODE", "표준형", "제차", "비제차", "입력", "출력", "베르누이 방정식", "로지스틱 방정식", "존재 정리", "유일성 정리"], "theory": {"sections": [{"id": "sec-what-is-ode", "changeNote": "지적(2026-08-08, 부류 «프라임 조판»): 산문에 날것으로 있던 도함수 기호가 화면에서 곧은 따옴표로 보이고, 프라임 뒤에 기호를 붙여 쓰면 렌더러가 받지 못했습니다.\n조치: 본문과 「떠올리기」·「잘 놓쳐요」에 날것으로 있던 도함수·상수 기호를 인라인 수식으로 감쌌고, 같은 자리의 곱·연산자 표기도 새 규격으로 맞췄습니다.", "heading": "ODE란 무엇인가 — 정의, 차수, 해, 초기값문제", "sourceRef": "Kreyszig 10판 §1.1 'Basic Concepts. Modeling' (pp.2-8)", "content": "이 과목의 주인공은 **ODE(상미분방정식, ordinary differential equation)**입니다. 정의는 한 줄입니다 — 미지 함수와 그 함수의 도함수를 포함하는 식이 미분방정식입니다. 미지 함수는 보통 \\(y(x)\\)로, 독립변수가 시간이면 \\(y(t)\\)로 씁니다. 예를 들어 \\(y' = 2y\\), \\(y'' + y = 0\\), \\(y' = \\frac{x}{y}\\)는 모두 미분방정식입니다. 여기서 \\(y'\\)은 \\(\\frac{dy}{dx}\\), \\(y''\\)은 \\(\\frac{d^{2}y}{dx^2}\\)를 뜻합니다(미적분에서 쓰던 그대로). 이름의 '상(ordinary)'은 독립변수가 하나뿐이라는 뜻입니다. 독립변수가 둘 이상이면 편미분이 등장하는 **PDE(편미분방정식, partial differential equation)**가 되는데, 그건 훨씬 복잡해 이 과목의 범위 밖입니다.\n\nODE를 분류하는 첫 기준은 **차수(order)** — 식에 나타난 도함수 중 가장 높은 계수입니다. \\(y' = 2y\\)는 1계, \\(y'' + y = 0\\)는 2계, \\(y''' = x\\)는 3계입니다. 이 장에서는 최고 도함수가 \\(y'\\)뿐인 가장 단순한 **1계 ODE**만 다룹니다. 1계 ODE는 \\(y'\\)을 어떻게 두느냐에 따라 두 꼴로 씁니다.\n\n- **양함수꼴(explicit form)** \\(y' = f(x, y)\\): \\(y'\\)을 한쪽으로 푼 것.\n- **음함수꼴(implicit form)** \\(F(x, y, y') = 0\\): 그렇게 정리하지 않은 것.\n\n둘은 대수 정리로 오갑니다 — \\(xy' - 3y = 0\\) (음함수꼴) → \\(y' = \\frac{3y}{x}\\) (양함수꼴).\n\n그럼 미분방정식을 '푼다'는 건 무슨 뜻일까요? 어떤 구간에서 정의되고 미분 가능한 함수 \\(y = h(x)\\)를 방정식의 \\(y\\)와 \\(y'\\) 자리에 넣었을 때 식이 항등식이 되면, 그 함수를 그 ODE의 **해(solution)**라 합니다. 미지수가 '숫자'가 아니라 '함수'라는 점이 대수방정식과 다릅니다. 해인지 아닌지는 미분해서 대입하면 바로 확인됩니다. 예로 \\(y = ce^{-3x}\\)(\\(c\\)는 임의의 상수)가 \\(y' + 3y = 0\\)의 해인지 봅시다. 미분하면 \\(y' = -3ce^{-3x}\\)이고, 대입하면 \\(y' + 3y = -3ce^{-3x} + 3ce^{-3x} = 0\\)이 되어 식이 성립합니다. 따라서 해가 맞습니다. 이렇게 '검산'이 되는 것은 미분방정식 공부의 큰 무기입니다 — 어떤 방법으로 풀었든 마지막에 대입해 보면 맞았는지 알 수 있습니다.\n\n위 해 \\(y = ce^{-3x}\\)처럼 해는 임의의 상수를 품을 수 있습니다(예: \\(y' = 4x^3\\)을 적분하면 \\(y = x^4 + c\\)). 상수를 어떻게 두느냐에 따라 해를 둘로 나눕니다.\n\n- **일반해(general solution)**: 임의의 상수 \\(c\\)를 포함해 해 전체의 무리를 나타낸 것 — \\(c\\)마다 하나씩인 무수히 많은 해곡선(solution curve)의 가족.\n- **특수해(particular solution)**: \\(c\\)에 특정 값을 넣어 상수가 사라진 하나의 해 — 그 가족 중 한 곡선(위 예에서 \\(c\\)를 정한 것).\n\n실제 문제에서는 대개 특수해 하나가 답이고, 그 하나를 골라내는 장치가 초기 정보입니다.\n\n- **초기조건(initial condition)** \\(y(x_0) = y_0\\): '입력 \\(x_0\\)에서 출력이 \\(y_0\\)'라는 한 점을 지나야 한다는 조건. 이것이 임의의 상수 \\(c\\)를 결정합니다.\n- **IVP(초기값문제, initial value problem)**: ODE와 초기조건을 묶은 문제.\n\n예로 \\(y' + 3y = 0,\\ y(0) = 2\\)를 풀면: 일반해 \\(y = ce^{-3x}\\)에 초기조건을 넣어 \\(y(0) = c = 2\\) → 특수해 \\(y = 2e^{-3x}\\)입니다. 기하로는 무수한 해곡선 가족 중 점 \\((0, 2)\\)를 지나는 단 하나를 고른 것입니다.\n\n마지막으로 용어를 하나 짚겠습니다. 물리 상황을 이렇게 미분방정식으로 옮기는 과정을 **모델링(modeling)**이라 합니다. 이 자료는 모델을 세우는 과정보다 **세워진 방정식을 푸는 쪽**에 무게를 둡니다 — 다른 역학·열전달 과목에서 미분방정식이 나왔을 때 막힘없이 풀기 위해서입니다. 소재가 무엇이든 세워지고 나면 푸는 절차는 같습니다.", "processType": null, "diagrams": [{"id": "fig-solution-curves", "kind": "concept", "anchorText": "실제 문제에서는 대개 특수해", "svg": "<svg viewBox='0 7.5 372 344' xmlns='http://www.w3.org/2000/svg' role='img' aria-label='y′+3y=0의 해곡선족: 일반해 가족과 초기조건 (0,2)를 지나는 특수해'><line x1='62' y1='306' x2='331.29' y2='306' stroke='#3a4252' stroke-width='2'/><path d='M331.29 310.56 L339.5 306 L331.29 301.44 Z' fill='#3a4252' stroke='#3a4252' stroke-width='0.75' stroke-linejoin='round'/><line x1='62' y1='306' x2='62' y2='40.61' stroke='#3a4252' stroke-width='2'/><path d='M66.56 40.61 L62 32.4 L57.44 40.61 Z' fill='#3a4252' stroke='#3a4252' stroke-width='0.75' stroke-linejoin='round'/><text x='350.12' y='311' font-size='11.5' fill='#3a4252'>x</text><text x='39.21' y='36' font-size='11.5' fill='#3a4252'>y</text><line x1='137' y1='306' x2='137' y2='311' stroke='#3a4252' stroke-width='1.6'/><text x='129' y='330' font-size='9.5' fill='#5a6472'>0.5</text><line x1='212' y1='306' x2='212' y2='311' stroke='#3a4252' stroke-width='1.6'/><text x='209' y='330' font-size='9.5' fill='#5a6472'>1</text><li 4 L86.0,216.9 L89.0,222.1 L92.0,227.0 L95.0,231.6 L98.0,235.9 L101.0,240.0 L104.0,243.8 L107.0,247.5 L110.0,250.9 L113.0,254.1 L116.0,257.1 L119.0,259.9 L122.0,262.6 L125.0,265.2 L128.0,267.5 L131.0,269.8 L134.0,271.9 L137.0,273.9 L140.0,275.7 L143.0,277.5 L146.0,279.2 L149.0,280.7 L152.0,282.2 L155.0,283.6 L158.0,284.9 L161.0,286.1 L164.0,287.3 L167.0,288.4 L170.0,289.4 L173.0,290.4 L176.0,291.3 L179.0,292.1 L182.0,292.9 L185.0,293.7 L188.0,294.4 L191.0,295.1 L194.0,295.7 L197.0,296.3 L200.0,296.9 L203.0,297.4 L206.0,297.9 L209.0,298.4 L212.0,298.8 L215.0,299.2 L218.0,299.6 L221.0,300.0 L224.0,300.4 L227.0,300.7 L230.0,301.0 L233.0,301.3 L236.0,301.6 L239.0,301.8 L242.0,302.1 L245.0,302.3 L248.0,302.5 L251.0,302.7 L254.0,302.9 L257.0,303.1 L260.0,303.3 L263.0,303.4 L266.0,303.6 L269.0,303.7 L272.0,303.8 L275.0,304.0 L278.0,304.1 L281.0,304.2 L284.0,304.3 L287.0,304.4 L290.0,304.5 L293.0,304.6 L296.0,304.7 L299.0,304.7 L302.0,304.8' fill='none' stroke='#b5651d' stroke-width='2.6'/><circle cx='62' cy='162' r='3.5' fill='#b5651d'/><text x='91.64' y='158' font-size='9.5' fill='#b5651d'>(0, 2)</text><line x1='200' y1='74' x2='224' y2='74' stroke='#aab2c0' stroke-width='2'/><text x='233.89' y='79' font-size='10.5' fill='#5a6472'>일반해 y = ce<tspan dy='-5' font-size='8'>−3x</tspan></text><line x1='200' y1='100' x2='224' y2='100' stroke='#b5651d' stroke-width='2.6'/><text x='233.89' y='105' font-size='10.5' fill='#b5651d'>특수해 y = 2e<tspan dy='-5' font-size='8'>−3x</tspan></text></svg>", "afterParagraph": 8}], "comprehensionChecks": [{"id": "cc-ode-def-r1", "afterParagraph": 2, "stage": "recall", "prompt": "식에 나타난 도함수 중 가장 높은 계수가 그 미분방정식의 ___ 입니다.", "answer": "차수", "explanation": "차수(order)는 최고 도함수의 계수입니다. \\(y'\\)만 있으면 1계, \\(y''\\)까지 있으면 2계입니다. 이 장은 1계만 다룹니다."}, {"id": "cc-ode-def-t1", "afterParagraph": 9, "stage": "recall", "prompt": "'상미분방정식'과 '초기값문제'에 해당하는 영어 용어를 차례로 쓰면 ___, ___입니다.", "answer": "ordinary differential equation, initial value problem", "explanation": "ordinary는 독립변수가 하나라는 뜻(여럿이면 partial = 편미분방정식). 초기값문제는 ODE에 초기조건을 더한 문제입니다."}, {"id": "cc-ode-def-c1", "stage": "connect", "prompt": "어떤 함수가 ODE의 해인지 어떻게 확인하며, 일반해에 든 임의의 상수 c는 무엇으로 결정되나요?", "answer": "그 함수를 미분해 ODE의 \\(y\\), \\(y'\\) 자리에 대입했을 때 식이 항등식이 되면 해입니다(검산이 가능). 일반해의 임의 상수 \\(c\\)는 초기조건 \\(y(x_0) = y_0\\)을 대입해 결정하며, 그러면 하나의 특수해가 됩니다.", "gradingKeywords": ["미분해 대입 → 항등식이면 해", "임의 상수 c는 일반해에 남음", "초기조건 대입으로 c 결정 → 특수해"]}], "pitfalls": [{"id": "pit-ode-integration-constant", "note": "적분으로 풀 때 적분 상수 c는 적분하는 그 순간 붙여야 합니다. 나중에 붙이면 틀립니다. 예로 \\(y' = 1 + y^{2}\\)에서 \\(\\arctan y = x + c\\)로 즉시 \\(c\\)를 붙여야 \\(y = \\tan(x + c)\\)가 되는데, \\(\\arctan y = x\\)로 두고 나중에 \\(c\\)를 더해 \\(y = \\tan x + c\\)로 쓰면 이는 해가 아닙니다. 적분과 동시에 \\(c\\)를 도입하는 습관을 들이세요.", "source": "Kreyszig 본문 경고 (§1.3 Example 1, 적분 상수 즉시 도입)"}]}, {"id": "sec-direction-fields", "changeNote": "지적(2026-08-08, 부류 «프라임 조판»): 산문에 날것으로 있던 도함수 기호가 화면에서 곧은 따옴표로 보이고, 프라임 뒤에 기호를 붙여 쓰면 렌더러가 받지 못했습니다.\n조치: 「떠올리기」의 날것 도함수 기호를 인라인 수식으로 감쌌고, 본문 오일러법 식의 곱과 부등호를 새 규격으로 맞췄습니다.", "heading": "방향장과 오일러법 — 풀지 않고 해를 보다", "sourceRef": "Kreyszig 10판 §1.2 'Geometric Meaning of y'=f(x,y). Direction Fields, Euler's Method' (pp.9-11)", "content": "1계 ODE \\(y' = f(x, y)\\)에는 아주 직관적인 기하 의미가 있습니다. 미적분에서 \\(y'(x)\\)는 곡선 \\(y(x)\\)의 **기울기**였습니다. 그러니 이 방정식은 '점 \\((x, y)\\)를 지나는 해곡선의 기울기가 바로 \\(f(x, y)\\)'라고 말해 주는 셈입니다. 식을 풀지 않아도, 평면 위 각 점에서 해곡선이 어느 방향으로 지나갈지를 \\(f\\)가 알려 줍니다.\n\n이 아이디어로 그림을 그릴 수 있습니다. 평면의 여러 점마다 그 점의 기울기 \\(f(x, y)\\)만큼 기운 짧은 선분을 그려 넣으면, 해곡선들이 흘러가는 방향이 눈에 보입니다(진행 방향까지 보이도록 작은 화살표로 그리기도 합니다). 이 선분들의 모임을 **방향장(direction field)** 또는 기울기장이라 합니다. 방향장 위에 선분들의 흐름을 따라 곡선을 이어 그리면, 공식을 몰라도 해곡선의 개형을 그릴 수 있습니다. 그리는 요령을 하나 덧붙입니다. \\(f(x, y) = k\\)(상수)인 점들은 기울기가 모두 같으므로 그 위에서 선분들이 나란합니다. 이렇게 '기울기가 같은 점들의 곡선'을 '등경사선(isocline)'이라 합니다. 예를 들어 \\(y' = x - y\\)에서 등경사선 \\(x - y = k\\)는 직선들이고, 각 직선 위의 선분은 전부 기울기 \\(k\\)로 나란합니다. 등경사선 몇 개만 그으면 방향장을 빠르게 채울 수 있습니다.\n\n방향장이 왜 쓸모 있을까요? 많은 ODE는 해의 공식이 복잡하거나 아예 없습니다. 그럴 때도 방향장은 해가 커지는지 줄어드는지, 어떤 값으로 다가가는지 같은 정성적 성질을 그림으로 보여 줍니다. 풀지 못하는 방정식에서도 해의 '모양'을 읽어낼 수 있다는 것이 이 방법의 힘입니다.\n\n그 힘이 가장 크게 나오는 곳이 **평형해**입니다. 우변에 \\(x\\)가 없는 \\(y' = f(y)\\) 꼴(자율계)이면 기울기가 \\(y\\)에만 의존하므로 방향장이 가로로 나란해지고, \\(f(c) = 0\\)인 값 \\(c\\)에서는 기울기가 0이라 상수해 \\(y \\equiv c\\)가 생깁니다. 여기서 \\(\\equiv\\)는 이 자료가 지금부터 쓰는 표기로, **모든 \\(x\\)에서 값이 같다**는 뜻입니다 — 어느 한 점에서 우연히 \\(c\\)와 같다는 \\(y = c\\)와 달리, 함수 전체가 상수 \\(c\\)인 그 함수 자체를 가리킵니다. 앞으로 '나누다가 잃어버리는 해'를 말할 때 이 구별이 계속 필요합니다.\n\n이 평형 주변의 화살표가 어느 쪽을 향하는지만 보면 됩니다.\n\n- \\(f'(c) < 0\\): 양쪽 화살표가 평형을 향합니다 → **안정**(가까이서 출발한 해가 \\(c\\)로 수렴)\n- \\(f'(c) > 0\\): 화살표가 멀어집니다 → **불안정**\n\n예로 로지스틱 \\(y' = 2y - y^2 = y(2 - y)\\)는 평형이 \\(y = 0\\)과 \\(y = 2\\)입니다. \\(0 < y < 2\\)에서 \\(f > 0\\)이라 위로, \\(y > 2\\)에서 \\(f < 0\\)이라 아래로 — **적분을 한 줄도 하지 않고** '어떤 초기값에서 출발해도 \\(y \\to 2\\)'를 읽어낼 수 있습니다(뒤의 연습문제에서 실제로 풀어 확인합니다). 공학에서 원하는 답이 대개 이 정상상태값이라, 해의 공식보다 이쪽이 먼저 필요할 때가 많습니다.\n\n이 발상은 뒤에서 그대로 확장됩니다. 4장 「상미분방정식계와 상평면」은 미지 함수가 둘인 경우를 다루는데, 각 점 \\((y_1, y_2)\\)에 방향 벡터를 붙인 **상평면**이 바로 방향장의 2차원 판입니다. 거기서 평형은 '임계점'이라 불리고, 안정/불안정 분류가 그 장의 핵심이 됩니다. 지금 잡아 두는 감각이 거기서 쓰입니다.\n\n방향장이 눈으로 보는 방법이라면, 그것을 숫자로 옮긴 것이 **오일러법(Euler's method)**입니다. 초기값문제 \\(y' = f(x, y),\\ y(x_0) = y_0\\)에서 출발점 \\((x_0, y_0)\\)의 기울기는 \\(f(x_0, y_0)\\)입니다. 그 기울기로 아주 짧은 거리 \\(h\\)만큼 직선으로 나아가 다음 점을 잡습니다: \\(y_{n+1} = y_n + hf(x_n, y_n)\\), \\(x_{n+1} = x_n + h\\)입니다. 이 한 걸음을 반복하면 해곡선을 짧은 직선 조각들로 근사합니다. 접선을 따라 조금 가고, 새 점에서 기울기를 다시 재고, 또 조금 가고 — 방향장의 선분을 실제로 걸어가는 셈입니다.\n\n**왜 직선으로 가도 되는지**는 테일러 전개가 답합니다. \\(y(x + h) = y(x) + hy'(x) + \\frac{h^{2}}{2}y''(ξ)\\)에서 앞의 두 항만 취한 것이 오일러법입니다. 이 식은 근사가 아니라 등식입니다 — 마지막 항의 \\(y''\\)을 \\(x\\)가 아니라 \\(x\\)와 \\(x + h\\) 사이의 어떤 점 \\(ξ\\)에서 재기 때문입니다. 미적분의 평균값 정리 \\(y(x + h) = y(x) + hy'(ξ)\\)에 항을 하나 더 붙인 꼴이라고 보면 됩니다. \\(ξ\\)가 정확히 어디인지는 알 수 없지만, 그 대신 버리는 양의 크기를 정확히 말할 수 있습니다. 여기서 \\(y'(x) = f(x, y)\\)는 ODE가 공짜로 줍니다 — 해 \\(y\\)를 모르는데도 기울기는 아는 이유가 바로 이것입니다. 버리는 것이 \\(h^{2}\\)에 비례하는 항이라, \\(h\\)를 반으로 줄이면 한 걸음의 오차가 대략 \\(\\frac{1}{4}\\)로 줍니다. sin θ ≈ θ와 같은 종류의 근사(테일러 절단)인데, 성립하는 근거가 '각이 작아서'가 아니라 **'보폭 h가 작아서'** 라는 점만 다릅니다.\n\n간격 \\(h\\)를 줄이면 정확해지지만 계산량이 늘어납니다. 오일러법은 가장 단순한 수치해법이고, 더 정밀한 방법들은 뒤(수치해석)에서 배웁니다. 여기서는 '방향장을 숫자로 따라간다'는 개념만 잡으면 됩니다.", "processType": null, "diagrams": [{"id": "fig-direction-field", "kind": "concept", "anchorText": "이 아이디어로 그림을 그릴 수 있습니다", "svg": "<svg viewBox='0 9.5 372 344' xmlns='http://www.w3.org/2000/svg' role='img' aria-label='y′=x−y의 방향장: 좌표 눈금과 격자 화살표, 해곡선 세 개'><line x1='62' y1='306' x2='335' y2='306' stroke='#3a4252' stroke-width='2'/><path d='M344.0,306.0 L335.0,301.0 L335.0,311.0 Z' fill='#3a4252' stroke='#3a4252' stroke-width='0.75' stroke-linejoin='round'/><line x1='62' y1='306' x2='62' y2='45' stroke='#3a4252' stroke-width='2'/><path d='M62.0,36.0 L57.0,45.0 L67.0,45.0 Z' fill='#3a4252' stroke='#3a4252' stroke-width='0.75' stroke-linejoin='round'/><text x='354.57' y='311' font-size='11.5' fill='#3a4252'>x</text><text x='38.9' y='40' font-size='11.5' fill='#3a4252'>y</text><line x1='122' y1='306' x2='122' y2='311' stroke='#3a4252' stroke-width='1.6'/><text x='119' y='330' font-size='9.5' fill='#5a6472'>1</text><line x1='57' y1='246' x2='62' y2='246' stroke='#3a4252' stroke-width='1.6'/><text x='40' y='250' font-size='9.5' fill='#5a6472'>1</text><line x1='182' y1='306' x2='182' y2='311' stroke='#3a4252' stroke-width='1.6'/><text x='179' y='330' font-size='9.5' fill='#5a6472'>2</text><line x1='57' y1='186' x2='62' y2='186' stroke='#3a4252' stroke-width='1.6'/><text x='40' y='190' font-size='9.5' fill='#5a6472'>2</text><line x1='242' y1='306' x2='242' y2='311' stroke='#3a4252' stroke-width='1.6'/><text x='239' y='330' font-size='9.5' fill='#5a6472'>3</text><line x1='57' y1='126' x2='62' y2='126' stroke='#3a4252' stroke-width='1.6'/><text x='40' y='130' font-size='9.5' fill='#5a6472'>3</text><line x1='302' y1='306' x2='302' y2='311' stroke='#3a4252' stroke-width='1.6'/><text x='299' y='330' font-size='9.5' fill='#5a6472'>4</text><line x1='57' y1='66' x2='62' y2='66' stroke='#3a4252' stroke-width='1.6'/><text x='40' y='70' fo e='#b5651d' stroke-width='2.6'/><text x='323' y='138' font-size='10.5' fill='#b5651d'>해곡선</text></svg>", "afterParagraph": 2}], "comprehensionChecks": [{"id": "cc-dir-r1", "afterParagraph": 1, "stage": "recall", "prompt": "\\(y' = f(x, y)\\)에서 \\(f(x, y)\\)는 점 \\((x, y)\\)를 지나는 해곡선의 ___ 를 뜻합니다.", "answer": "기울기", "explanation": "\\(y'\\)은 곡선의 기울기이므로, ODE는 각 점에서 해곡선이 가질 기울기를 알려 줍니다. 이를 짧은 선분으로 그린 것이 방향장입니다."}, {"id": "cc-dir-r2", "afterParagraph": 9, "stage": "recall", "prompt": "오일러법의 한 걸음은 \\(x_{n+1} = x_n + h\\), \\(y_{n+1} = y_n + \\)___ 입니다.", "answer": "h f(x_n, y_n)", "explanation": "현재 점의 기울기 f(x_n, y_n)로 h만큼 직선으로 나아갑니다 — 방향장의 선분을 실제로 한 걸음 걷는 것입니다. 참값이 아니라 근사값이라는 점은 이어지는 함정에서 다룹니다."}, {"id": "cc-dir-r3", "afterParagraph": 6, "stage": "recall", "prompt": "자율계 \\(y' = f(y)\\)의 평형 \\(c\\) 근처에서 화살표가 평형을 향하면 ___, 멀어지면 ___입니다.", "answer": "안정, 불안정", "explanation": "\\(f'(c) < 0\\)이면 양쪽 화살표가 평형을 향해 해가 \\(c\\)로 수렴하고(안정), \\(f'(c) > 0\\)이면 멀어집니다(불안정). 4장 상평면의 임계점 분류가 이 판정을 2차원으로 넓힌 것입니다."}, {"id": "cc-dir-c1", "stage": "connect", "prompt": "방향장은 ODE를 공식으로 풀지 못해도 유용합니다. 왜 그런가요?", "answer": "방향장은 각 점의 기울기를 그린 것이라, 해의 공식이 없어도 해곡선이 커지는지 줄어드는지, 어떤 값으로 다가가는지 같은 정성적 성질을 그림으로 읽을 수 있게 해 줍니다.", "gradingKeywords": ["해의 공식이 없어도 됨", "각 점 기울기 → 해곡선 개형", "증가, 감소, 극한 등 정성적 성질을 봄"]}], "pitfalls": [{"id": "pit-dir-euler-approx", "note": "오일러법이 주는 값은 참값이 아니라 접선으로 이어 붙인 근사값입니다. 각 걸음마다 접선이 실제 곡선에서 조금씩 벗어나고 그 오차가 누적되므로, 간격 h가 크면 결과가 크게 어긋납니다. h를 줄이면 정확해지지만 계산량이 늘어납니다 — '오일러법 = 근사'라는 점을 잊지 마세요.", "source": "Kreyszig 본문 경고 (§1.2, 오일러법은 근사이며 h를 줄여야 정확)"}]}, {"id": "sec-separable", "changeNote": "지적(2026-08-13, 부류 «수식 표기 — 기호끼리의 곱은 붙이고 연산자는 띄운다»): 곱을 공백으로 띄우던 표기를 뒤집었습니다. 기호끼리의 곱은 붙이고, 더하기, 빼기, 등호와 미분자 앞만 띄웁니다.\n조치: 본문과 「떠올리기」, 「잘 놓쳐요」의 곱을 붙이고 등호 좌우를 띄웠습니다.", "heading": "변수분리형 — 가장 기본이 되는 풀이법", "sourceRef": "Kreyszig 10판 §1.3 'Separable ODEs. Modeling' (pp.12-18)", "content": "1계 ODE를 푸는 가장 기본적인 방법이 **변수분리(separation of variables)**입니다. 어떤 ODE를 대수적으로 정리해서 한쪽에는 \\(y\\)만, 다른 쪽에는 \\(x\\)만 오도록 가를 수 있으면 — 즉 \\(g(y)y' = f(x)\\) 꼴로 쓸 수 있으면 — 그 방정식을 '변수분리형(separable equation)'이라 합니다.\n\n방법은 이름 그대로입니다. \\(y' = \\frac{dy}{dx}\\)이므로 \\(g(y)y' = f(x)\\)의 양변에 \\(dx\\)를 곱하면 \\(g(y)\\,dy = f(x)\\,dx\\): 왼쪽에는 \\(y\\)와 \\(dy\\)만, 오른쪽에는 \\(x\\)와 \\(dx\\)만 남은 **미분형**이 됩니다. 변수가 이렇게 완전히 갈라졌기 때문에 '변수분리'라 부릅니다. 그다음 양변을 각각 적분하면 일반해가 나옵니다: \\(\\int g(y)\\,dy = \\int f(x)\\,dx + c\\)입니다. 순서가 핵심입니다 — 먼저 \\(dx\\)를 곱해 미분형으로 가른 뒤, 그다음에 적분합니다.\n\n이 방법이 왜 통하는지는 한 줄로 정리됩니다 — **변수를 갈라 놓아야 양변을 각각 적분할 수 있기 때문**입니다. 그래서 변수분리는 '식의 생김새만 보면 되는' 방법입니다: 우변이 \\(f(x)g(y)\\)처럼 \\(x\\)만의 함수와 \\(y\\)만의 함수의 **곱**으로 쪼개지면 분리형입니다.\n\n이론에서는 알아보는 것까지만 하고, 나머지는 역할을 나눕니다 — 같은 절차를 두 번 보여 주지 않으려는 것입니다.\n\n- 유도: 일반 기호로 절차를 끝까지 밟습니다\n- 문풀: 초기조건·치환이 붙은 계산을 직접 채웁니다\n\n한 가지만 미리 짚어 둡니다. \\(g(y)\\)로 나누는 순간 \\(g(y) = 0\\)인 상수해가 빠집니다. \\(y' = -2xy\\)처럼 그 해가 일반해의 \\(c = 0\\)으로 되돌아오는 경우도 있고, 되돌아오지 않아 따로 적어야 하는 경우도 있습니다 — 이어지는 함정에서 다룹니다.\n\n이 방법이 실제로 어디서 나오는지 하나만 봅시다. 바닥에 작은 구멍이 뚫린 물통에서 수위 \\(h\\)가 내려가는 속도는 토리첼리 법칙에 따라 남은 수위의 제곱근에 비례해, \\(h' = -k\\sqrt{h}\\)로 적힙니다(여기서는 독립변수가 시간이라 \\(h' = \\frac{dh}{dt}\\)입니다). 우변이 \\(h\\)만의 함수라 곧바로 갈라집니다.\n\n- 분리: \\(\\frac{dh}{\\sqrt{h}} = -k\\,dt\\)\n- 적분: \\(2\\sqrt{h} = -kt + c\\)\n- 정리: \\(h = \\frac{(c - kt)^2}{4}\\): 수위가 시간의 2차식으로 떨어집니다\n\n달라진 것은 \\(g(y)\\) 자리에 무엇이 오느냐뿐입니다. 그리고 마지막에 원식에 **대입해 보는 검산 줄**을 습관으로 삼으면, 어떤 방법으로 풀었든 맞았는지가 그 자리에서 드러납니다.\n\n초기조건까지 붙은 계산과 치환 예제는 **유도**와 **문풀**에서 단계별로 직접 채워 봅니다.\n\n변수가 그대로 갈라지지 않아도 **치환**으로 분리형으로 바꿀 수 있습니다. 대표적인 것이 오른쪽이 \\(\\frac{y}{x}\\)만의 함수인 \\(y' = f(\\frac{y}{x})\\) 꼴로, 새 미지 함수 \\(u = \\frac{y}{x}\\)를 도입하면 \\(u\\)와 \\(x\\)에 대한 변수분리형으로 바뀝니다. 풀어서 \\(u\\)를 구한 뒤 \\(u = \\frac{y}{x}\\)를 되돌리면 원래 해가 나옵니다. '분리가 안 되면 적절한 치환으로 분리형을 만든다'는 발상은 이 장 뒤의 방법들에서도 되풀이됩니다(치환의 실제 계산은 문풀에서 다룹니다).", "processType": null, "diagrams": [], "comprehensionChecks": [{"id": "cc-sep-r1", "afterParagraph": 1, "stage": "recall", "prompt": "\\(g(y)y' = f(x)\\) 꼴로 정리되는 ODE를 ___ 이라 하고, 양변을 적분해 풉니다.", "answer": "변수분리형", "explanation": "\\(y\\)는 왼쪽, \\(x\\)는 오른쪽으로 완전히 갈라지므로 변수분리형입니다. \\(\\int g(y)\\,dy = \\int f(x)\\,dx + c\\)로 일반해를 구합니다."}, {"id": "cc-sep-r2", "afterParagraph": 6, "stage": "recall", "prompt": "변수분리에서 \\(g(y)\\)로 나눌 때, \\(g(y) = 0\\)의 근을 \\(c\\)라 합시다. 이때 통째로 사라질 수 있는 것은 ___ 입니다.", "answer": "상수해 \\(y \\equiv c\\)", "explanation": "그 해에서는 \\(g(y)\\)가 모든 \\(x\\)에서 0이라 나누는 순간 지워집니다. 일반해의 상수를 어떻게 잡아도 안 나오면 답에 따로 적어야 합니다."}, {"id": "cc-sep-c1", "stage": "connect", "prompt": "\\(y' = f\\left(\\frac{y}{x}\\right)\\) 꼴은 그대로는 변수분리가 안 됩니다. 어떤 치환을 도입하며, 그 치환이 통하는 이유는 무엇인가요?", "answer": "\\(u = \\frac{y}{x}\\)를 새 미지 함수로 도입합니다. 우변이 \\(x\\)와 \\(y\\)에 따로 의존하지 않고 **비 \\(\\frac{y}{x}\\) 하나에만** 의존하기 때문에, 그 비 자체를 미지 함수로 삼으면 우변이 \\(u\\)만의 함수가 되어 \\(u\\)와 \\(x\\)로 갈라집니다. 실제 대입 계산과 되돌리기는 문풀에서 단계별로 합니다.", "gradingKeywords": ["우변이 비 \\(\\frac{y}{x}\\) 하나에만 의존한다는 점이 근거", "그 비를 새 미지 함수 \\(u\\)로 도입", "\\(u\\)와 \\(x\\)의 분리형이 된다 (계산은 문풀)"]}], "pitfalls": [{"id": "pit-sep-lost-solution", "note": "g(y)로 나누는 순간 g(y) = 0이 되는 상수해가 통째로 사라질 수 있습니다. x로 나누는 것과는 종류가 다릅니다 — x = 0은 정의역의 한 점이라 구간을 좁히면 되지만, \\(y \\equiv c\\)는 함수 하나이고 그 해에서는 g(y)가 모든 x에서 0이라 해가 지워집니다. 확인은 세 줄이면 된다: ⑴ g(y) = 0의 근 c를 찾고 ⑵ \\(y \\equiv c\\)를 원식에 대입해 해인지 보고 ⑶ **일반해에서 상수를 어떻게 잡아도 \\(y \\equiv c\\)가 나오는지** 봅니다. 나오면 흡수된 것이라 따로 안 써도 되고(선형은 대개 이 경우 — \\(y' = 3x^{2}y\\)의 \\(y = 0\\)은 \\(y = Ce^{x^{3}}\\)의 \\(C = 0\\)으로 회수된다), 안 나오면 답에 '또는 \\(y \\equiv c\\)'를 반드시 붙입니다(\\(y' = y^{2}\\)의 \\(y \\equiv 0\\)은 \\(y = -1/(x + c)\\) 어디에도 없습니다). 절댓값 ln|y|는 실전에서 부호까지 품은 상수 C로 흡수되지만, 그 부호가 초기조건으로 고정되는 이유는 해가 y = 0을 가로지를 수 없기 때문입니다(유일성).\n\n**이 상수해가 왜 쓸모 있나요** — 선형대수의 자명해(trivial solution)처럼 '구해도 의미 없는 것'이 아닙니다. 셋입니다. ⑴ **답의 완전성**: 일반해가 회수하지 못하면 빠뜨린 해가 있는 것이라 해집합 자체가 틀립니다. ⑵ **다른 해의 울타리**: 유일성 때문에 다른 해곡선이 \\(y \\equiv c\\)를 가로지르지 못해, 초기값의 부호가 해 전체의 부호를 고정합니다. ⑶ **평형해가 곧 이것이다**: 자율계에서 안정·불안정을 판정하는 대상이 이 상수해이고, 4장 상평면의 임계점이 그 확장입니다 — 버리는 순간 그 장의 주인공이 사라집니다.", "source": "Kreyszig 본문 경고 (§1.7 Example 2 비유일성 · §1.3 Prob 26 상수해를 찾으라는 요구)"}]}, {"id": "sec-linear", "changeNote": "지적(2026-08-13, 부류 «이해도 체크 답 길이 상한»): 「연결하기」 답이 길어 인출이 아니라 읽기가 됐습니다. 답은 세 문장까지입니다.\n조치: 「연결하기」 답에서 마지막 부연을 덜어 세 문장으로 줄였고, 본문·함정의 곱과 연산자 표기도 함께 맞췄습니다.", "heading": "선형 ODE와 베르누이 방정식 — 일반해 공식이 있는 유형", "sourceRef": "Kreyszig 10판 §1.5 'Linear ODEs. Bernoulli Equation. Population Dynamics' (pp.27-33)", "content": "네 번째 유형은 실전에서 가장 자주 만나는 **선형 ODE**입니다. 1계 ODE가 대수 정리로 \\(y' + p(x)y = r(x)\\): 미지 함수 \\(y\\)와 \\(y'\\)에 대해 1차인 꼴 — 로 정리되면 선형이라 하고, 이 꼴을 표준형이라 부릅니다. 공학에서는 우변 \\(r(x)\\)를 입력(input), 해 \\(y(x)\\)를 그 입력에 대한 출력(output)이라 읽습니다 — 가열기가 넣는 열과 물체의 온도, 가해진 힘과 그 결과인 속도처럼요. 표준형의 조건 하나: \\(y'\\)의 계수가 1이어야 합니다. \\(xy' - 2y = x^4\\)처럼 \\(y'\\) 앞에 함수가 붙어 있으면 먼저 나눕니다 → \\(y' - \\frac{2}{x}y = x^3\\)입니다.\n\n우변이 0인 경우(**제차**, \\(r = 0\\))는 새 도구가 필요 없습니다 — \\(y' = -py\\)는 변수분리형이라 \\(\\frac{dy}{y} = -p\\,dx\\)를 적분해 \\(y = ce^{-h}\\) (\\(h = \\int p\\,dx\\))를 얻습니다. 우변이 0이 아닌 경우(비제차)가 이 절의 본론입니다.\n\n**'선형'이 정확히 무슨 뜻인지** 여기서 한 번 짚고 갑니다. 표준형의 좌변을 하나의 연산 \\(F(y) = y' + py\\)로 보면, 선형(linear)이라는 것은 아래 두 성질을 함께 갖는다는 뜻입니다.\n\n- 가법성(additivity): \\(F(y_1 + y_2) = F(y_1) + F(y_2)\\)\n- 동차성(homogeneity): \\(F(ay) = aF(y)\\)\n- ★ 낱말 주의 — 제차(homogeneous)와 동차성(homogeneity)은 어원이 같지만 가리키는 것이 다릅니다. 제차는 '우변이 0'이고, 동차성은 바로 위의 \\(F(a y) = aF(y)\\)입니다.\n\n둘을 합치면 \\(F(c_{1}y_1 + c_{2}y_2) = c_{1}F(y_1) + c_{2}F(y_2)\\)가 되고, **제차**라면 오른쪽이 통째로 0이므로 해의 선형결합도 다시 해입니다 — 이것을 **중첩 원리(superposition principle)**라 합니다. 두 성질이 왜 성립하는지는 미분의 선형성에서 곧바로 나오는데, 대입을 한 줄씩 따라가는 것과 결과만 아는 것은 다릅니다. 유도에서 전개를 끝까지 밟고, 제차·선형이라는 조건이 하나라도 빠지면 어디서 무너지는지도 반례로 확인합니다.\n\n1계에서는 해가 서로 비례해서 새 해가 나오지는 않습니다. 그래도 여기서 짚는 이유는 이 구조가 2장의 등뼈이기 때문입니다 — 2계에서는 비례하지 않는 두 해를 골라 그 선형결합으로 일반해를 만듭니다.\n\n비제차 선형 ODE의 열쇠는 **적분인자**입니다 — 양변에 어떤 함수를 곱해 좌변을 한 덩어리 도함수로 뭉치게 만드는 수법인데, 선형에서는 그런 함수가 **언제나 \\(x\\)만의 함수로 존재**합니다(뒤의 적분인자 절에서 다루는 일반형은 존재가 보장되지 않아 매번 확인해야 합니다). \\(h = \\int p\\,dx\\)로 두고 \\(e^{h}\\)를 양변에 곱하면 좌변 전체가 곱의 미분 \\((e^{h}y)'\\) 하나로 뭉칩니다. 그러면 양변을 그대로 적분할 수 있고, 일반해 공식 \\(y = e^{-h}(\\int e^{h} r\\,dx + c)\\)가 나옵니다(왜 그런지는 유도 탭에서 단계별로). 이 공식의 구조는 읽을 줄 알아야 합니다.\n\n- \\(e^{-h}\\int e^{h} r\\,dx\\): 입력 \\(r\\)에 대한 응답\n- \\(ce^{-h}\\): 초기조건에 대한 응답\n\n이 두 항이 무엇인지는 뉴턴 냉각으로 보면 한눈에 들어옵니다. 주위 온도가 \\(T_s\\)로 일정한 곳에 뜨거운 물체를 두면 식는 속도는 온도차에 비례하므로 \\(T' = -k(T - T_s)\\)이고, 표준형으로 옮기면 \\(T' + kT = kT_s\\): \\(p = k\\), \\(r = kT_s\\)인 선형 ODE입니다. 공식에 넣으면 \\(T = T_s + (T_0 - T_s)e^{-kt}\\)가 나옵니다. 앞의 \\(T_s\\)가 **입력에 대한 응답**이고, 뒤의 지수항이 **초기조건에 대한 응답**입니다. 시간이 지나면 뒤 항이 사라져 물체는 결국 주위 온도가 됩니다 — 선형 ODE의 해를 '남는 부분 + 사라지는 부분'으로 읽는 습관이 여기서 시작되고, 2장의 강제진동에서 같은 구조를 다시 만납니다.\n\n외울 것은 공식이 아니라 **네 걸음**입니다 — \\(p\\)를 읽고, \\(h = \\int p\\,dx\\)로 \\(e^{h}\\)를 만들고, 곱해서 좌변을 \\((e^{h}y)'\\)로 뭉치고, 적분한 뒤 나눕니다. 예를 들어 \\(y' + \\frac{y}{x} = x^2\\)은 \\(p = \\frac{1}{x}\\)이라 적분인자가 \\(e^{h} = x\\)이고, 곱하면 좌변이 \\((xy)'\\)로 뭉쳐 한 번의 적분으로 \\(y = \\frac{x^3}{4} + \\frac{c}{x}\\)가 나옵니다. 네 걸음을 일반 기호로 끝까지 밟는 것은 유도에, 숫자로 직접 채워 보는 것은 문풀에 있습니다.\n\n선형이 아니어도 치환으로 선형이 되는 유형이 있습니다. 대표가 **베르누이 방정식** \\(y' + p(x)y = g(x)y^a\\)입니다(\\(a = 0\\)이나 \\(1\\)이면 이미 선형이므로 그 외의 실수 \\(a\\)). 새 미지 함수 \\(u = y^{1-a}\\)로 두면 \\(u\\)에 대한 선형 ODE \\(u' + (1 - a)pu = (1 - a)g\\)로 바뀌고(유도 탭), 선형 공식으로 \\(u\\)를 구한 뒤 \\(y\\)로 되돌립니다. '안 풀리는 꼴은 치환으로 아는 꼴로 바꾼다'는 [[ch01:sec-separable|3절 변수분리형]]의 발상이 여기서도 반복됩니다. 개체수 성장의 로지스틱 방정식 \\(y' = Ay - By^2\\)이 이 유형의 대표 사례입니다(\\(a = 2\\)).", "processType": null, "diagrams": [], "comprehensionChecks": [{"id": "cc-lin-r1", "afterParagraph": 3, "stage": "recall", "prompt": "선형 ODE의 표준형은 \\(y' + p(x)y = r(x)\\)이고, 비제차를 푸는 적분인자는 \\(e^{h}\\), 여기서 \\(h = \\)___ 입니다.", "answer": "\\(\\int p\\,dx\\)", "explanation": "\\(h = \\int p\\,dx\\)로 두면 \\(e^{h}\\)를 곱한 좌변이 \\((e^{h}y)'\\)로 뭉쳐 적분 가능해집니다. \\(h\\)의 적분상수는 결과에 영향이 없습니다."}, {"id": "cc-lin-r2", "afterParagraph": 4, "stage": "recall", "prompt": "일반해 \\(y = e^{-h}\\left(\\int e^{h} r\\,dx + c\\right)\\)의 두 항 중 \\(ce^{-h}\\)는 ___ 에 대한 응답입니다.", "answer": "초기조건", "explanation": "\\(e^{-h}\\int e^{h} r\\,dx\\)는 입력 \\(r\\)에 대한 응답이고, \\(ce^{-h}\\)는 초기조건이 정하는 부분입니다. 뉴턴 냉각 \\(T = T_s + (T_0 - T_s)e^{-kt}\\)의 두 항이 정확히 이 둘입니다."}, {"id": "cc-lin-c1", "stage": "connect", "prompt": "베르누이 방정식 \\(y' + py = gy^{a}\\)에 \\(u = y^{1-a}\\) 치환을 쓰는 근거는 무엇인가요? 지수가 하필 \\(1 - a\\)인 이유까지 말해 보세요.", "answer": "이 식에서 비선형을 만드는 것은 \\(gy^{a}\\) 항 하나뿐이라, \\(y\\)의 거듭제곱을 새 미지 함수로 묶으면 선형이 될 여지가 생깁니다. 지수를 \\(1 - a\\)로 잡는 것은 \\(u\\)를 미분했을 때 나오는 \\(y^{-a}y'\\)가 원식의 \\(y^{a}\\) 항과 맞물려 상쇄되도록 맞춘 것입니다. 그 결과 \\(u\\)에 대한 선형 ODE \\(u' + (1 - a)pu = (1 - a)g\\)가 되고, 선형 공식으로 풀어 \\(y\\)로 되돌립니다.", "gradingKeywords": ["비선형의 원인은 \\(gy^{a}\\) 항 하나뿐", "지수 \\(1 - a\\)는 미분 뒤 \\(y^{a}\\)와 상쇄되도록 고른 값", "결과는 \\(u\\)에 대한 선형 ODE — 풀고 되돌린다"]}], "pitfalls": [{"id": "pit-lin-standard-form", "note": "선형 공식을 쓰기 전에 반드시 \\(y'\\)의 계수를 1로 만드세요 — \\(f(x)y' + \\cdots\\) 꼴에 곧바로 공식을 적용하면 \\(p\\)와 \\(r\\)를 잘못 읽습니다. 한편 \\(h = \\int p\\,dx\\)의 적분상수는 아무렇게나 둬도 됩니다(적분인자에 상수배가 붙을 뿐 해는 같습니다).", "source": "Kreyszig 본문 경고 (§1.5, 표준형으로 나눈 뒤 적용·h의 적분상수 무관)"}, {"id": "pit-bern-exponent", "note": "베르누이 치환의 지수는 \\(-a\\)가 아니라 \\(1 - a\\)이므로 \\(u = y^{1-a}\\)로 둡니다. 또 \\(a > 0\\)이면 \\(y = 0\\) 자체가 해인데 \\(y^{a}\\)로 나누는 과정에서 사라집니다 — 로지스틱 \\(y' = Ay - By^{2}\\)에서도 \\(y = 0\\)이 별도의 해입니다.", "source": "Kreyszig 본문 경고 (§1.5, 로지스틱에서 y=0도 해)"}]}, {"id": "sec-exact", "changeNote": "지적(2026-08-13, 부류 «수식 표기 — 기호끼리의 곱은 붙이고 연산자는 띄운다»): 곱을 공백으로 띄우던 표기를 뒤집었습니다. 기호끼리의 곱은 붙이고, 더하기, 빼기, 등호와 미분자 앞만 띄웁니다.\n조치: 본문의 등호 좌우를 띄웠습니다.", "heading": "완전미분방정식 — 좌변이 전미분일 때", "sourceRef": "Kreyszig 10판 §1.4 'Exact ODEs. Integrating Factors' (pp.20-26)", "content": "앞 절의 선형 ODE는 '적분인자를 곱해 좌변을 한 덩어리로 뭉친다'는 발상이었습니다. 그 발상을 일반화하기 전에, 먼저 **애초에 좌변이 이미 뭉쳐 있는 경우**를 봅니다. 이 방법은 미적분의 '전미분'을 거꾸로 이용합니다. 어떤 함수 \\(u(x, y)\\)의 전미분은 \\(du = \\frac{∂u}{∂x}\\,dx + \\frac{∂u}{∂y}\\,dy\\)입니다. \\(\\frac{∂u}{∂x}\\)는 편미분 — 나머지 변수를 상수로 두고 \\(x\\)로만 미분한 것으로, 미적분에서 다룬 그대로입니다. 만약 \\(u(x, y) = c\\)(상수)라면 \\(du = 0\\)이 됩니다. 이 관계를 뒤집어 봅시다. 1계 ODE를 \\(M(x, y)\\,dx + N(x, y)\\,dy = 0\\) 꼴로 썼을 때, 왼쪽이 마침 어떤 \\(u(x, y)\\)의 전미분 \\(du\\)와 같다면 — 즉 \\(M = \\frac{∂u}{∂x}\\), \\(N = \\frac{∂u}{∂y}\\)인 \\(u\\)가 존재한다면 — 이 방정식을 **완전미분방정식(exact differential equation)**이라 합니다. 그러면 방정식은 \\(du = 0\\)이므로, 적분하면 곧바로 음함수 해 \\(u(x, y) = c\\)를 얻습니다.\n\n문제는 '주어진 식이 완전한가'를 어떻게 판정하느냐입니다. 판정법은 놀랄 만큼 간단합니다. 완전하려면 \\(M = \\frac{∂u}{∂x}\\), \\(N = \\frac{∂u}{∂y}\\)인 \\(u\\)가 있어야 하는데, 이때 \\(M\\)을 다시 \\(y\\)로, \\(N\\)을 다시 \\(x\\)로 편미분하면 둘 다 \\(u\\)의 같은 2계 혼합편도함수가 되어 일치해야 합니다. 그래서 완전할 필요충분조건은 \\(\\frac{∂M}{∂y} = \\frac{∂N}{∂x}\\)입니다. 성립하면 완전하고, 안 하면 완전하지 않습니다. 실전에서는 이 한 줄을 확인하는 것으로 시작합니다.\n\n완전하다고 판정되면 \\(u\\)를 이렇게 찾습니다. \\(\\frac{∂u}{∂x} = M\\)이므로 \\(M\\)을 \\(x\\)로 적분하면(이때 \\(y\\)는 상수로 취급) \\(u = \\int M\\,dx + k(y)\\)가 나옵니다. 적분상수 자리에 \\(y\\)만의 함수 \\(k(y)\\)가 오는 이유는, \\(x\\)로 적분할 때 \\(y\\)만의 항이 상수처럼 사라졌을 수 있기 때문입니다. \\(k(y)\\)는 남은 조건 \\(\\frac{∂u}{∂y} = N\\)으로 정합니다. 방금 구한 \\(u\\)를 \\(y\\)로 편미분해 \\(N\\)과 같다고 놓으면 \\(k'(y)\\)가 나오고, 적분하면 \\(k(y)\\)가 정해집니다. 정리하면 판정 → \\(x\\)로 적분 → \\(y\\)로 미분해 \\(N\\)과 비교 → \\(k\\) 확정의 네 단계입니다. 이 뼈대를 일반 기호로 끝까지 밟는 것이 유도이고, 같은 순서를 숫자로 직접 채워 보는 것이 문풀입니다 — 여기서는 뼈대까지만 확인하고 넘어갑니다.\n\n그런데 판정에서 **어긋나면** 어떻게 할까요? 그 경우를 다루는 것이 다음 절입니다.", "processType": null, "diagrams": [], "comprehensionChecks": [{"id": "cc-exact-r1", "afterParagraph": 2, "stage": "recall", "prompt": "완전미분방정식 \\(M\\,dx + N\\,dy = 0\\)의 판정 조건은 \\(\\frac{∂M}{∂y} = \\frac{∂N}{∂x}\\)이며, 완전하면 해는 음함수꼴 ___ 로 나옵니다.", "answer": "\\(u(x, y) = c\\)", "explanation": "좌변이 어떤 u의 전미분 du와 같으므로 du = 0, 곧 u(x,y) = c가 해입니다. 필요하면 y = h(x)로 풀어냅니다."}, {"id": "cc-exact-t1", "stage": "recall", "prompt": "'완전미분방정식'에 해당하는 영어 용어는 ___입니다.", "answer": "exact differential equation", "explanation": "좌변이 전미분(exact differential)인 식이라는 뜻입니다."}], "pitfalls": [{"id": "pit-exact-nonexact-breakdown", "note": "완전 조건 \\(\\frac{∂M}{∂y} = \\frac{∂N}{∂x}\\)가 성립하지 않는데도 \\(u\\)를 찾으려 하면 막힙니다 — \\(u = \\int M\\,dx + k(y)\\)에서 나온 \\(k\\)가 \\(x\\)에 의존해야 하는 모순이 생깁니다. 반드시 판정을 먼저 하고, 비완전이면 적분인자로 바꾼 뒤에 푸세요.", "source": "Kreyszig 본문 경고 (§1.4 Example 3, 비완전식에 방법을 강행하면 막힘)"}]}, {"id": "sec-integrating-factor", "changeNote": "지적(2026-08-13, 부류 «이해도 체크 답 길이 상한»): 「연결하기」 답이 길어 인출이 아니라 읽기가 됐습니다. 답은 세 문장까지입니다.\n조치: 「연결하기」 답을 두 문장으로 합쳐 상한에 맞췄고, 본문의 곱을 붙였습니다.", "heading": "적분인자 — 완전하지 않을 때 완전하게 만들기", "sourceRef": "Kreyszig 10판 §1.4 'Exact ODEs. Integrating Factors' (pp.20-26) + §1.5 'Linear ODEs' (pp.27-33) — 두 절이 따로 다루는 적분인자를 학습 순서로 합친 절", "processType": null, "diagrams": [], "content": "앞 절의 판정 \\(\\frac{∂M}{∂y} = \\frac{∂N}{∂x}\\)가 어긋나면 그 방법은 그대로는 쓸 수 없습니다. 그런데 적당한 함수를 곱하면 완전하게 바뀌는 경우가 많습니다. **여기서부터 기호를 바꿔 씁니다** — 아직 완전하지 않은 식은 \\(P\\,dx + Q\\,dy = 0\\)으로 쓰고, \\(M\\)·\\(N\\)은 완전한 식에만 쓰겠습니다. 기호가 곧 '완전한가'의 표시가 되는 셈입니다.\n\n비완전식 \\(P\\,dx + Q\\,dy = 0\\)에 함수 \\(F\\)를 곱한 \\(FP\\,dx + FQ\\,dy = 0\\)이 완전해지면, 그 \\(F\\)를 **적분인자(integrating factor)**라 합니다. 문제는 \\(F\\)를 어떻게 찾느냐인데, \\(F\\)가 \\(x\\)와 \\(y\\) 모두의 함수면 오히려 더 어렵습니다. 그래서 한 변수만의 함수인 경우를 노립니다. \\(F = F(x)\\)라 가정하고 완전 조건을 대입해 정리하면 아래 왼쪽 조합이 나오는데, 같은 논리를 \\(y\\)쪽으로도 돌릴 수 있어 **길이 둘**입니다.\n\n- \\(x\\)쪽: \\(R = \\frac{1}{Q}\\left(\\frac{∂P}{∂y} - \\frac{∂Q}{∂x}\\right)\\)가 \\(x\\)만의 함수 → \\(F(x) = e^{\\int R\\,dx}\\)\n- \\(y\\)쪽: \\(R^{*} = \\frac{1}{P}\\left(\\frac{∂Q}{∂x} - \\frac{∂P}{∂y}\\right)\\)가 \\(y\\)만의 함수 → \\(F^{*}(y) = e^{\\int R^{*}\\,dy}\\)\n\n두 줄은 분모(\\(Q\\) ↔ \\(P\\))와 빼는 순서가 **함께** 뒤바뀝니다 — 한쪽만 바꿔 쓰면 부호가 틀립니다. 중요한 건 이게 '보통은 \\(x\\)쪽'이 아니라 **둘 중 되는 쪽을 고르는 절차**라는 점입니다. \\(x\\)쪽 조합이 \\(y\\)를 물고 늘어져 지저분하게 나왔다고 거기서 멈추지 말고 반드시 \\(y\\)쪽을 계산해 보세요. 어느 쪽도 한 변수로 안 떨어지면 이 방법은 통하지 않습니다.\n\n곱하고 나면 \\(M = FP\\), \\(N = FQ\\)로 이름이 바뀌고, 그때부터는 앞 절의 완전미분 절차를 그대로 씁니다. 둘 중 어느 쪽이 되는지는 **약분해 봐야** 압니다 — 완전 판정이 어긋나는 것을 먼저 확인하고, \\(R\\)이 한 변수로 떨어지는지 약분해 보고, 곱한 뒤 완전해졌는지 다시 판정하는 과정은 유도에서 한 번 끝까지 보여 줍니다.\n\n이 절을 완전미분과 갈라 둔 이유가 하나 더 있습니다. 적분인자는 여기서 처음 나온 것이 아닙니다 — **앞의 선형 ODE 절에서 이미 썼습니다.** 거기서는 \\(F = e^{\\int p\\,dx}\\)로 항상 존재했고, 그래서 공식이 하나로 떨어졌습니다. 즉 선형 ODE는 적분인자가 늘 통하는 **특수한 경우**였고, 이 절이 그 일반형입니다. 여기서는 존재가 보장되지 않아 \\(R\\)이 한 변수로 떨어지는지를 매번 확인해야 합니다. 두 절을 나란히 놓고 보면 '공식이 있다'와 '되는지 봐야 한다'의 차이가 어디서 오는지가 보입니다.", "comprehensionChecks": [{"id": "cc-if-t1", "stage": "recall", "prompt": "'적분인자'에 해당하는 영어 용어는 ___입니다.", "answer": "integrating factor", "explanation": "비완전식에 곱해 완전하게 만드는 함수입니다."}, {"id": "cc-if-c1", "stage": "connect", "prompt": "**선형 ODE 절에서도 적분인자를 썼습니다.** 그런데 그때는 '되는지 확인하는' 단계가 없었습니다 — 왜 그런가요?", "answer": "선형 표준형 \\(y' + py = r\\)에서는 적분인자가 \\(F = e^{\\int p\\,dx}\\)로 **항상 존재**해서, 확인할 것 없이 공식 하나로 떨어졌기 때문입니다. 이 절의 일반형 \\(P\\,dx + Q\\,dy = 0\\)에서는 존재가 보장되지 않아, \\(R\\)이나 \\(R^{*}\\)가 한 변수로 떨어지는지를 **매번 확인**해야 하고 둘 다 아니면 이 방법이 통하지 않습니다. 즉 선형 ODE는 적분인자가 늘 통하는 특수한 경우이고, 이 절이 그 일반형입니다.", "gradingKeywords": ["선형에서는 \\(F = e^{\\int p\\,dx}\\)가 늘 존재해 확인이 필요 없다", "일반형은 존재가 보장되지 않아 한 변수로 떨어지는지 매번 확인한다", "선형 ODE가 특수한 경우이고 이 절이 그 일반형이다"]}], "pitfalls": [{"id": "pit-exact-one-variable-factor", "note": "적분인자를 찾을 때 \\(\\frac{1}{Q}\\left(\\frac{∂P}{∂y} - \\frac{∂Q}{∂x}\\right)\\)가 \\(x\\)만의 함수인지, 아니면 \\(\\frac{1}{P}\\left(\\frac{∂Q}{∂x} - \\frac{∂P}{∂y}\\right)\\)가 \\(y\\)만의 함수인지를 확인합니다. 두 식은 분모(\\(Q\\)↔\\(P\\))와 빼는 순서가 함께 뒤바뀝니다 — 한쪽만 바꿔 쓰면 부호가 틀립니다. 어느 쪽도 한 변수로 떨어지지 않으면 이 정리로는 \\(F\\)를 구할 수 없습니다(더 일반적인 방법이 필요).", "source": "Kreyszig 본문 경고 (§1.4 Theorem 1·2, 한 변수 적분인자 조건)"}]}, {"id": "sec-existence", "changeNote": "지적(2026-08-13, 부류 «수식 표기 — 기호끼리의 곱은 붙이고 연산자는 띄운다»): 곱을 공백으로 띄우던 표기를 뒤집었습니다. 기호끼리의 곱은 붙이고, 더하기, 빼기, 등호와 미분자 앞만 띄웁니다.\n조치: 본문의 곱을 붙였습니다.", "heading": "해의 존재와 유일성 — IVP는 언제 답을 갖는가", "sourceRef": "Kreyszig 10판 §1.7 'Existence and Uniqueness of Solutions for Initial Value Problems' (pp.38-42)", "content": "여기까지 변수분리, 완전미분, 선형으로 방정식을 푸는 법을 익혔습니다. 그런데 답이 하나 나왔다고 해서 그것이 **유일한** 답일까요? 애초에 답이 있기는 할까요? 이 절이 그 근본 질문을 짚습니다 — 초기값문제는 언제 답을 갖나요? 답이 항상 하나라는 보장은 없습니다. 세 가지 상황이 실제로 다 일어납니다.\n\n- \\(|y'| + |y| = 0,\\ y(0) = 2\\): 이 ODE를 만족하는 함수는 \\(y = 0\\)뿐인데 초기조건이 어긋납니다 → 해가 **없습니다**\n- \\(y' = 3x^2,\\ y(0) = 1\\): 적분해 \\(y = x^3 + 1\\) → 해가 **정확히 하나입니다**\n- \\(xy' = 2(y - 1),\\ y(0) = 1\\): 임의의 \\(c\\)에 대해 \\(y = 1 + cx^2\\)이 전부 초기조건을 지납니다 → 해가 **무한히 많습니다**\n\n그래서 두 정리가 필요합니다. **존재 정리**: \\(f(x, y)\\)가 초기점 \\((x_0, y_0)\\)를 품는 직사각형 \\(R\\)에서 연속이고 유계(\\(|f| \\le K\\))이면, IVP \\(y' = f(x, y),\\ y(x_0) = y_0\\)는 적어도 하나의 해를 갖습니다.\n\n해가 보장되는 범위는 \\(|x - x_0| < \\alpha\\)로 제한되고, \\(\\alpha\\)는 \\(R\\)의 가로 반폭 \\(a\\)와 \\(\\frac{b}{K}\\) 중 **작은 쪽**입니다. 왜 하필 이 둘의 최솟값인지는 그림이 답합니다. 기울기가 최대 \\(K\\)라는 것은 해곡선이 초기점에서 뻗어 나가는 **기울기 \\(\\pm K\\)의 원뿔 안에 갇힌다**는 뜻입니다. 그 원뿔이 \\(R\\)의 위·아래 변에 닿는 곳이 \\(x_0 \\pm \\frac{b}{K}\\)인데, 그게 좌·우 변(\\(x_0 \\pm a\\))보다 안쪽이면 해곡선은 옆으로 빠져나가기 전에 위아래로 먼저 나가 버립니다. \\(R\\) 밖에서는 \\(f\\)에 대해 아무것도 가정하지 않았으니 거기서부터는 보장이 없습니다 — 그래서 짧은 쪽에서 끊깁니다.\n\n**유일성 정리**: 여기에 \\(\\frac{∂f}{∂y}\\)까지 \\(R\\)에서 연속·유계라는 조건을 더하면 해는 많아야 하나가 됩니다 — 존재 정리와 합쳐 **정확히 하나**입니다. 거꾸로 \\(\\frac{∂f}{∂y}\\)가 터지는 곳에서는 해가 갈라질 수 있습니다. \\(y' = 3y^{2/3},\\ y(0) = 0\\)이 그 예로, \\(y = 0\\)과 \\(y = x^3\\)이 모두 해입니다(\\(\\frac{∂f}{∂y} = 2y^{-1/3}\\)이 \\(y = 0\\)에서 무한대 — 연습문제에서 직접 확인합니다).\n\n실전 감각은 이렇습니다. 이 장의 방법들이 다루는 방정식은 계수·우변이 연속인 구간에서는 두 정리의 조건을 만족하므로, 앞 절들에서 구한 해가 '그 구간의 유일한 해'입니다. 특이점(계수가 터지는 곳, 예: 표준형에서 \\(x = 0\\))을 경계로 보장 구간이 잘린다는 것, 그리고 두 정리의 조건은 충분조건일 뿐이라는 것만 기억해 두면 됩니다.\n\n특히 **선형**이면 이야기가 더 깔끔합니다. \\(y' + p(x)y = r(x)\\)에서 \\(p\\)·\\(r\\)가 연속이기만 하면 위 두 조건이 자동으로 따라와, 그 구간 전체에서 해가 존재하고 유일합니다. 직사각형을 잡고 \\(\\alpha\\)를 계산하는 수고가 필요 없다는 뜻이죠. 그래서 상수해를 잃는다거나 해가 갈라진다거나 하는 걱정은 비선형에서만 하는 겁니다.\n\n**정리해 둡시다.** 이 절은 공식으로 계산할 게 거의 없습니다. 대신 정리의 **진술과 조건**을 문장으로 말할 수 있어야 하고, 1장에서 그런 항목은 여기뿐입니다 — 나머지 절은 절차를 손으로 익히는 쪽이었죠. 세 줄로 줄이면 이렇습니다.\n\n- 존재: \\(f\\)가 연속이고 유계(\\(|f| \\le K\\))\n- 유일: 거기에 \\(\\frac{∂f}{∂y}\\)까지 연속이고 유계\n- 보장 구간: \\(\\alpha = \\min\\left(a,\\ \\frac{b}{K}\\right)\\)", "processType": null, "diagrams": [{"id": "fig-existence-rect", "kind": "illustrative", "anchorText": "해가 보장되는 범위는", "svg": "<svg viewBox='0 35 420 396.2' xmlns='http://www.w3.org/2000/svg' role='img' aria-label='존재 정리의 보장 구간: 해곡선은 초기점에서 뻗은 기울기 ±K의 쐐기 안에 갇히고, 그 쐐기가 직사각형 R의 좌·우 변보다 위·아래 변에 먼저 닿기 때문에 보장 구간이 반폭 a가 아니라 b를 K로 나눈 값에서 잘린다'><path d='M206,200 L256,130 L256,270 Z' fill='#e8d5bd' opacity='0.6' stroke='#e8d5bd' stroke-width='0.75' stroke-linejoin='round'/><path d='M206,200 L156,130 L156,270 Z' fill='#e8d5bd' opacity='0.6' stroke='#e8d5bd' stroke-width='0.75' stroke-l 1d'>(x₀, y₀)</text><text x='44' y='364.2' font-size='11' fill='#3a4252'>해곡선은 기울기 ±K의 쐐기를 벗어날 수 없습니다.</text><text x='44' y='384.2' font-size='11' fill='#3a4252'>쐐기가 위·아래 변에 먼저 닿아 구간이 α에서 끊깁니다.</text></svg>", "afterParagraph": 4}], "comprehensionChecks": [{"id": "cc-exist-r1", "afterParagraph": 5, "stage": "recall", "prompt": "존재 정리는 \\(f\\)가 연속·유계이면 해가 적어도 ___ 존재함을, 유일성 정리는 \\(\\frac{∂f}{∂y}\\)까지 연속·유계이면 해가 많아야 ___ 임을 말합니다.", "answer": "둘 다 '하나'입니다.", "explanation": "존재(at least one)와 유일성(at most one)이 합쳐져야 '정확히 하나'가 됩니다."}, {"id": "cc-exist-r2", "afterParagraph": 4, "stage": "recall", "prompt": "보장 구간 \\(\\alpha = \\min\\left(a,\\ \\frac{b}{K}\\right)\\)에서 \\(\\frac{b}{K}\\)가 더 작다는 것은, 해곡선이 \\(R\\)의 ___ 변으로 먼저 빠져나간다는 뜻입니다.", "answer": "위·아래", "explanation": "기울기가 최대 \\(K\\)라 해곡선은 초기점에서 뻗은 기울기 \\(\\pm K\\)의 쐐기 안에 갇힙니다. 그 쐐기가 위·아래 변에 닿는 곳이 \\(x_0 \\pm \\frac{b}{K}\\)이고, 그게 좌·우 변 \\(x_0 \\pm a\\)보다 안쪽이면 보장은 거기서 끊깁니다."}, {"id": "cc-exist-c1", "stage": "connect", "prompt": "\\(y' = 3y^{2/3},\\ y(0) = 0\\)은 \\(y = 0\\)과 \\(y = x^3\\) 둘 다 해입니다. 유일성 정리의 어떤 조건이 깨졌나요?", "answer": "\\(f = 3y^{2/3}\\) 자체는 연속이라 존재는 보장되지만, \\(\\frac{∂f}{∂y} = 2y^{-1/3}\\)이 초기점 \\(y = 0\\)에서 무한대가 되어 유계 조건이 깨집니다. 그래서 '많아야 하나'가 보장되지 않고 실제로 해가 갈라집니다.", "gradingKeywords": ["f는 연속 → 존재는 성립", "\\(\\frac{∂f}{∂y} = 2y^{-1/3}\\)이 \\(y = 0\\)에서 무한대", "유계 조건 위반 → 유일성 보장 소멸"]}], "pitfalls": [{"id": "pit-exist-sufficient", "note": "두 정리의 조건은 충분조건이지 필요조건이 아닙니다 — 조건이 깨졌다고 '해가 없다'거나 '여러 개다'로 단정하면 틀립니다. 깨지는 순간 사라지는 것은 해의 존재·유일성이 아니라 그 **보장**입니다.", "source": "Kreyszig 본문 경고 (§1.7, sufficient conditions rather than necessary)"}]}]}, "derivation": {"formulas": [{"id": "separable-general", "changeNote": "지적(2026-08-13, 부류 «수식 표기 — 기호끼리의 곱은 붙이고 연산자는 띄운다»): 곱을 공백으로 띄우던 표기를 뒤집었습니다. 기호끼리의 곱은 붙이고, 더하기, 빼기, 등호와 미분자 앞만 띄웁니다.\n조치: 유도 단계와 「떠올리기」의 곱을 붙이고 등호 좌우를 띄웠습니다.", "kind": "derivation", "sectionRef": "sec-separable", "topic": "변수분리", "name": "변수분리법의 일반해", "appliesTo": "우변이 \\(x\\)만의 함수와 \\(y\\)만의 함수의 **곱**으로 갈라지는 꼴 — \\(y' = f(x)g(y)\\)입니다. 곱·몫으로 떨어져 보이면 이 방법부터 시도합니다.", "latex": "\\int g(y)\\,dy = \\int f(x)\\,dx + c", "variables": {"g(y)": "좌변으로 모으는 y만의 함수", "f(x)": "우변으로 모으는 x만의 함수", "c": "적분 상수 (적분하는 즉시 붙입니다)"}, "derivationSteps": [{"text": "먼저 **형태를 확인합니다.** 대수적으로 정리해 한쪽엔 \\(y\\)만, 다른 쪽엔 \\(x\\)만 오게 만들 수 있는지 봅니다.", "equations": ["g(y)y' = f(x)"]}, {"text": "\\(y' = \\frac{dy}{dx}\\)이므로 **양변에 \\(dx\\)를 곱합니다.** 변수가 갈라진 미분형이 되는데, 여기서 아직 적분하지 않습니다.", "equations": ["g(y)y' = f(x)", "g(y)\\,dy = f(x)\\,dx"]}, {"text": "이제 **양변을 각각 적분합니다** — 왼쪽은 \\(y\\)로, 오른쪽은 \\(x\\)로. 적분 상수는 적분하는 그 순간 붙입니다.", "equations": ["\\int g(y)\\,dy = \\int f(x)\\,dx + c"]}, {"text": "두 적분을 계산하면 \\(x\\)·\\(y\\)의 관계식(일반해)이 남고, 초기조건 \\(y(x_0) = y_0\\)로 \\(c\\)를 정하면 특수해입니다.\n\n이 순서가 문풀과 같습니다:\n\n\\(y' = \\frac{x}{y}\\)", "equations": ["y\\,dy = x\\,dx", "\\frac{y^{2}}{2} = \\frac{x^{2}}{2} + c", "y^{2} = x^{2} + C"]}], "assumptions": ["f, g가 연속이어야 적분이 존재합니다.", "g(y)로 나누는 과정에서 g(y) = 0이 되는 상수해가 사라질 수 있으므로 따로 확인합니다."], "notes": "우변이 \\(\\frac{y}{x}\\)만의 함수인 식처럼 그대로는 분리가 안 되는 경우도 치환 \\(u = \\frac{y}{x}\\)로 분리형으로 바꿀 수 있습니다.", "comprehensionChecks": [{"id": "cc-f-sep-r1", "afterStep": 2, "stage": "recall", "prompt": "변수분리형에서 좌변을 y로 적분할 수 있는 것은 \\(y'\\,dx = \\)___ 이기 때문입니다.", "answer": "dy"}], "sourceRef": "Kreyszig 10판 §1.3, eq. (1)-(3)"}, {"id": "linearity-superposition", "changeNote": "지적(2026-08-13, 부류 «수식 표기 — 기호끼리의 곱은 붙이고 연산자는 띄운다»): 곱을 공백으로 띄우던 표기를 뒤집었습니다. 기호끼리의 곱은 붙이고, 더하기, 빼기, 등호와 미분자 앞만 띄웁니다.\n조치: 유도 단계와 결과 식의 곱을 붙였고, 붙이기 전에 첨자를 중괄호로 감싼 뒤 연산자를 띄웠습니다.", "kind": "derivation", "sectionRef": "sec-linear", "topic": "선형 ODE", "name": "선형성 — 가법성과 동차성이 성립하는 이유", "appliesTo": "**제차** 선형 ODE \\(y' + p(x)y = 0\\)의 해를 이미 두 개 알고 있을 때. 그 해들을 더하거나 상수배해도 다시 해인지 묻는 자리입니다. 우변이 0이 아니거나(비제차) 식이 비선형이면 쓸 수 없고, 왜 못 쓰는지는 마지막 두 단계에서 반례로 봅니다.", "latex": ["F(y) = y' + p(x)y", "F(c_{1}y_1 + c_{2}y_2) = c_{1}F(y_1) + c_{2}F(y_2)"], "variables": {"F(y)": "표준형의 좌변을 하나의 연산으로 본 것 — \\(y\\)를 넣으면 \\(y' + py\\)를 돌려줍니다", "y_1, y_2": "\\(F(y) = 0\\)의 해로 이미 알고 있는 두 함수", "c_1, c_2": "임의의 상수"}, "derivationSteps": [{"text": "먼저 **뿌리를 확인합니다** — 이 절의 모든 것은 미적분에서 배운 미분의 두 규칙에서 나옵니다. 합의 미분은 미분의 합이고, 상수배는 미분 밖으로 그대로 나옵니다. 새로 배울 것이 아니라 이미 가진 것입니다.", "equations": ["(y_1 + y_2)' = y_1' + y_2'", "(ay)' = ay'"]}, {"text": "**가법성(additivity)을 직접 대입해 확인합니다.** 두 해의 합 \\(y_1 + y_2\\)를 \\(F\\)에 넣고, 1단계의 첫 규칙으로 미분을 가른 뒤 \\(y_1\\)끼리·\\(y_2\\)끼리 묶습니다. 묶고 나면 각 괄호가 원래의 \\(F\\)와 **같은 모양**이라는 것이 눈에 보입니다.", "equations": ["F(y_1 + y_2) = (y_1 + y_2)' + p(y_1 + y_2)", "= y_1' + y_2' + py_1 + py_2", "= (y_1' + py_1) + (y_2' + py_2)", "= F(y_1) + F(y_2)"]}, {"text": "**동차성(homogeneity)도 같은 방식입니다.** 상수배 \\(ay\\)를 넣고 1단계의 둘째 규칙으로 \\(a\\)를 미분 밖으로 뺀 다음, 두 항에서 \\(a\\)를 공통으로 묶습니다.", "equations": ["F(ay) = (ay)' + p(ay)", "= ay' + apy", "= a(y' + py) = aF(y)"]}, {"text": "두 성질을 **이어서** 쓰면 선형결합이 그대로 통과합니다. 먼저 가법성으로 둘을 가르고, 각 조각에 동차성으로 상수를 빼냅니다. 이 한 줄이 **중첩 원리(superposition principle)** 입니다.", "equations": ["F(c_{1}y_1 + c_{2}y_2) = F(c_{1}y_1) + F(c_{2}y_2)", "= c_{1}F(y_1) + c_{2}F(y_2)"]}, {"text": "마지막으로 **'해'라는 조건**을 씁니다. \\(y_1\\)·\\(y_2\\)가 해라는 것은 \\(F(y_1) = F(y_2) = 0\\)이라는 뜻이므로, 위 식의 오른쪽이 통째로 0이 됩니다. 따라서 어떤 상수를 골라도 선형결합은 다시 해입니다.", "equations": ["F(c_{1}y_1 + c_{2}y_2) = c_1 \\times 0 + c_2 \\times 0 = 0"]}, {"text": "**왜 제차(우변 0)여야 하나요?** 우변이 \\(r \\ne 0\\)이면 해의 조건이 \\(F(y_1) = F(y_2) = r\\)이라, 4단계 결과가 \\(r\\)이 아니라 \\((c_1 + c_2)r\\)가 됩니다. \\(c_1 + c_2 = 1\\)인 특별한 경우에만 우연히 맞습니다.\n\n확인: \\(y' + y = 2\\)는 \\(y = 2 + e^{-x}\\)와 \\(y = 2 + 5e^{-x}\\)가 각각 해지만, 더한 \\(y = 4 + 6e^{-x}\\)를 넣으면 좌변이 4가 되어 2가 아닙니다.", "equations": ["F(c_{1}y_1 + c_{2}y_2) = c_{1}r + c_{2}r = (c_1 + c_2)r"]}, {"text": "**왜 선형이어야 하나요?** 2단계에서 항을 \\(y_1\\)쪽·\\(y_2\\)쪽으로 가를 수 있었던 것은 \\(y\\)와 \\(y'\\)이 **1차로만** 나타났기 때문입니다. 제곱이 끼면 교차항이 남아 갈라지지 않습니다.\n\n확인: \\(y' = y^{2}\\)은 \\(y = -\\frac{1}{x}\\)와 \\(y = -\\frac{1}{x + 1}\\)이 각각 해지만, 더하면 \\((y_1 + y_2)^{2}\\)에서 교차항 \\(2y_{1}y_2\\)가 남아 해가 아닙니다. 상수배도 마찬가지입니다 — \\(y = -\\frac{2}{x}\\)를 넣으면 좌변 \\(\\frac{2}{x^{2}}\\), 우변 \\(\\frac{4}{x^{2}}\\)로 어긋납니다.", "equations": ["(y_1 + y_2)^{2} = y_1^{2} + 2y_{1}y_2 + y_2^{2} \\ne y_1^{2} + y_2^{2}"]}], "assumptions": ["\\(p\\)가 그 구간에서 연속이어야 \\(y'\\)이 존재하고 대입이 뜻을 갖습니다.", "제차(\\(r = 0\\))이고 선형이어야 합니다 — 6·7단계가 그 둘이 왜 필요한지를 보입니다."], "notes": "2계 이상도 **같은 세 줄**입니다. \\(F(y) = y'' + py' + qy\\)로 두면 2단계·3단계의 전개에 \\(y''\\) 항이 하나 늘 뿐 묶는 방식이 똑같습니다 — 그래서 2장 1절이 이 결과를 그대로 물려받아 기저와 일반해를 세웁니다. 1계에서는 해가 전부 서로 비례해 새 해가 나오지는 않지만, **구조를 보는 자리**로는 식이 가장 짧습니다.", "comprehensionChecks": [{"id": "cc-f-lin-r1", "afterStep": 3, "stage": "recall", "prompt": "가법성은 \\(F(y_1 + y_2) = \\)___ 이고, 동차성은 \\(F(a y) = aF(y)\\)입니다.", "answer": "\\(F(y_1) + F(y_2)\\)"}, {"id": "cc-f-lin-t1", "afterStep": 5, "stage": "explain", "prompt": "2단계에서 \\(y_1\\)끼리·\\(y_2\\)끼리 묶을 수 있었던 근거는 무엇인가요?", "answer": "미분이 선형이기 때문입니다 — \\((y_1 + y_2)' = y_1' + y_2'\\)이라 미분 항이 갈라지고, \\(py\\) 항은 분배법칙으로 갈라집니다. 선형성은 새 성질이 아니라 **미분의 성질이 식 전체로 올라온 것**이고, 2계·고계로 가도 이 근거가 그대로입니다.", "gradingKeywords": ["미분의 선형성", "합의 미분 = 미분의 합", "분배법칙"]}, {"id": "cc-f-lin-c1", "stage": "connect", "prompt": "비제차식에서 중첩이 깨지는 이유와 비선형식에서 깨지는 이유는 서로 다릅니다. 각각 어느 단계가 무너지는지 말해 보세요.", "answer": "비제차는 4단계까지는 그대로 성립하고 **5단계**가 무너집니다 — \\(F(y_i)\\)가 0이 아니라 \\(r\\)이라 합이 \\((c_1 + c_2)r\\)가 됩니다. 비선형은 더 앞인 **2단계**가 무너집니다 — 교차항 때문에 애초에 \\(y_1\\)쪽·\\(y_2\\)쪽으로 갈라지지 않습니다.", "gradingKeywords": ["비제차 → 5단계(해의 조건)", "비선형 → 2단계(가법성 자체)", "교차항"]}], "sourceRef": "Kreyszig 10판 §2.1 Theorem 1 'Fundamental Theorem for the Homogeneous Linear ODE' 및 그 PROOF(p.48)를 1계로 내려 쓴 것 · 반례는 자작(교재 Example 2·3과 다른 식) · 수치 독립 검산 tools/verify_ode_answer.py"}, {"id": "linear-general", "changeNote": "지적(2026-08-08, 부류 «프라임 조판»): 산문에 날것으로 있던 도함수 기호가 화면에서 곧은 따옴표로 보이고, 프라임 뒤에 기호를 붙여 쓰면 렌더러가 받지 못했습니다.\n조치: 프라임 뒤에 붙어 있던 곱을 띄우고 산문의 날것 도함수 기호를 인라인 수식으로 감쌌으며, 나머지 곱은 붙였습니다.", "kind": "derivation", "sectionRef": "sec-linear", "topic": "선형 ODE", "name": "선형 ODE의 일반해 공식", "appliesTo": "\\(y' + p(x)y = r(x)\\) 표준형 — \\(y\\)와 \\(y'\\)에 대해 **1차**인 꼴. \\(y'\\)의 계수가 1이 아니면 **먼저 나눈 뒤** 공식을 씁니다.", "latex": ["h = \\int p\\,dx", "y = e^{-h}\\left(\\int e^{h}r\\,dx + c\\right)"], "variables": {"p(x)": "표준형 \\(y' + p(x)y = r(x)\\)의 y 계수", "r(x)": "우변(입력)", "h(x)": "\\(\\int p\\,dx\\): 적분상수는 생략해도 됩니다(이유는 유도 2단계에 적어 두었습니다)", "c": "임의 상수 (초기조건에 대한 응답의 크기)"}, "derivationSteps": [{"text": "**제차(\\(r = 0\\))부터.** 이건 변수분리형이라 새 도구가 필요 없습니다.", "equations": ["y' = -py", "\\frac{dy}{y} = -p\\,dx", "\\ln|y| = -\\int p\\,dx + c_1", "y = ce^{-h} \\quad (h = \\int p\\,dx)"]}, {"text": "비제차는 적분인자로 뭉칩니다. 양변에 미지의 \\(F(x)\\)를 곱하고, **좌변이 곱의 미분과 같아지기를 요구합니다.** 그 요구가 곧 \\(F\\)를 정하는 방정식이 됩니다 — 뒤의 적분인자 절에서 다루는 일반형은 운이 좋아야 있지만, 선형에서는 **언제나** 존재합니다.\n\n여기서 \\(h = \\int p\\,dx\\)의 **적분상수를 생략해도 되는 이유**: 상수 \\(c_0\\)를 더하면 \\(e^{h + c_0} = e^{c_0}e^{h}\\)라 적분인자가 **상수배**만 됩니다. 그런데 \\(F\\)는 방정식 **양변에 곱하는** 인자이므로 그 상수배는 양변에서 약분돼 사라집니다 — 해가 달라지지 않으니 처음부터 안 씁니다.", "equations": ["Fy' + pFy = rF", "(Fy)' = Fy' + F'\\,y", "F' = pF", "F = e^{h}"]}, {"text": "\\(e^{h}\\)를 곱하면 좌변이 한 덩어리로 뭉쳐 **양변을 그대로 적분할 수 있습니다**(상수는 적분하는 즉시).", "equations": ["(e^{h}y)' = e^{h}r", "e^{h}y = \\int e^{h}r\\,dx + c"]}, {"text": "\\(e^{h}\\)로 나누면 위 공식입니다. **두 항의 뜻이 다릅니다** — 앞은 입력 \\(r\\)에 대한 응답, 뒤는 초기조건에 대한 응답입니다.\n\n이 순서가 문풀과 같습니다:\n\n\\(y' - 2y = e^{x}\\)", "equations": ["y = e^{-h}\\int e^{h}r\\,dx + ce^{-h}", "h = -2x", "(e^{-2x}y)' = e^{-x}", "y = -e^{x} + ce^{2x}"]}], "assumptions": ["p, r가 연속인 구간에서 성립합니다(그 구간에서 해는 유일).", "표준형이어야 합니다 — \\(y'\\)의 계수가 1이 아니면 먼저 나눕니다."], "notes": "h의 적분상수는 생략합니다 — 붙여도 적분인자에 상수배가 곱해질 뿐 최종 해는 같습니다.", "comprehensionChecks": [{"id": "cc-f-lin-r1", "afterStep": 3, "stage": "recall", "prompt": "선형 ODE에서 적분인자 \\(e^{h}\\)를 곱하면 좌변이 \\((e^{h}y)'\\)로 뭉치는 이유는 \\(F' = \\)___ 가 되도록 \\(F\\)를 골랐기 때문입니다.", "answer": "pF"}], "sourceRef": "Kreyszig 10판 §1.5, eq. (1)-(4)"}, {"id": "bernoulli-reduction", "changeNote": "지적(2026-08-12, 부류 «수식 안 슬래시 분수»): 수식 안의 슬래시 분수를 분자, 분수선, 분모로 조판하도록 검사가 승격됐습니다.\n조치: 치환 단계의 슬래시 분수를 분수로 조판했고, 곱은 붙이고 연산자는 띄웠습니다.", "kind": "derivation", "sectionRef": "sec-linear", "topic": "선형 ODE", "name": "베르누이 방정식의 선형화", "appliesTo": "\\(y' + p(x)y = g(x)y^{a}\\): 선형인데 **우변에 \\(y^{a}\\)가 붙은** 꼴(\\(a \\ne 0, 1\\)). 비선형을 만드는 항이 \\(y\\)의 거듭제곱 하나뿐이면 이 치환이 통합니다.", "latex": ["u = y^{1-a}", "u' + (1 - a)pu = (1 - a)g"], "variables": {"a": "\\(y^{a}\\)의 지수 (0, 1이면 이미 선형이므로 그 외)", "u(x)": "새 미지 함수 \\(y^{1-a}\\)", "p(x)": "베르누이 표준형 \\(y' + py = gy^{a}\\)의 \\(y\\) 계수", "g(x)": "우변 \\(y^{a}\\)의 계수"}, "derivationSteps": [{"text": "**새 미지 함수를 도입합니다.** 지수가 \\(-a\\)가 아니라 \\(1 - a\\)인 것은, 다음 단계에서 상쇄가 맞아떨어지도록 고른 값이기 때문입니다.", "equations": ["y' + py = gy^{a} \\quad (a \\ne 0, 1)", "u = y^{1-a}"]}, {"text": "\\(u\\)를 미분하고, 원식에서 얻은 \\(y'\\)을 그대로 **대입합니다.**", "equations": ["u' = (1 - a)y^{-a}y'", "y' = gy^{a} - py", "u' = (1 - a)(g - py^{1-a})"]}, {"text": "우변에 남은 \\(y^{1-a}\\)가 바로 \\(u\\)입니다. 이로써 **\\(u\\)에 대한 선형 ODE**가 됐으므로, 위의 선형 공식을 그대로 씁니다.", "equations": ["u' + (1 - a)pu = (1 - a)g"]}, {"text": "\\(u\\)를 구했으면 **되돌려** \\(y\\)를 얻습니다.\n\n이 순서가 문풀과 같습니다:\n\n\\(y' + y = y^{2}\\)", "equations": ["a = 2 \\quad \\to \\quad u = y^{-1} = \\frac{1}{y}", "u' - u = -1", "u = 1 + ce^{x}", "y = \\frac{1}{u} = \\frac{1}{1 + ce^{x}}"]}], "assumptions": ["a ≠ 0, 1 (그 두 값이면 치환 없이 이미 선형입니다).", "a > 0이면 \\(y = 0\\)도 해입니다 — \\(y^{a}\\)로 나누는 과정에서 사라지므로 따로 확인합니다."], "notes": "치환 후는 완전히 선형 문제입니다 — 선형 공식의 h·적분인자 절차가 그대로 이어집니다.", "comprehensionChecks": [{"id": "cc-f-bern-r1", "afterStep": 3, "stage": "recall", "prompt": "베르누이 방정식 \\(y' + py = gy^{a}\\)를 선형으로 바꾸는 치환은 \\(u = \\)___ 입니다.", "answer": "\\(y^{1-a}\\)"}], "sourceRef": "Kreyszig 10판 §1.5, eq. (9)-(10)"}, {"id": "exact-condition", "changeNote": "지적(2026-08-13, 부류 «수식 표기 — 기호끼리의 곱은 붙이고 연산자는 띄운다»): 곱을 공백으로 띄우던 표기를 뒤집었습니다. 기호끼리의 곱은 붙이고, 더하기, 빼기, 등호와 미분자 앞만 띄웁니다.\n조치: 편미분 기호 사이의 가는 공백을 없애 곱을 붙이고, 등호 좌우를 띄웠습니다.", "kind": "derivation", "sectionRef": "sec-exact", "topic": "완전미분방정식", "name": "완전미분방정식의 판정과 해", "appliesTo": "\\(M\\,dx + N\\,dy = 0\\) 꼴로 쓴 뒤 **판정식이 맞아떨어질 때.** 어긋나면 그대로 밀지 말고 다음 적분인자로 넘어갑니다.", "latex": ["\\frac{∂M}{∂y} = \\frac{∂N}{∂x}", "u = \\int M\\,dx + k(y) = c"], "variables": {"M": "\\(M\\,dx + N\\,dy = 0\\)에서 dx의 계수", "N": "dy의 계수", "u(x,y)": "전미분이 M dx + N dy인 퍼텐셜 함수", "k(y)": "x로 적분할 때 나오는 y만의 함수"}, "derivationSteps": [{"text": "1계 ODE를 미분형으로 쓰고, 좌변이 **어떤 \\(u(x,y)\\)의 전미분이라 가정합니다.** 계수를 비교하면 \\(M\\)·\\(N\\)의 정체가 정해집니다.", "equations": ["M\\,dx + N\\,dy = 0", "du = \\frac{∂u}{∂x}dx + \\frac{∂u}{∂y}dy", "M = \\frac{∂u}{∂x}, \\quad N = \\frac{∂u}{∂y}"]}, {"text": "그런 \\(u\\)가 **실제로 있는지 판정합니다.** \\(M\\)을 \\(y\\)로, \\(N\\)을 \\(x\\)로 다시 편미분하면 둘 다 \\(u\\)의 같은 2계 혼합편도함수가 되므로, 연속이면 일치해야 합니다. 이것이 완전할 **필요충분조건**입니다.", "equations": ["\\frac{∂M}{∂y} = \\frac{∂^{2}u}{∂y∂x}, \\quad \\frac{∂N}{∂x} = \\frac{∂^{2}u}{∂x∂y}", "\\frac{∂M}{∂y} = \\frac{∂N}{∂x}"]}, {"text": "완전하면 \\(M\\)을 \\(x\\)로 적분해 \\(u\\)를 만듭니다. 적분상수 자리에 \\(y\\)만의 함수 \\(k(y)\\)가 오는 것은, \\(x\\)로 적분할 때 \\(y\\)만의 항이 상수처럼 사라졌을 수 있기 때문입니다.", "equations": ["u = \\int M\\,dx + k(y)"]}, {"text": "남은 조건에 이 \\(u\\)를 넣으면 \\(k'(y)\\)가 나오고, 적분하면 \\(k(y)\\)가 정해집니다. \\(du = 0\\)이므로 해는 음함수꼴입니다.\n\n이 순서가 문풀과 같습니다:\n\n\\((2xy + 3)\\,dx + (x^{2} - 1)\\,dy = 0\\)", "equations": ["\\frac{∂u}{∂y} = N \\quad \\to \\quad k'(y)", "u(x,y) = c", "u = x^{2}y + 3x - y = c"]}], "assumptions": ["M, N과 그 1계 편도함수가 연속인 영역에서 성립합니다.", "해는 음함수꼴 u(x,y) = c이며, 가능하면 y = h(x)로 풀어냅니다."], "notes": "판정 조건이 성립하지 않으면 비완전이며, 적분인자를 곱해 완전식으로 바꾼 뒤 같은 방법으로 풉니다.", "comprehensionChecks": [{"id": "cc-f-exact-r1", "afterStep": 3, "stage": "recall", "prompt": "완전미분방정식의 판정 조건을 편도함수로 쓰면 \\(\\frac{∂M}{∂y} = \\)___ 입니다.", "answer": "\\(\\frac{∂N}{∂x}\\)"}], "sourceRef": "Kreyszig 10판 §1.4, eq. (4)-(6)"}, {"id": "integrating-factor", "changeNote": "지적(2026-08-13, 부류 «수식 표기 — 기호끼리의 곱은 붙이고 연산자는 띄운다»): 곱을 공백으로 띄우던 표기를 뒤집었습니다. 기호끼리의 곱은 붙이고, 더하기, 빼기, 등호와 미분자 앞만 띄웁니다.\n조치: 유도 단계의 곱을 붙였습니다.", "kind": "derivation", "sectionRef": "sec-integrating-factor", "topic": "완전미분방정식", "name": "적분인자 — x쪽·y쪽 두 갈래", "appliesTo": "\\(P\\,dx + Q\\,dy = 0\\)인데 **완전 판정이 어긋날 때.** 다음 두 조합 중 **한 변수만의 함수로 떨어지는 쪽**을 골라 씁니다 — 어느 쪽이 될지는 계산해 봐야 압니다.", "latex": [["R(x) = \\frac{1}{Q}\\left(\\frac{∂P}{∂y} - \\frac{∂Q}{∂x}\\right)", "R^{*}(y) = \\frac{1}{P}\\left(\\frac{∂Q}{∂x} - \\frac{∂P}{∂y}\\right)"], ["F(x) = e^{\\int R\\,dx}", "F^{*}(y) = e^{\\int R^{*}\\,dy}"]], "variables": {"F(x)": "\\(x\\)쪽으로 떨어질 때의 적분인자", "F^{*}(y)": "\\(y\\)쪽으로 떨어질 때의 적분인자 — 분모와 빼는 순서가 **함께** 뒤바뀝니다", "R(x)": "\\(\\frac{1}{Q}\\left(\\frac{∂P}{∂y} - \\frac{∂Q}{∂x}\\right)\\)가 \\(x\\)만의 함수일 때 그 함수", "R^{*}(y)": "\\(\\frac{1}{P}\\left(\\frac{∂Q}{∂x} - \\frac{∂P}{∂y}\\right)\\)가 \\(y\\)만의 함수일 때 그 함수", "P": "아직 완전하지 않은 식 \\(P\\,dx + Q\\,dy = 0\\)의 dx 계수", "Q": "dy 계수 (곱해서 완전해지면 \\(M = FP\\), \\(N = FQ\\)로 이름이 바뀝니다)"}, "derivationSteps": [{"text": "비완전식에 미지의 함수 \\(F\\)를 곱해 **완전해지기를 요구합니다.** 아직 완전하지 않으므로 \\(M\\)·\\(N\\)이 아니라 \\(P\\)·\\(Q\\)로 씁니다 — 기호가 곧 상태 표시다.", "equations": ["P\\,dx + Q\\,dy = 0", "FP\\,dx + FQ\\,dy = 0", "\\frac{∂(FP)}{∂y} = \\frac{∂(FQ)}{∂x}"]}, {"text": "**\\(F = F(x)\\)라 가정합니다.** 그러면 \\(\\frac{∂F}{∂y} = 0\\)이라 좌변이 간단해지고, 우변은 곱미분으로 두 항이 됩니다.", "equations": ["F\\frac{∂P}{∂y} = F'\\,Q + F\\frac{∂Q}{∂x}", "F'\\,Q = F\\left(\\frac{∂P}{∂y} - \\frac{∂Q}{∂x}\\right)"]}, {"text": "양변을 \\(FQ\\)로 나누면 좌변이 \\(\\ln F\\)의 도함수가 됩니다. 우변을 \\(R\\)이라 부르는데, **실제로 \\(x\\)만의 함수로 떨어질 때만** 이 가정이 성립합니다.", "equations": ["\\frac{F'}{F} = \\frac{1}{Q}\\left(\\frac{∂P}{∂y} - \\frac{∂Q}{∂x}\\right) = R(x)", "\\ln F = \\int R\\,dx", "F(x) = e^{\\int R\\,dx}"]}, {"text": "**\\(x\\)쪽이 안 떨어지면 거기서 멈추지 말고 \\(y\\)쪽을 시도합니다.** 이번에는 \\(F = F^{*}(y)\\)로 가정하고 같은 논리를 돌리면, **분모와 빼는 순서가 함께 뒤바뀐** 짝이 나옵니다 — 한쪽만 바꿔 쓰면 부호가 틀립니다. 어느 쪽도 한 변수로 안 떨어지면 이 정리로는 적분인자를 구할 수 없습니다.", "equations": ["R^{*}(y) = \\frac{1}{P}\\left(\\frac{∂Q}{∂x} - \\frac{∂P}{∂y}\\right)", "F^{*}(y) = e^{\\int R^{*}\\,dy}"]}, {"text": "여기까지가 공식입니다. 이제 **실제로 한 번 돌려 봅니다** — 출발점은 공식이 아니라 **완전 판정이 어긋나는 것을 확인하는 것**입니다. 적분인자는 이 실패 때문에 꺼내는 도구이므로, 실패를 보지 않고 공식부터 쓰면 왜 이 도구를 쓰는지가 사라집니다.", "equations": ["(3xy + y^{2})\\,dx + (x^{2} + xy)\\,dy = 0", "\\frac{∂P}{∂y} = 3x + 2y", "\\frac{∂Q}{∂x} = 2x + y", "\\frac{∂P}{∂y} ≠ \\frac{∂Q}{∂x}"]}, {"text": "어긋났으니 \\(x\\)쪽 조합을 계산합니다. 약분해 보면 \\(x\\)만의 함수로 떨어지므로 \\(F(x)\\)가 존재합니다 — **떨어지는지 아닌지는 이 약분을 해 봐야 압니다.** 지수와 로그가 서로 지워지는 마지막 줄까지 적습니다.", "equations": ["\\frac{∂P}{∂y} - \\frac{∂Q}{∂x} = (3x + 2y) - (2x + y) = x + y", "R = \\frac{1}{Q}\\left(\\frac{∂P}{∂y} - \\frac{∂Q}{∂x}\\right) = \\frac{x + y}{x^{2} + xy}", "R = \\frac{x + y}{x(x + y)} = \\frac{1}{x}", "F = e^{\\int \\frac{1}{x}\\,dx} = e^{\\ln x} = x"]}, {"text": "구한 \\(F\\)를 곱하면 이름이 \\(M = FP\\), \\(N = FQ\\)로 바뀝니다. 아래는 **정말 완전해졌는지 한 번만 보여 두는 것**입니다 — 매번 해야 하는 절차가 아니라, 이 공식이 왜 참인지 눈으로 한 번 확인하는 자리입니다. 두 편도함수가 같은 식으로 떨어지면 완전해진 것이고, 그때부터 앞의 완전미분 절차를 그대로 씁니다.\n\n이 순서가 문풀과 같습니다:\n\n\\((x^{2} + y^{2})\\,dx - 2xy\\,dy = 0\\)", "equations": ["M = FP = x(3xy + y^{2}) = 3x^{2}y + xy^{2}", "N = FQ = x(x^{2} + xy) = x^{3} + x^{2}y", "\\frac{∂M}{∂y} = 3x^{2} + 2xy", "\\frac{∂N}{∂x} = 3x^{2} + 2xy", "\\frac{∂M}{∂y} = \\frac{∂N}{∂x}"]}], "assumptions": ["\\(R = \\frac{1}{Q}\\left(\\frac{∂P}{∂y} - \\frac{∂Q}{∂x}\\right)\\)가 \\(x\\)만의 함수여야 \\(F(x)\\)가 존재합니다.", "어느 변수로도 한 변수 함수가 안 되면 이 정리로는 적분인자를 못 구합니다."], "notes": "곱한 뒤에는 완전 조건을 다시 확인하고(\\(M = FP\\), \\(N = FQ\\)) 완전미분방정식 풀이로 넘어갑니다.", "comprehensionChecks": [], "sourceRef": "Kreyszig 10판 §1.4, Theorem 1, eq. (16)"}]}, "practice": [{"id": "prac-dir-euler", "figureMode": "given", "diagrams": [{"id": "fig-prac-dir-euler", "title": "방향장 위를 걷는 두 걸음", "numericLabels": "intentional", "svg": "<svg viewBox='0 88 420 292' xmlns='http://www.w3.org/2000/svg' role='img' aria-label='가로세로 축 위에 짧은 기울기 선분이 격자로 놓인 방향장이 있고, 초기점에서 두 번 꺾이는 굵은 꺾은선이 오일러 걸음을 나타낸다. 기울기가 0 이 되는 등경사선이 파선으로 비스듬히 지난다'><line x1='79.1' y1='250.3' x2='100.9' y2='253.7' stroke='#7f8aa0' stroke-width='1.4'/><line x1='139.0' y1='252.9' x2='161.0' y2='251.1' stroke='#7f8aa0' stroke-width='1.4'/><line x1='199.5' y1='255.4' x2='220.5' y2='248.6' stroke='#7f8aa0' stroke-width='1.4'/><line x1='260.4' y1='257.4' x2='279.6' y2='246.6' stroke='#7f8aa0' stroke-width='1.4'/>< \)로 나란합니다. 방향장을 빠르게 채우는 요령이 이것입니다."}], "expectedOutput": "\\(y(1) \\approx 0.5\\) · 등경사선 \\(y = x - k\\)", "relatedFormulas": []}, {"id": "prac-sep-basic", "changeNote": "지적(2026-08-13, 부류 «수식 표기 — 기호끼리의 곱은 붙이고 연산자는 띄운다»): 곱을 공백으로 띄우던 표기를 뒤집었습니다. 기호끼리의 곱은 붙이고, 더하기, 빼기, 등호와 미분자 앞만 띄웁니다.\n조치: 풀이 뼈대의 곱을 붙였습니다. · 지적(2026-09-19, 부류 «최종 답이 빈칸을 되읊는다») 「최종 답」에서 빈칸 답을 다시 적던 문장을 걷었습니다.", "stage": "single_blank", "difficulty": "basic", "prompt": "Find the general solution of \\(y' = \\frac{x}{y}\\) by separation of variables. Move \\(y\\) to the left side and \\(x\\) to the right, then integrate each side.", "diagrams": [], "solutionTemplate": "yy' = x\n➜ y\\,dy = ___BLANK_1___\n➜ \\frac{y^2}{2} = ___BLANK_2___\n➜ ___BLANK_3___", "blanks": [{"id": "BLANK_1", "hint": "오른쪽으로 분리된 항", "answer": "x\\,dx", "explanation": "\\(y' = \\frac{dy}{dx}\\)이므로 \\(y\\,dy = x\\,dx\\)로 변수를 가릅니다."}, {"id": "BLANK_2", "hint": "오른쪽 적분(상수 포함)", "answer": "\\frac{x^2}{2} + c", "explanation": "\\(\\int x\\,dx = \\frac{x^2}{2}\\): 적분과 동시에 상수 \\(c\\)를 붙입니다."}, {"id": "BLANK_3", "hint": "정리한 일반해(음함수꼴)", "answer": "y^2 = x^2 + C", "explanation": "양변에 2를 곱하고 \\(2c = C\\)로 두면 \\(y^2 = x^2 + C\\)입니다."}], "expectedOutput": "", "relatedFormulas": ["separable-general"], "_changed": ["expectedOutput"], "_changeLevel": "major"}, {"id": "prac-sep-subst", "changeNote": "지적(2026-08-08, 부류 «프라임 조판»): 산문에 날것으로 있던 도함수 기호가 화면에서 곧은 따옴표로 보이고, 프라임 뒤에 기호를 붙여 쓰면 렌더러가 받지 못했습니다.\n조치: 프라임 뒤 곱을 띄워 도함수 기호가 다음 글자에 붙지 않게 했고, 나머지 곱은 붙였습니다.", "stage": "process_fill", "difficulty": "intermediate", "prompt": "Find the general solution of \\(y' = 1 + \\frac{y}{x}\\) by substitution. Because the right side is a function of \\(\\frac{y}{x}\\), start by setting \\(u = \\frac{y}{x}\\) and rewrite the equation in \\(u\\) alone.", "diagrams": [], "solutionTemplate": "u = \\frac{y}{x}\n➜ y = ux\n➜ y' = u'\\,x + u\n➜ u'\\,x + u = 1 + u\n➜ u'\\,x = ___BLANK_1___\n➜ u' = ___BLANK_2___\n➜ u = ___BLANK_3___\n➜ y = ux = ___BLANK_4___", "blanks": [{"id": "BLANK_1", "hint": "\\(u\\)가 소거된 뒤", "answer": "1", "explanation": "\\(u'\\,x + u = 1 + u\\)에서 양변의 \\(u\\)가 지워져 \\(u'\\,x = 1\\)만 남습니다."}, {"id": "BLANK_2", "hint": "양변을 \\(x\\)로 나눕니다", "answer": "\\frac{1}{x}", "explanation": "\\(u'\\,x = 1\\)의 양변을 \\(x\\)로 나누면 \\(u' = \\frac{1}{x}\\)입니다. 무엇을 적분할지가 이 줄에서 드러납니다."}, {"id": "BLANK_3", "hint": "\\(u' = \\frac{1}{x}\\)를 적분", "answer": "\\ln|x| + c", "explanation": "\\(\\int \\frac{1}{x}\\,dx = \\ln|x|\\)이므로 \\(u = \\ln|x| + c\\)입니다. 적분과 동시에 상수를 붙입니다."}, {"id": "BLANK_4", "hint": "\\(y = ux\\)로 되돌립니다", "answer": "x\\ln|x| + cx", "explanation": "\\(y = ux\\)로 되돌리면 \\(y = x(\\ln|x| + c) = x\\ln|x| + cx\\)입니다."}], "expectedOutput": "\\(y = x\\ln|x| + Cx\\)", "relatedFormulas": ["separable-general"]}, {"id": "prac-exact-basic", "stage": "process_fill", "difficulty": "basic", "prompt": "The equation \\((2xy + 3)\\,dx + (x^{2} - 1)\\,dy = 0\\) is **exact**. Confirm exactness with the test \\(\\frac{∂M}{∂y} = \\frac{∂N}{∂x}\\), then recover the potential \\(u\\) and give the general solution.", "diagrams": [], "solutionTemplate": "M = 2xy + 3,\\quad N = x^{2} - 1\n➜ \\frac{∂M}{∂y} = 2x,\\quad \\frac{∂N}{∂x} = ___BLANK_1___\n➜ 판정: 두 값이 같으므로 완전\n➜ u = \\int M\\,dx = x^{2}y + 3x + k(y)\n➜ \\frac{∂u}{∂y} = x^{2} + k'(y) = N = x^{2} - 1\n➜ k'(y) = ___BLANK_2___\n➜ u = ___BLANK_3___ = c", "blanks": [{"id": "BLANK_1", "hint": "\\(N\\)을 \\(x\\)로 미분", "answer": "2x", "explanation": "\\(\\frac{∂}{∂x}(x^{2} - 1) = 2x\\): \\(\\frac{∂M}{∂y}\\)와 같으므로 완전미분방정식입니다 — 여기서 갈라졌다면 적분인자를 찾아야 합니다."}, {"id": "BLANK_2", "hint": "\\(x^{2}\\)이 양쪽에서 지워집니다", "answer": "-1", "explanation": "\\(x^{2} + k'(y) = x^{2} - 1\\)이므로 \\(k'(y) = -1\\)입니다. \\(k\\)가 \\(y\\)만의 함수로 떨어지는 것이 완전성의 증거입니다 — \\(x\\)가 남으면 판정을 잘못한 것입니다."}, {"id": "BLANK_3", "hint": "\\(k(y) = -y\\)를 되돌려 넣습니다", "answer": "x^{2}y + 3x - y", "explanation": "\\(k(y) = -y\\)이므로 \\(u = x^{2}y + 3x - y = c\\)(음함수꼴). 굳이 \\(y\\)로 풀면 \\(y = \\frac{c - 3x}{x^{2} - 1}\\)입니다."}], "changeNote": "지적(2026-09-19, 부류 «최종 답이 빈칸을 되읊는다») 「최종 답」에서 빈칸 답을 다시 적던 문장을 걷었습니다.", "expectedOutput": "", "relatedFormulas": ["exact-condition"], "_changed": ["expectedOutput"], "_changeLevel": "major"}, {"id": "prac-if-formula", "stage": "process_fill", "difficulty": "intermediate", "prompt": "The equation \\((x^{2} + y^{2})\\,dx - 2xy\\,dy = 0\\) **fails** the exactness test. Build \\(F(x) = e^{\\int R\\,dx}\\), a factor in \\(x\\) alone, multiply through to restore exactness, and give the general solution (\\(x > 0\\)).", "diagrams": [], "solutionTemplate": "P = x^{2} + y^{2},\\quad Q = -2xy\n➜ \\frac{∂P}{∂y} = 2y,\\quad \\frac{∂Q}{∂x} = -2y \\;:\\; 완전하지 않습니다\n➜ R = \\frac{1}{Q}\\left(\\frac{∂P}{∂y} - \\frac{∂Q}{∂x}\\right) = \\frac{4y}{-2xy} = ___BLANK_1___\n➜ x만의 함수로 떨어졌습니다 → F(x) = e^{\\int R\\,dx} = ___BLANK_2___\n➜ M = FP = 1 + \\frac{y^{2}}{x^{2}},\\quad N = FQ = -\\frac{2y}{x}\n➜ 재판정: \\frac{∂M}{∂y} = \\frac{2y}{x^{2}} = \\frac{∂N}{∂x} \\;:\\; 완전\n➜ u = \\int M\\,dx = ___BLANK_3___ = c", "blanks": [{"id": "BLANK_1", "hint": "\\(y\\)가 약분됩니다", "answer": "-\\frac{2}{x}", "explanation": "\\(\\frac{2y - (-2y)}{-2xy} = \\frac{4y}{-2xy} = -\\frac{2}{x}\\)입니다. **\\(y\\)가 남지 않고 약분되는지가 이 방법을 쓸 수 있는 조건**입니다 — 남으면 \\(y\\)만의 적분인자 \\(F^{*}(y)\\) 쪽을 시도합니다."}, {"id": "BLANK_2", "hint": "\\(\\int -\\frac{2}{x}dx = -2\\ln x\\)", "answer": "x^{-2}", "explanation": "\\(e^{-2\\ln x} = x^{-2}\\)입니다. 적분상수는 붙이지 않습니다 — 상수배는 완전성을 바꾸지 않습니다."}, {"id": "BLANK_3", "hint": "\\(k(y)\\)를 정하면 0이 됩니다", "answer": "x - \\frac{y^{2}}{x}", "explanation": "\\(\\int\\left(1 + \\frac{y^{2}}{x^{2}}\\right)dx = x - \\frac{y^{2}}{x} + k(y)\\)이고, \\(\\frac{∂u}{∂y} = -\\frac{2y}{x} = N\\)이라 \\(k'(y) = 0\\)입니다. 따라서 \\(x - \\frac{y^{2}}{x} = c\\)입니다."}], "changeNote": "지적(2026-09-19, 부류 «최종 답이 빈칸을 되읊는다») 「최종 답」에서 빈칸 답을 다시 적던 문장을 걷었습니다.", "expectedOutput": "", "relatedFormulas": ["integrating-factor", "exact-condition"], "_changed": ["expectedOutput"], "_changeLevel": "major"}, {"id": "prac-linear-if", "changeNote": "지적(2026-08-13, 부류 «수식 표기 — 기호끼리의 곱은 붙이고 연산자는 띄운다»): 곱을 공백으로 띄우던 표기를 뒤집었습니다. 기호끼리의 곱은 붙이고, 더하기, 빼기, 등호와 미분자 앞만 띄웁니다.\n조치: 풀이 뼈대와 해설의 곱을 붙였습니다. · 지적(2026-09-19, 부류 «최종 답이 빈칸을 되읊는다») 「최종 답」에서 빈칸 답을 다시 적던 문장을 걷었습니다.", "stage": "single_blank", "difficulty": "basic", "prompt": "A linear ODE is given in standard form, with \\(p = -2\\) and \\(r = e^{x}\\) as its coefficients. Do not quote the closed-form result; walk through the integrating-factor procedure instead — multiplying both sides by \\(F = e^{h}\\), where \\(h = \\int p\\,dx\\), collapses the left side into the single term \\((Fy)'\\) in one step.", "diagrams": [], "solutionTemplate": "y' - 2y = e^{x}\n➜ h = \\int p\\,dx = -2x\n➜ F = e^{h} = e^{-2x}\n➜ e^{-2x}y' - 2e^{-2x}y = e^{-2x}e^{x}\n➜ (e^{-2x}y)' = ___BLANK_1___\n➜ e^{-2x}y = ___BLANK_2___\n➜ y = ___BLANK_3___", "blanks": [{"id": "BLANK_1", "hint": "우변에 적분인자를 곱합니다", "answer": "e^{-x}", "explanation": "좌변은 곱의 미분이라 \\((e^{-2x}y)' = e^{-2x}y' - 2e^{-2x}y\\)로 한 덩어리가 됩니다 — 바로 윗줄이 그것입니다. 우변은 \\(e^{-2x}e^{x} = e^{-x}\\)입니다."}, {"id": "BLANK_2", "hint": "적분(상수 포함)", "answer": "-e^{-x} + c", "explanation": "\\(\\int e^{-x}dx = -e^{-x}\\), 적분과 동시에 상수 \\(c\\)를 붙입니다."}, {"id": "BLANK_3", "hint": "\\(e^{2x}\\)를 곱해 정리", "answer": "-e^{x} + ce^{2x}", "explanation": "양변에 \\(e^{2x}\\)를 곱하면 일반해가 나옵니다."}], "expectedOutput": "", "relatedFormulas": ["linear-general"], "_changed": ["expectedOutput"], "_changeLevel": "major"}, {"id": "prac-bern-subst", "changeNote": "지적(2026-08-13, 부류 «수식 표기 — 기호끼리의 곱은 붙이고 연산자는 띄운다»): 곱을 공백으로 띄우던 표기를 뒤집었습니다. 기호끼리의 곱은 붙이고, 더하기, 빼기, 등호와 미분자 앞만 띄웁니다.\n조치: 풀이 뼈대와 해설의 곱을 붙였습니다. · 지적(2026-09-19, 부류 «최종 답이 빈칸을 되읊는다») 「최종 답」에서 빈칸 답을 다시 적던 문장을 걷었습니다.", "stage": "process_fill", "difficulty": "intermediate", "prompt": "Find the general solution of \\(y' + y = y^2\\) by substitution. Since \\(a = 2\\), set \\(u = y^{1-a} = y^{-1}\\) before differentiating.", "diagrams": [], "solutionTemplate": "u = y^{-1}\n➜ u' = -y^{-2}y'\n➜ u' = -y^{-2}(y^2 - y) = -1 + y^{-1} = ___ 1.5 베르누이의 예제)뿐이다. **회로 예제는 0건이다.** §1.4는 적분인자를 x만의 함수 F(x)와 y만의 함수 F*(y) 두 경우로 나눠 다룬다(p.17).", "유튜브부교재": "유튜브 강의 PDF — 01강(변수분리)~06강(베르누이). 해설 연습문제 001~042(변수분리), 043~080(치환), 081~115(완전), 116~144(적분인자), 145~172(선형), 173~191(베르누이) 참조. 참조·자작 변형만(원문 복사 금지)."}, "supplementNotes": [{"source": "유튜브부교재", "note": "부교재는 §1.3 변수분리에 연습문제 001~080을 배정해 촘촘하다. 또 교재에 없는 리카티 방정식(07강)을 추가로 다루지만, 수업·시험 범위 밖이라 본 자료에서는 제외한다(필요 시 제어공학 연결 각주로만)."}, {"source": "수업ppt", "note": "ppt의 '1.6 Existence and Uniqueness'는 교재 번호로는 §1.7이다(교재 §1.6 직교궤적은 건너뜀). 응용 수준은 지수 성장·감쇠와 로지스틱까지이고 그 위는 싣지 않는다. ★ 정정 2026-07-26: 이 메모는 원래 '응용 예제는 RL회로·로지스틱 수준'이라고 적고 있었으나, ppt를 실측하니 **회로 예제가 0건**이었다(ch06 ppt도 'mechanical or electrical system'이라는 일반 문구 1건뿐). 교재(Kreyszig)에는 RLC가 있지만 수업 범위의 정본은 ppt다 — 없는 것을 있다고 적은 단정이었고(규칙 2 위반) 그 메모가 이후 콘텐츠 판단의 근거로 재사용됐다. 회로 소재는 전 챕터에서 제외하고, 1계 선형의 대표 응용은 기계 맥락인 뉴턴 냉각을 쓴다."}], "problems": [{"id": "prob-dir-01", "difficulty": "basic", "prompt": "For the autonomous equation \\(y' = y(3 - y)\\), find every equilibrium solution and classify each one as stable or unstable. Then state the value approached as \\(x \\to \\infty\\) by the solution starting at \\(y(0) = 1\\), **without integrating**.", "diagrams": [], "answer": "평형은 \\(y \\equiv 0\\)(불안정)과 \\(y \\equiv 3\\)(안정). \\(y(0) = 1\\)이면 \\(y \\to 3\\)입니다.", "solutionOutline": [{"text": "평형은 기울기가 0인 상수해입니다 — \\(f(y) = 0\\)의 근을 찾습니다.", "equations": ["f(y) = y(3 - y) = 0", "y = 0,\\quad y = 3"]}, {"text": "안정성은 평형에서의 \\(f'\\) 부호로 갈립니다. 음수면 양쪽 화살표가 평형을 향합니다.", "equations": ["f'(y) = 3 - 2y", "f'(0) = 3 > 0", "f'(3) = -3 < 0"]}, {"text": "부호를 읽습니다.", "equations": ["y \\equiv 0:\\ \\text{불안정}", "y \\equiv 3:\\ \\text{안정}"]}, {"text": "\\(0 < y < 3\\)에서는 \\(f > 0\\)이라 해가 증가하고, 위쪽 평형이 안정이므로 그리로 수렴합니다. 두 평형 사이에서는 유일성 때문에 해가 평형을 가로지를 수 없습니다.", "equations": ["0 < y < 3 \\;:\\; y' > 0", "y(0) = 1 \\;\\to\\; y \\to 3"]}], "sourceRef": "Kreyszig 10판 §1.2 방향장·평형 (자작 변형·수치 독립 검산 tools/verify_ode_answer.py)", "relatedFormulas": []}, {"id": "prob-dir-02", "changeNote": "지적(2026-08-13, 부류 «수식 표기 — 기호끼리의 곱은 붙이고 연산자는 띄운다»): 곱을 공백으로 띄우던 표기를 뒤집었습니다. 기호끼리의 곱은 붙이고, 더하기, 빼기, 등호와 미분자 앞만 띄웁니다.\n조치: 답과 풀이의 곱을 붙이고 괄호 안 빼기를 띄웠습니다.", "difficulty": "intermediate", "prompt": "Read the direction field of \\(y' = x - y\\) through its isoclines. ⑴ Find the locus of points whose slope equals a constant \\(k\\): that is, the isoclines. ⑵ Among those loci, find the straight line that **is itself a solution**. ⑶ Using the direction field alone, explain why that line is an asymptote of every solution as \\(x\\) grows without bound.", "diagrams": [], "answer": "⑴ \\(y = x - k\\) ⑵ \\(y = x - 1\\) ⑶ 그 직선 위쪽에서는 기울기가 1보다 작아 내려오고 아래쪽에서는 1보다 커서 올라오므로, 모든 해가 그 직선으로 몰립니다.", "solutionOutline": [{"text": "등경사선은 \\(f(x, y) = k\\)인 점들입니다.", "equations": ["x - y = k", "y = x - k"]}, {"text": "이 직선이 해가 되려면 **직선의 기울기와 방향장의 기울기가 같아야** 합니다. 직선 \\(y = x - k\\)의 기울기는 1이고, 그 위의 방향장 기울기는 \\(k\\)입니다.", "equations": ["k = 1", "y = x - 1"]}, {"text": "실제로 대입해 확인합니다 — 확인 없이 넘어가지 않습니다.", "equations": ["y = x - 1 \\;\\to\\; y' = 1", "x - y = x - (x - 1) = 1"]}, {"text": "직선을 기준으로 위·아래에서 기울기를 비교합니다. 기준선의 기울기 1보다 작으면 기준선 쪽으로 내려오고, 크면 올라옵니다.", "equations": ["y > x - 1 \\;\\to\\; y' = x - y < 1", "y < x - 1 \\;\\to\\; y' = x - y > 1"]}, {"text": "양쪽에서 모두 \\(y = x - 1\\)로 다가가므로 그것이 점근선입니다. (일반해 \\(y = x - 1 + ce^{-x}\\)가 같은 말을 합니다 — 방향장만으로 먼저 읽은 것이 요점입니다.)", "equations": ["x \\to \\infty \\;\\to\\; ce^{-x} \\to 0", "y \\to x - 1"]}], "sourceRef": "Kreyszig 10판 §1.2 등경사선 (자작 변형·수치 독립 검산 tools/verify_ode_answer.py)", "relatedFormulas": []}, {"id": "prob-dir-03", "changeNote": "지적(2026-08-13, 부류 «수식 표기 — 기호끼리의 곱은 붙이고 연산자는 띄운다»): 곱을 공백으로 띄우던 표기를 뒤집었습니다. 기호끼리의 곱은 붙이고, 더하기, 빼기, 등호와 미분자 앞만 띄웁니다.\n조치: 풀이에서 분수 앞 가는 공백을 없애 곱을 붙였습니다.", "difficulty": "advanced", "prompt": "Approximate \\(y' = x - y,\\ y(0) = 1\\) up to \\(x = 1\\) using Euler's method. ⑴ Compute the approximation to \\(y(1)\\) with step sizes \\(h = 0.5\\) and \\(h = 0.25\\) in turn. ⑵ Verify that the exact soluti
