     닷이 분수선에 붙고 자기 글자에서는 떠 있어, 어느 쪽에 속한 기호인지 안 읽힌다.

     ★ **전역 `.dot-mark{top}` 을 내리면 안 된다** — 본문·근호의 닷까지 글자에 붙어
     2026-08-02 에 지적받은 상태로 되돌아간다. 분수 분모는 **위에 분수선이라는 기준선이 있는**
     특수 문맥이므로 그 문맥에서만 조정한다(`:has(.sqrt)` 가 7px 별도 값을 갖는 것과 같은 논리).

     값이 `0` 인 이유: 분모에서는 위 `padding-top:.34em` 이 **이미 분수선과의 간격을 만든다.**
     그러니 닷은 상자 밖으로 더 나갈 이유가 없고, em 상자 위 모서리에 두면 된다.
     **DOM 실측 결과 7.45 : 4.59 = 1.62 : 1**(수정 전 1 : 5.17). 닷이 자기 글자 쪽에 조금 더
     가까운 것은 의도다 — 닷은 `m` 의 악센트이므로 한 덩어리로 읽혀야 한다.
     분수 전체 높이는 안 변한다(`padding` 을 그대로 뒀다).
     `.dot{line-height:1}` 덕분에 이 상자는 line-height 에 끌려가지 않으므로,
     08-02 가 막은 「문맥마다 달라지는 것」은 여전히 막혀 있다. */
  /* ★ `top:0` 은 **딱 붙어 보였다** (2026-08-29, 사용자: *[발화 생략]* —
     DOM 실측 −2.78px, 즉 닷이 글자 상자에 살짝 겹쳤다). `-.15em`으로 아주 약간 띄운다.
     분자·분모 둘 다 같은 값을 쓴다(위 `.frac-num:has(.dot) .dot-mark` 가 짝이다). */
  .frac-den:has(.dot) .dot-mark{top:-.15em;}
  .sym{white-space:nowrap;}
  /* 뷰어 변경 배너 — 검수 모드에서만, 읽기 폭 안에서. 색은 «검수» 계열(구리)로 두어
     데이터 변경점(파랑 계열 마크)과 **한눈에 다른 층**임을 드러낸다. */
  .viewer-changes{max-width:640px; margin:14px auto 0; padding:12px 14px; border-radius:10px;
                  border:1px solid var(--copper); background:var(--paper);
                  font-size:var(--fs-small); line-height:1.7;}
  .viewer-changes .vc-head{margin-bottom:6px;}
  .viewer-changes .vc-list{margin:0 0 8px; padding-left:18px;}
  .viewer-changes .vc-list li{margin:2px 0;}
  .viewer-changes .vc-where{color:var(--muted);}
  .viewer-changes .vc-ok{border:1px solid var(--line-strong); background:transparent;
                         border-radius:6px; padding:3px 10px; cursor:pointer; font:inherit;}
  .xlink{color:var(--blue); text-decoration:underline; text-decoration-style:dotted; text-underline-offset:3px; font-weight:600;}
  .xlink:hover{color:var(--copper); text-decoration-style:solid;}

  /* pitfalls — "여기서 잘 놓쳐요" 경고 콜아웃 (이해도 체크와 시각 구분) */
  /* ★ 세로 여백 실측 조정 (2026-09-09, 사용자: *[발화 생략]*). 고친 값은 셋이고 근거는 겹침이다 —
     머리와 첫 항목 사이는 `margin-bottom 4` + `margin-top 7` 이 **더해져 11px** 이었고,
     카드 아래는 `padding 12` + 마지막 항목의 `margin-bottom 7` 이 더해져 **19px** 이었다.
     첫·마지막 항목의 바깥 여백을 0 으로 눌러 겹침을 없애고 안쪽 여백만 남긴다. */
  /* ★ 2026-09-17 (응용고체 ch11 인박스 S11-08) 머리→설명 간격을 줄이되 설명 문단 사이보다는 크게,
     아래 여백은 위 여백에 맞춘다. 옛 `.pitfall-item:first-of-type` 은 머리(`div.pitfall-h`)가 첫 div 라
     첫 항목에 안 걸려, 머리 아래가 3px 이 아니라 7px 이었다(DOM 실측). 인접 선택자로 바꾼다.
     글자 상자 기준 간격: 머리→설명 13.4 · 설명 사이 11.8 · 줄 사이 7.8. 아래 패딩 7 은 한글 마지막 줄
     아래 비어 있는 디센더 몫(≈0.2em)을 빼 위쪽 9 + 머리 반행간과 눈으로 같게 한 값이다. */
  .pitfall{margin-top:14px; background:var(--warn-soft); border:1px solid var(--warn); border-radius:10px; padding:9px 16px 7px; max-width:640px;}
  .pitfall-h{font-size:var(--fs-small); font-weight:700; color:var(--warn); letter-spacing:.02em; margin-bottom:5px;}
  /* ★ 글자를 본문 크기로 올린다 (2026-09-10, 사용자: *[발화 생략]*). 13px 은 **라벨 크기**인데 여기 들어가는 것은 두세
     문장짜리 본문이고, 한 절에 셋이 쌓이면 작은 글씨 벽이 된다. 구분은 이미 배경색과
     테두리가 맡고 있어 **크기로 또 가를 이유가 없다** — 머리(`.pitfall-h`)만 13px 로 남긴다.
     되돌리는 법: 이 줄의 `--fs-body` 를 `--fs-small` 로 되돌린다. */
  /* ★ 2026-09-12 본문급(15.5) → 13 으로 내렸다. 사용자: *[발화 생략]* — 떠올리기(`.cc-body`)와 같은 단. 가볍게 읽히는 곁가지라는 뜻이다. */
  .pitfall-item{font-size:var(--fs-small); margin:4px 0; color:var(--ink); line-height:1.6;}
  .pitfall-h + .pitfall-item{margin-top:0;}
  .pitfall-item:last-of-type{margin-bottom:0;}
  .pitfall-src{display:block; font-size:var(--fs-micro); color:var(--sub); margin-top:3px;}


  /* 연습문제 세트 탭 도구: 섞기 / 틀린 것만 보기 */
  .prob-tools{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;}
  /* ★ `.fslide-btn`(슬라이드 단계 넘김)은 **설정이 아니라 이동**이라 `.tool-toggle` 이 아니다 —
     빌드의 보기 설정 레지스트리 lint 가 `tool-toggle`·`view-tool` 을 「저장되는 설정 컨트롤」로
     읽어 `data-setting-keys` 를 요구한다. 생김새만 같게 두려고 선택자에 함께 적는다
     (규칙을 복사하면 두 벌이 갈라진다). */
  .tool-toggle,.fslide-btn{font-family:inherit; font-size:var(--fs-small); font-weight:600; padding:7px 14px; border-radius:100px; border:1px solid var(--line-strong); background:var(--paper-raised); color:var(--sub); cursor:pointer;}
  .tool-toggle.on{background:var(--sel-soft); color:var(--copper); border-color:var(--sel-line);}
  .prob-empty{padding:26px; text-align:center; color:var(--sub); font-size:var(--fs-small); border:1px dashed var(--line); border-radius:10px;}
  /* 교재 추천 문제 탭 (2026-09-13). 카드 틀은 .qcard 를 그대로 쓰고 머리줄만 따로 둔다. */
  .tb-head{margin-bottom:16px; font-size:var(--fs-small); color:var(--sub);}
  .tb-note{margin-top:4px;}
  .tb-ref{font-weight:700; font-size:var(--fs-head);}
  .tb-topic{font-weight:600; font-size:var(--fs-small); color:var(--sub);}
  .tb-why{margin-top:6px; font-size:var(--fs-small); color:var(--sub);}

  /* O/△/X 자가 채점 (미리보기: 세션 내 유지 — 실사이트에서 localStorage 승격 예정) */
  .selfmark{display:flex; gap:6px; align-items:center; margin-top:12px; padding-top:10px; border-top:1px dashed var(--line);}
  .selfmark-label{font-size:var(--fs-small); color:var(--sub); margin-right:2px;}
  .mark-btn{font-family:inherit; font-size:var(--fs-small); font-weight:700; width:36px; height:30px; border-radius:8px; border:1px solid var(--line-strong); background:var(--paper); color:var(--sub); cursor:pointer;}
  .mark-btn.sel-o{background:var(--s1-soft); color:var(--s1); border-color:var(--s1);}
  .mark-btn.sel-tri{background:var(--s2-soft); color:var(--s2); border-color:var(--s2);}
  .mark-btn.sel-x{background:var(--warn-soft); color:var(--warn); border-color:var(--warn);}

  /* ===== 시험 모드 (chapterNumber 90번대 모의고사 — index.json 의 examMode 로 켠다) =====
     ★ 태블릿이 기본 기기다 (사용자 2026-08-26: *[발화 생략]*). 그래서 **누르는 칸을 크게** 잡고 타이핑은 최종답 한 칸으로 몰았다. */
  .exam-bar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between;
    padding:14px 16px; margin-bottom:14px; border:1px solid var(--line-strong); border-radius:10px; background:var(--paper-raised);}
  .exam-bar-note{font-size:var(--fs-small); color:var(--sub);}
  /* 시험 시간 — 시험지 머리에 적히는 값이라 안내문보다 무겁게 둔다(정지된 진하기만 쓴다). */
  .exam-time{font-size:var(--fs-small); font-weight:700; color:var(--copper);
    background:var(--copper-soft); border-radius:8px; padding:5px 12px; white-space:nowrap;}
  /* 점수 옆 꼬리표 — 이 수가 무엇을 잰 것인지 숫자와 떼어 놓지 않는다. */
  .exam-score-tag{font-size:var(--fs-small); font-weight:700; color:var(--sub);
    background:var(--paper); border:1px solid var(--line-strong); border-radius:100px; padding:3px 10px;}
  /* 서술로 답하는 소문제 — 적을 칸 대신 「어디에 적나」를 말한다(빈자리로 두면 사라진 것으로 읽힌다). */
  .exam-written{font-size:var(--fs-small); color:var(--sub); background:var(--paper-raised);
    border:1px dashed var(--line-strong); border-radius:8px; padding:10px 14px;}
  .exam-btn{font-family:inherit; font-size:var(--fs-small); font-weight:700; padding:9px 18px; border-radius:100px;
    border:1px solid var(--line-strong); background:var(--paper); color:var(--ink); cursor:pointer;}
  .exam-btn.primary{background:var(--sel-soft); color:var(--copper); border-color:var(--sel-line);}
  .exam-pts{font-size:var(--fs-small); font-weight:700; color:var(--sub);}
  .exam-step{margin-top:14px; padding-top:12px; border-top:1px dashed var(--line);}
  .exam-step-label{font-size:var(--fs-small); font-weight:700; color:var(--sub); margin-bottom:6px;}
  .exam-step-prompt{margin-bottom:8px;}
  .exam-opts{display:flex; flex-direction:column; gap:8px;}
  .exam-opt{display:flex; gap:10px; align-items:flex-start; padding:11px 13px; border:1px solid var(--line);
    border-radius:8px; background:var(--paper); cursor:pointer;}
  .exam-opt.picked{background:var(--sel-soft); border-color:var(--sel-line);}
  .exam-opt input{margin-top:3px; flex:none;}
  /* 답안을 내는 자리 — 마지막 문항 다음. 시험지에서 답안지를 내는 지점과 같은 자리다. */
  .exam-submit{display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between;
    margin:22px 0 6px; padding:18px 20px; border:2px solid var(--sel-line); border-radius:10px;
    background:var(--sel-soft);}
  .exam-submit-note{font-size:var(--fs-small); color:var(--sub); flex:1; min-width:0;}
  .exam-submit .exam-btn{flex:none;}
  /* 잠긴 탭 — 숨기지 않는다. 숨기면 「원래 없는 장」과 구별이 안 된다(0장 선례). */
  .tabbtn.locked{opacity:.45; cursor:not-allowed;}
  .exam-ox{display:flex; gap:8px; flex:none;}
  /* ★ O/X 는 **진술 오른쪽**에 붙는다 (2026-08-26, 사용자: *[발화 생략]*).
     여섯 진술이 세로로 이어지는 묶음이라, 진술마다 큰 버튼 두 개가 줄을 하나씩 더 먹으면
     한 화면에 안 들어온다. 좁은 화면에서는 아래로 내려가 눌리는 크기를 잃지 않는다. */
  .exam-ox-line{display:flex; gap:14px; align-items:flex-start; justify-content:space-between;}
  .exam-ox-line .exam-ox-text{flex:1; min-width:0;}
  .exam-ox-btn{font-family:inherit; font-size:var(--fs-small); font-weight:700; min-width:44px; height:34px;
    border-radius:8px; border:1px solid var(--line-strong); background:var(--paper); color:var(--sub); cursor:pointer;}
  @media (max-width:560px){ .exam-ox-line{flex-wrap:wrap;} }
  .exam-ox-btn.picked{background:var(--sel-soft); color:var(--copper); border-color:var(--sel-line);}
  .exam-num{font-family:inherit; font-size:var(--fs-body); padding:10px 12px; width:180px;
    border:1px solid var(--line-strong); border-radius:8px; background:var(--paper); color:var(--ink);}
  .exam-num-unit{margin-left:8px; color:var(--sub); font-size:var(--fs-small);}
  .exam-rows{display:flex; flex-direction:column; gap:8px;}
  .exam-row{display:flex; gap:10px; align-items:center;}
  .exam-row select{font-family:inherit; font-size:var(--fs-small); padding:8px 10px; min-width:96px;
    border:1px solid var(--line-strong); border-radius:8px; background:var(--paper); color:var(--ink);}
  .exam-row-text{flex:1;}
  /* 채점 뒤에만 펴는 식 사슬 — 판정 줄 바로 아래에 세로로 쌓는다(가로 병기 금지 규약). */
  .exam-eq{margin-top:8px; padding-left:4px;}
  .exam-verdict{margin-top:8px; padding:9px 12px; border-radius:8px; font-size:var(--fs-small);}
  .exam-verdict.ok{background:var(--s1-soft); color:var(--s1);}
  .exam-verdict.no{background:var(--warn-soft); color:var(--warn);}
  .exam-score{padding:18px 20px; margin-bottom:14px; border:2px solid var(--sel-line); border-radius:10px; background:var(--sel-soft);}
  .exam-score-big{font-size:calc(var(--fs-body) * 1.6); font-weight:700; color:var(--copper);}
  .exam-wrong{margin-top:10px; font-size:var(--fs-small);}
  .exam-wrong li{margin:4px 0;}
  .exam-sheet{margin-top:16px; border:1px solid var(--line); border-radius:10px; padding:12px 14px; background:var(--paper-raised);}
  .exam-sheet summary{cursor:pointer; font-weight:700; font-size:var(--fs-small); color:var(--sub);}
  .exam-sheet-body{margin-top:12px;}
  .exam-sheet-q{margin:14px 0; padding-bottom:12px; border-bottom:1px dashed var(--line);}
  @media (max-width:640px){
    .exam-num{width:140px;}
    .exam-row{flex-wrap:wrap;}
  }

  /* 점프해 왔을 때만 뜨는 복귀 플로팅 칩 (자가점검·문풀·유도 → 출발지 라벨) */
  #jumpBack{
    position:fixed; right:18px; bottom:18px; z-index:20;
    font-family:inherit; font-size:var(--fs-small); font-weight:700; padding:10px 16px;
    border-radius:100px; border:1px solid var(--copper); background:var(--copper-soft);
    color:var(--copper); cursor:pointer; box-shadow:var(--shadow);
  }
  #jumpBack:hover{background:var(--copper); color:#fff;}

  a:focus-visible, button:focus-visible, summary:focus-visible{outline:2px solid var(--copper); outline-offset:2px;}
  @media (max-width:1180px){
    /* 목차 레일이 떠 있는(fixed) 폭대라 남는 것은 읽기 열 하나뿐이다.
       컨테이너 상한을 **읽기 열 폭에서 역산**해 열이 화면 가운데에 오게 한다 —
       900 으로 고정해 두면 640 열이 왼쪽에 붙고 오른쪽만 크게 비어 보인다
       (2026-07-30 태블릿 실측: 왼쪽 16 · 오른쪽 164). */
    .app-layout{grid-template-columns:minmax(0,1fr); max-width:calc(var(--read-w) + 48px);}
    .shell{grid-column:1; grid-row:1;}
    .theory-toc,.deriv-toc{position:fixed; z-index:30; top:68px; right:16px; width:min(320px,calc(100vw - 32px)); max-height:calc(100vh - 86px); padding:14px; border:1px solid var(--line-strong); border-radius:8px; background:var(--paper-raised); box-shadow:var(--shadow); display:none;}
    html.theory-active .theory-toc.open{display:block;}
    html.derivation-active .deriv-toc.open{display:block;}
    .toc-scrim{z-index:29;}
    .toc-trigger{display:none; min-height:44px; padding:9px 14px; box-shadow:var(--shadow); background:var(--paper-raised); opacity:.92;}
    /* ★ 세로로 쌓는다 — 「챕터」가 먼저 오므로 화면에서는 **목차 위**에 놓인다(사용자 요청
       그대로). 가로로 두면 좁은 화면에서 읽는 열을 가린다. */
    .page[data-page="theory"].active .theory-page-tools,.page[data-page="derivation"].active .deriv-page-tools{display:flex; flex-direction:column; align-items:flex-start; gap:8px; position:fixed; left:16px; bottom:calc(18px + env(safe-area-inset-bottom)); z-index:31; margin:0;}
    .page[data-page="theory"].active .toc-trigger,.page[data-page="derivation"].active .toc-trigger{display:inline-flex; align-items:center;}
    html.cover-out .page[data-page="theory"].active .course-menu.floating,
    html.cover-out .page[data-page="derivation"].active .course-menu.floating{display:inline-flex; align-items:center; min-height:44px; padding:9px 14px; border-radius:100px; box-shadow:var(--shadow); opacity:.92;}
  }
  @media (max-width:960px){
    .app-layout{display:block; max-width:calc(var(--read-w) + 32px); padding:0 16px;}
    .shell{padding-bottom:98px;}
  }
  /* ★ W-50 감사에서 같이 나온 것 (2026-07-30) — **1181~1319 띠도 읽기 열을 화면 중앙에** 둔다.
     이날의 중앙 정렬 개정은 ≥1320 과 ≤1180 만 손봤고, 이 띠는 옛 규칙
     (`max-width:1120px; margin:0 auto` + `minmax(0,900px)` 트랙)이 그대로였다.
     실측 1250×900 이론 탭: 읽기 열 중심 402 · 화면 중심 625 — **223px 왼쪽**.
     사용자가 지적한 인스턴스는 아니지만 *같은 부류*(읽기 열이 화면 중앙에서 벗어남)라 함께 고친다.
     식은 위·아래 구간과 같은 꼴이다 — 왼쪽 여백을 `--read-w` 에서 역산하고, 우측 소주제 레일은
     그 바깥으로 흘린다(`width:auto` 라 남는 폭만 쓰므로 가로 스크롤이 생기지 않는다). */
  @media (min-width:1181px) and (max-width:1319px){
    .app-layout{
      grid-template-columns:minmax(0,var(--read-w)) 190px;
      margin-left:max(0px, calc(50vw - var(--read-w)/2 - 24px));
      margin-right:auto;
    }
  }
  @media (min-width:1320px){
    /* ★ 2026-07-30 개정 — **읽기 열이 화면 중앙에 오도록** 컨테이너를 민다.
       옛 규칙은 `margin-left: max(0, (100vw - 1960px)/2)` 라는 **고정 보정**이었다.
       본문이 900 이던 시절에는 그럭저럭 맞았지만, W-40 으로 읽기 열을 640 으로 줄이자
       1920 화면에서 열 중심이 667 로 **화면 중심(960)에서 293px 벗어났다**
       (사용자: *[발화 생략]*). 폭을 줄인 게 문제가 아니라 **왼쪽 정렬이 드러난 것**이다.
       그래서 보정값을 상수가 아니라 **읽기 열 폭에서 역산**한다 — 폭을 또 바꿔도 따라온다. */
    .app-layout{
      max-width:1480px;
      margin-left:max(0px, calc(50vw - clamp(240px,16vw,320px) - 40px - var(--read-w)/2));
      margin-right:auto;
      grid-template-columns:clamp(240px,16vw,320px) minmax(0,var(--read-w)) 180px;
      gap:20px;
      padding:0 20px;
    }
    .course-pane{grid-column:1; grid-row:1; position:sticky; z-index:auto; top:18px; align-self:start; width:auto; max-height:calc(100vh - 36px); overflow:auto; padding:112px 0 18px; background:transparent; border:0; box-shadow:none; transform:none; transition:none;}

    .shell{grid-column:2;}
    .theory-toc,.deriv-toc{grid-column:3;}
    .course-menu,.course-scrim{display:none !important;}
  }
  /* ★ W-50 (2026-07-30) — 넓은 화면 문풀 탭: **좌측 과목 레일 열을 유지**한 채 본문만 넓힌다.
     위 1180px 블록의 1열 선언을 여기서 2열로 되돌린다(같은 특이도라 뒤에 온 이 선언이 이긴다).
     `(orientation:landscape)` 로 묶는 이유: 문풀 2열 카드(`html.practice-active .pcard`)가
     그 조건에서만 켜지므로, 세로 화면에서 본문 트랙만 1100 이 되어 640 카드가 왼쪽에 붙는
     상태를 만들지 않기 위해서다.
     중앙 보정 식은 이론 탭과 **같은 꼴**이고 본문 폭만 다르다 — `--read-w` 자리에 `--practice-w`.
     40px = gap 20 + padding 20. 상수가 아니라 변수에서 역산하므로 폭을 또 바꿔도 따라온다. */
  @media (orientation:landscape) and (min-width:1320px){
    html.practice-active .app-layout,
    html.problems-active .app-layout{
      grid-template-columns:clamp(240px,16vw,320px) minmax(0,var(--practice-w));
      /* ★ 상한도 `--practice-w` 에서 역산한다 (2026-08-01, 사용자 요청으로 총폭을 키우며).
         예전에는 `1480px` 상수였고, 그래서 `--practice-w` 를 1100 → 1360 으로 올려도
         **우측 열이 안 늘었다**(실측 1920: 378 → 391px 뿐). 트랙은 이미 변수였는데
         **바깥 통이 상수라 잘린 것**이다 — 위 `margin-left` 가 변수에서 역산하는 것과
         같은 이유로 여기도 역산해야 한다. 60px = gap 20 + padding 40. */
      max-width:calc(clamp(240px,16vw,320px) + var(--practice-w) + 60px);
      margin-left:max(0px, calc(50vw - clamp(240px,16vw,320px) - 40px - var(--practice-w)/2));
      margin-right:auto;
    }
  }
  /* 태블릿·터치: 화면 폭은 줄이고, 실제 누를 수 있는 면적은 44px 이상으로 유지한다. */

    }
    .stepper-dot::after{

    #jumpBack{right:14px; bottom:calc(18px + env(safe-area-inset-bottom)); min-height:44px;}
    .view-tools{order:3; width:100%; justify-content:flex-end; margin-left:0;}
    .view-tool{min-height:44px; min-width:44px;}
    .view-tool-fit{min-width:auto;}
  }

<script>

var chapterStoragePrefix = (CH.subject || 'thermo') + ':ch' + String(CH.chapterNumber).padStart(2, '0');
function readStoredJson(key, fallback){
  try {
    var value = JSON.parse(localStorage.getItem(key) || 'null');
    return value && typeof value === 'object' && !Array.isArray(value) ? value : fallback;
  } catch(ignore) { return fallback; }
}
function writeStoredJson(key, value){

}

Object.keys(viewerSettingDefaults).forEach(function(key){

}

// {i:인덱스, fp:목록 지문}. 지문이 다르면 버린다 — `reviewPlanFingerprint` 주석이 정본.

function renderCourseTree(){
  var current = Number(CH.chapterNumber);
  // ★★ **사이드바는 «지금 보고 있는 과목» 만 보여준다** (2026-08-15, 사용자 지시:
  //   *[발화 생략]*).

  //   ⑴ 기본값을 본 사람과 안 본 사람의 화면이 갈리고 ⑵ **데이터는 어차피 전 과목이 실린다.**
  //   실측(ch02): 전 과목 트리가 장마다 7.1KB — 30과목이면 25KB × 300장 ≈ 7.5MB 중복이다.
  //   화면 판단으로 좁히니 그 중복이 **따라서** 사라졌다(뷰어 분리와 같은 자리).
  //   다른 과목으로 가는 길은 위의 «← 전공 정리 홈» 하나다 — 그래서 `subjectHref`·`LOCAL_PORTS`
  //   (로컬은 과목마다 포트가 달라 런타임에 골라야 했던 배선)도 **함께 죽었다.**
  //   ★ 빌드가 이미 이 과목만 넣지만 여기서도 거른다 — 낡은 산출물이 섞여도 화면이 안 흔들린다.
  var visibleSubjects = COURSE_TREE.filter(function(s){ return s.name === CURRENT_SUBJECT; });
  document.getElementById('courseTree').innerHTML = visibleSubjects.map(function(subj){
    var isCur = true;
    var chaps = subj.chapters.map(function(ch){
      var num = String(ch.number).padStart(2, '0');
      var inner = '<span class="chapter-no">' + num + '</span>' +
        '<span class="chapter-title">' + esc(ch.title) +
        (ch.status === 'reviewing' ? '<span class="chapter-status">검수 중</span>' : '') + '</span>';
      if(!ch.built){
        return '<div class="chapter-link disabled">' + inner + '</div>';
      }
      var href = esc(ch.fname);
      var cls = 'chapter-link' + (isCur && ch.number === current ? ' current' : '') +
        (ch.status === 'reviewing' ? ' reviewing' : '');
      return '<a class="' + cls + '" href="' + href + '">' + inner + '</a>';
    }).join('');
    return '<details class="ct-subj"' + (isCur ? ' open' : '') + '>' +
      '<summary class="ct-head"><span class="ct-name">' + esc(subj.name) +
      '</span><span class="ct-chev">▸</span></summary>' +
      '<div class="ct-chaps">' + chaps + '</div></details>';
  }).join('');
}
function setCoursePane(open){

//   (2026-09-02, 사용자: *[발화 생략]*). 산출물은 전 과목이 똑같이 담긴 `site/index.html` 을 워크트리마다

//   그래서 로컬에서는 **그 한 곳**으로 보낸다 — 배포에서는 그대로 `../index.html`(상대 경로).
(function(){

// 표지의 「챕터」가 화면 밖으로 나가면 떠 있는 것을 켠다.
// ★ **IntersectionObserver 를 안 쓴다** (2026-09-09 실측). 첫 판이 그것이었고 코드는 페이지에
//   실렸는데 **콜백이 한 번도 안 왔다** — 대조군으로 콘솔에서 IO 를 새로 붙여도 400ms 안에
//   안 왔다. 미리보기 창처럼 그리기가 멈춘 문맥에서는 IO 가 잠들고, 그러면 이 장치는 조용히
//   죽는다. 스크롤 이벤트는 그 문맥에서도 온다(같은 실측에서 `scrollY` 가 따라왔다).
//   레이아웃을 매 프레임 읽지 않도록 한 틱에 한 번만 잰다.
(function(){
  var anchor = document.querySelector('.cover-actions');
  if (!anchor) return;
  var queued = false;
  function sync(){
    queued = false;
    var r = anchor.getBoundingClientRect();
    document.documentElement.classList.toggle('cover-out', r.bottom <= 0 || r.height === 0);
  }
  function schedule(){
    if (queued) return;
    queued = true;
    setTimeout(sync, 0);
  }
  // ★ 신호를 셋으로 건다 — **하나만 살아도 동작해야 한다.** 같은 날 실측에서 미리보기 창은
  //   IO 콜백을 아예 안 줬고, `window` 의 scroll 도 프로그램 스크롤에서는 안 왔다(초기 `sync`
  //   한 번만 돌았다). 어느 것이 죽는지는 문맥마다 다르므로 값을 재는 것은 `sync` 하나로
  //   두고 **깨우는 길만** 늘린다.
  window.addEventListener('scroll', schedule, {passive: true});
  document.addEventListener('scroll', schedule, {passive: true, capture: true});
  window.addEventListener('resize', schedule, {passive: true});
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(schedule, {threshold: 0}).observe(anchor);
  }
  sync();
})();

var reviewHideDrill = viewerSettings.reviewHideDrill !== false;

// ★ 셋째 등급 'cosmetic' 은 2026-08-13 에 없앴다 — 볼 것이 아니면 빌드가 표시를 아예 안 만든다.
function reviewLevelClass(level){

}
// ★ 배열 필드가 **원소 단위**로 표시됐으면(빌드가 넣어준 `_granular`) 부모는 칠하지 않는다.
// 사용자 지적 2026-07-29: *[발화 생략]* — 배열은 한 필드라 원소 하나만 고쳐도 필드 전체가 변경으로 잡히고,

    return;

  //   `1 / N` 은 **아직 착지하지 않은 인덱스의 초기값**이다(`reviewNavLanded`, 2026-07-30).

  //   숫자는 `1 / 1` 이라고 알려주면서 거기로 가는 길만 막혀 있는 상태였다.
  //   ★ 왜 이제야 드러났나: N ≥ 2 에서는 같은 구멍을 '첫 누름 = 착지'가 덮어 주고 있어서,
  //     **버튼을 끄는 조건만 그 규칙을 모른 채** 남아 있었다. 2026-07-30 처방이 이동 함수에는

  //     (같은 곳으로 다시 스크롤하는 것은 '확인'이라는 목적 그대로라 해로울 것이 없다).

  if(!plan.length) return;
  var best = -1;

        if(plan[m].el === reviewLandedEl){ best = m; break; }
      }
    }
  }

    for(var k = 0; k < plan.length; k++){

      var d = Math.abs(r.top - anchor);

window.addEventListener('scroll', function(){

  if(reviewSyncPending) return;
  reviewSyncPending = true;
  requestAnimationFrame(function(){ reviewSyncPending = false; syncReviewIndexToViewport(); });
}, {passive:true});

function reviewBarOffset(){

}
function scrollElementBelowBar(el, behavior){

  window.scrollTo({top: Math.max(0, y), behavior: behavior || 'auto'});
}

function reviewLandingAnchor(el){

  if(!card || card === el) return el;

    var body = line.slice('var CH = '.length).replace(/;\s*$/, '');
    var data;
    try{ data = JSON.parse(body); } catch(e){ return false; }
    return chapterDataHasChange(data);
  }).catch(function(){ return false; });        // 못 읽었으면 «없다» 쪽으로 — 조용히 넘어간다

function subjectNavIndexByHref(href){

      if(has) return href;

      var nb = i < 0 ? null : SUBJECT_NAV[i + (step > 0 ? 1 : -1)];

  //   → 동기화를 **이벤트가 아니라 사용 시점**에 건다. 이벤트는 놓칠 수 있어도
  //     버튼을 누르는 순간은 놓칠 수 없다(같은 부류의 처방을 반복하지 않으려면 이쪽이다).
  syncReviewIndexToViewport();
  if(reviewNavIndex < 0 || reviewNavIndex >= plan.length) reviewNavIndex = 0;
  var n = plan.length;
  var first = !reviewNavLanded;
  reviewNavLanded = true;
  // ★★ 마지막에서 한 번 더 누르면 **다음 장의 첫 변경점**으로 간다 (신설 2026-08-06).
  //
  //   사용자: *[발화 생략]*
  //
  //   ★ 왜 옳은가: 순환(`% n`)은 *한 장 안을 훑는* 장치다. **다 본 뒤에** 같은 장의 1번으로
  //     되돌아가는 것은 검수자에게 '이미 본 것'이고, 정작 하려던 일(다음 장 검수)은
  //     좌측 목차로 나가서 다시 켜야 한다. 검수는 장이 아니라 **과목 단위로 이어지는 일**이다.
  //   ★ 순환을 없애지는 않는다 — `SUBJECT_NAV` 에 다음 장이 없는 마지막 장에서는 그대로 돈다.
  //     ◀ 도 같은 규칙으로 **이전 장의 마지막 변경점**으로 넘어간다(대칭이 아니면 되돌아올 길이 없다).
  //   ★ 넘어간 장에서 어디에 서는지는 쿼리가 정한다(`?review=first|last`) — 아래 진입 분기가
  //     검수 모드를 켜고 그 자리에 착지시킨다. 저장된 읽기 위치는 무시한다(`start=lo` 와 같은 이유).
  if(!first && ((step > 0 && reviewNavIndex === n - 1) || (step < 0 && reviewNavIndex === 0))){
    // ★ 옮기기 전에 fetch 로 미리 살핀다 — 위 `findReviewableChapter` 주석이 정본이다.
    findReviewableChapter(step).then(function(hop){
      if(hop){ window.location.href = hop + '?review=' + (step > 0 ? 'first' : 'last'); return; }
      reviewAnnounce(step > 0 ? '더 볼 변경점이 없습니다 — 마지막 장입니다.'
                              : '앞쪽에 더 볼 변경점이 없습니다 — 첫 장입니다.');
    });
    return;
  }
  var chosen = first ? reviewNavIndex                    // 첫 누름 = 지금 번호에 착지
                     : ((reviewNavIndex + step) % n + n) % n;   // 그 뒤부터 순환
  reviewNavIndex = chosen;
  // ★★ 표시 갱신은 **여기 한 곳에서, 스크롤보다 먼저** 한다 (열린 날 2026-08-01).
  //   예전에는 requestAnimationFrame 안에서 `scrollReviewTargetIntoView` **뒤에** 불렀다.
  //   그러면 ⑴ 프레임이 오지 않는 상태(백그라운드 탭 — 실측 `document.hidden === true` 면
  //   rAF 는 한 번도 안 돈다)나 ⑵ 앞줄이 던지는 경우에 **위치는 움직였는데 숫자만 옛것**이 된다.
  //   경로가 갈릴 수 없게 이동 함수 자신이 즉시 갱신한다(인박스 R-7 제안 ⑵).
  syncReviewNavigation();
  // 소유 페이지를 열고, 스테퍼 항목이면 그 카드까지 펼친 뒤 스크롤한다.
  var target = reviewShowPlanEntry(plan[chosen]);
  if(target) scrollReviewTargetIntoView(target);
}
// ★ 「처음으로」 — 변경점 이동을 **첫 변경점으로 되돌린다** (열린 날 2026-08-13, 사용자:
//   *[발화 생략]*)
//
//   ★★ **판정이 한 번 뒤집혔다 — 되돌리려는 사람은 이걸 먼저 읽을 것.**
//     처음 구현은 *커서만 되돌리고 화면은 안 움직인다*(카운터 `0 / N`)였다. 근거는
//     *[발화 생략]* 였는데 **사용자 판정이 그 반대였다:**
//     *[발화 생략]* → 이 버튼은 음악 재생기의 ⏮ 자리다. ▶ 는 *다음*으로, 이건 *맨 처음*으로 간다 —
//     가는 곳이 다르므로 겹치지 않는다. 그래서 카운터도 `1 / N` 이다.
//   ★ **이동 경로를 새로 짜지 않는다.** ▶ 가 쓰는 `reviewShowPlanEntry` + `scrollReviewTargetIntoView`
//     를 그대로 탄다 — 착지 보정(sticky 탭바 높이·카드 머리 기준·문서 끝 잘림 기억)이 거기 다
//     들어 있어서, 여기서 window.scrollTo 를 직접 부르면 그 보정이 **두 벌로 갈라진다.**
function resetReviewNav(){
  var plan = reviewPlan();
  if(!plan.length) return;                    // 변경점 0건이면 묶음이 통째로 숨어 눌릴 일이 없다
  if(reviewNavLanded && reviewNavIndex === 0) return;   // 이미 첫 변경점에 서 있다(흐리게 보인다)
  reviewNavIndex = 0;
  reviewNavLanded = true;                     // 이 버튼을 누른 것 자체가 착지다
  syncReviewNavigation();                     // 숫자를 스크롤보다 **먼저** 갱신한다(2026-08-01 규칙)
  var target = reviewShowPlanEntry(plan[0]);  // 소유 페이지를 열고 스테퍼 카드까지 펼친 뒤
  if(target) scrollReviewTargetIntoView(target);
}

document.getElementById('reviewNext').addEventListener('click', function(){ moveReviewTarget(1); });

document.getElementById('reviewDrill').addEventListener('click', function(){

  reviewNavLanded = false;
  syncReviewTools();
});

// ★★ **첨자 뒤에 밑글자가 바로 이어질 때만 얇은 여백을 넣는다** (신설 2026-08-13).
//   사용자(ch01 유도 7 `P_{gas}A - P_{atm}A - mg = 0`): *[발화 생략]* 근거·실측은 `.subgap` CSS 주석이 정본.
//
//   ★ **판정을 CSS 가 아니라 여기서 하는 이유:** 다음 밑글자는 **텍스트 노드**라 CSS 인접
//     선택자가 못 본다. 첨자 뒤가 공백·문장부호·줄 끝이면 여백이 없어야 하므로(넣으면 오히려
//     벌어져 보인다) *[발화 생략]* 를 문자열 단계에서 가른다.
//   ★ **닫는 꼴을 두 가지로 나눠 받는다 — `.intop` 을 건드리지 않기 위해서다.**
//     renderMath 는 `</sub>`·`</sup>` 바로 뒤만 본다. 적분 구간은
//     `<span class="intop">∫<sub>…</sub><sup>…</sup></span>` 이라 닫는 태그 뒤가 항상 `<` 이고,
//     그래서 이 규칙에 걸리지 않는다(그 자리의 간격은 잉크 실측으로 잠근 `padding-right` 의
//     몫이다 — `test_integral_limits_clear_the_glyph`). fmtOne 의 산문 첨자는
//     `<span class="sym">P<sub>gas</sub></span>` 라 닫는 꼴이 `</sub></span>` 이므로 그쪽에서만
//     SYM 판을 쓴다. **fmtOne 은 인라인 수식을 되돌리기 전에** 부르므로 `.intop` 이 섞이지 않는다.
//   ★ **밑글자로 치는 것:** 라틴·숫자·그리스와 이 렌더러가 만드는 수학 글리프(ℓ·∂·∞·수학
//     알파벳의 대리쌍 앞머리 `\uD835`). **한글은 넣지 않는다** — `E_{in}이` 처럼 붙는 조사는
//     기호끼리 부딪히는 자리가 아니고, 넣으면 아무도 요청하지 않은 산문까지 흔든다.
var SCRIPT_TAIL_BASE = '[A-Za-z0-9\\u0370-\\u03FF\\u2113\\u2202\\u221E\\uD835]';
var SCRIPT_TAIL_MATH = new RegExp('(<\\/su[bp]>)(?=' + SCRIPT_TAIL_BASE + ')', 'g');
var SCRIPT_TAIL_SYM  = new RegExp('(<\\/su[bp]><\\/span>)(?=' + SCRIPT_TAIL_BASE + ')', 'g');
function scriptTailGap(t, re){
  return t.replace(re, '$1<span class="subgap"></span>');
}

function renderMath(raw){
  if(raw === null || raw === undefined) return '';
  var t = String(raw);
  // ★ 열린 날 2026-07-26 — 여기서 HTML 특수문자를 한 번도 이스케이프하지 않았다.
  // 그래서 부등호를 쓴 수식이 **브라우저에서 글자를 먹었다**: `\(0<y<2\)에서 \(f>0\)이라 위로`가
  // `<y<2에서 f>`를 태그로 파싱당해 화면에 `00이라 위로`로 나왔다(사용자 지적).
  // 데이터는 멀쩡했고 빌드도 통과했다 — 렌더 단계에서만 사라져 소스만 보면 절대 안 보인다.
  // fmtOne이 인라인 수식을 esc() **전에** 뽑아 넘기고, 나머지 호출부도 전부 원본 필드라
  // 이중 이스케이프는 나지 않는다. 아래 마크업 생성(<i>·<sub>…)보다 반드시 먼저 와야 한다.
  t = t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  var blankIds = [];

  t = t.replace(/___([A-Z0-9_]+)___/g, function(m, id){
    blankIds.push(id);
    return 'XBLANKMARKERX' + (blankIds.length - 1) + 'XENDMARKERX';
  });

  // ★★ 행렬식 `\begin{vmatrix} … \end{vmatrix}` — 신설 2026-09-10 (CSS 쪽 `.mat` 주석이 정본).
  //   **셀 안을 재귀로 렌더하지 않는다.** 여기서 만드는 것은 표 껍데기뿐이고, 셀에 남은
  //   LaTeX 는 아래 치환들이 문자열 전체를 훑으면서 그대로 처리한다 — 재귀로 부르면
  //   바깥에서 뽑아 둔 빈칸 자리표(`blankIds`)를 안쪽 호출이 모르므로 빈칸이 죽는다.
  //   ★ 자리가 여기인 이유: `&` 이스케이프(위)와 중괄호 제거(아래) **사이**여야 한다.
  //     앞이면 셀 구분자 `&` 를 아직 못 만나고, 뒤면 `\begin{…}` 의 중괄호가 이미 지워진다.
  //   ★ 행 구분은 `\\`, 셀 구분은 `&`(이 시점엔 `&amp;`). 빈 행은 버린다.
  t = t.replace(/\\begin\{vmatrix\}([\s\S]*?)\\end\{vmatrix\}/g, function(m, body){
    var rows = body.split(/\\\\/).map(function(r){ return r.trim(); })
                   .filter(function(r){ return r.length; });
    return '<span class="mat mat-v">' + rows.map(function(r){
      return '<span class="mat-row">' + r.split(/&amp;/).map(function(c){
        return '<span class="mat-cell">' + c.trim() + '</span>';
      }).join('') + '</span>';
    }).join('') + '</span>';
  });

  // 화면에 보여야 하는 중괄호는 \{ \} 로 쓴다. 아래에서 그룹핑용 중괄호를 전부 지우므로
  // (t.replace(/[{}]/g,'')) 표시용은 먼저 자리표로 빼 두었다가 그 뒤에 되돌린다.
  // 열린 날 2026-07-26 — ch02의 기저 표기 \{y₁, y₂\}가 화면에 '\x, xe…'로 나왔다.
  // \left\{ 도 같은 이유로 지워지고 있었다(심볼 표에 있었는데도 결과가 사라졌다).
  t = t.replace(/\\left\\\{/g, 'XLBRACEX').replace(/\\right\\\}/g, 'XRBRACEX');
  t = t.replace(/\\\{/g, 'XLBRACEX').replace(/\\\}/g, 'XRBRACEX');

  t = t.replace(/\{,\}/g, ',');
  t = t.replace(/\\mathrm\{([^{}]*)\}/g, '$1');
  // ★ `\text{}` 는 LaTeX 에서 **곧게 세우는** 명령이다 — 기울이면 뜻이 뒤집힌다(2026-08-12 지적:
  //   *[발화 생략]*). 실측 18곳이 전부 한국어 라벨이라
  //   수식 안에서 기울어 보이는 것이 전부 이 한 줄 때문이었다. `\mathrm{}` 과 같은 처리로 맞춘다.
  t = t.replace(/\\text\{([^{}]*)\}/g, '$1');
  t = t.replace(/\\vec\{([^{}]*)\}/g, '<span class="vec">$1</span>');
  // ★ 벡터는 **굵게** — 교재가 벡터/스칼라를 굵기로 가른다 (신설 2026-08-06).
  //   사용자 질문(동역학 ch12): *[발화 생략]*
  //   → **교재가 햇을 안 쓴다.** Hibbeler 15판 p.74 를 렌더해 실측: 단위벡터도 `u` + 아래첨자이고,
  //   벡터는 **굵게** · 스칼라는 이탤릭이다(식 12-18 `a = a_t u_t + a_n u_n` 에서 같은 글자 a 가
  //   굵기로만 갈린다).
  //   ★ **문제는 그 다음이었다** — 우리 데이터에는 `\mathbf`·`\vec`·`\hat` 이 **0건**이라
  //   구분 장치가 통째로 없었다. 9절 본문 `r = r u_r` 은 같은 글자가 위치벡터와 거리로 쓰인다.
  //   ★ 화살표(`\vec`)가 아니라 굵기를 고른 이유: 이 리포는 `\dot`·`\ddot` 을 많이 쓰는데
  //   (동역학 ch12 27곳) 글자 **위쪽**을 화살표와 점이 함께 쓰면 겹친다 — `.vec` 주석이 그 위험을
  //   미리 적어 둔 자리다. 굵기는 위쪽을 쓰지 않아 `\dot{r}` 과 겹치지 않는다.
  //   ★ 첨자는 중괄호 **밖**에 둔다(`\mathbf{u}_t`). 이 치환이 첨자 변환보다 앞서므로
  //   남은 `_t` 를 아래 supsub 루프가 이어서 처리한다.
  t = t.replace(/\\mathbf\{([^{}]*)\}/g, '<span class="vecb">$1</span>');
  // ★★ 같은 글자가 두 물리량을 뜻할 때 한쪽을 **필기체**로 갈라 읽게 한다.
  //   어느 쪽을 필기체로 둘지는 **과목이 정한다** — `data/<과목>/terms.json` 의 `symbols` 가
  //   정본이고 여기(공통)는 이름 → 글리프 치환만 안다. 데이터에는 비-BMP 글리프를 안 넣는다.
  //   ★★ **자리가 여기인 이유 — 분수보다 먼저여야 한다** (옮긴 날 2026-08-12).
  //     전에는 아래 심볼 표(`\ell`·`\theta` 옆)에 있었고 그건 `\frac` **뒤**다. 그래서
  //     속도를 필기체로 옮기자마자 `\frac{\mathcal{V}^{2}}{2}` 가 **분수 인자 안 중괄호**로
  //     걸렸다 — 이 과목에서 가장 흔한 형태(운동에너지)가 통째로 막히는 것이다.
  //     `\vec`·`\mathbf` 이 이미 여기 있는 이유와 같다: **글자꼴 매크로는 분수보다 앞선다.**
  //   ★ 실측(2026-08-12, 본문 Pretendard·등폭 두 스택): 𝒱 는 **두 스택 다 폭 68.07** 로 같아
  //     폴백 글리프다(등폭의 고정폭 58.59 와 다르다). 그래도 채택한 근거는 **조판이 안
  //     흔들린다**는 것이다 — cap-height 가 V 70 : 𝒱 68 로 거의 같고 디센더가 없다(100px 기준).
  //     비교: 스크립트 소문자 𝓋 는 폭 74.02 에 디센더가 있어 2026-08-04 에 탈락했다.
  t = t.replace(/\\mathcal\{V\}/g, '𝒱');
  // ★ 엑서지 E vs 에너지 E — Moran 교재 표기(신설 2026-09-03, 응용열역학 사용자 지시).
  //   *[발화 생략]* — 두 물리량이
  //   같은 로마자 대문자를 써서 문맥 없이는 못 가르던 자리다. 위 `\mathcal{V}` 와 자리가
  //   같은 이유도 같다 — **글자꼴 매크로는 분수보다 앞서야 한다**(`\dot{\mathfrak{E}}_{q}`
  //   같은 형태가 분수 인자 중괄호로 걸리는 것을 막는다).
  //   ★ 어느 과목이 이 표기를 쓰는지는 `data/<과목>/terms.json` 의 `symbols`(「엑서지」)가
  //   정한다 — 여기(공통)는 이름 → 글리프 치환만 안다(위 `\mathcal{V}` 주석과 같은 분업).
  //   ★★ **2026-09-08 — 「고딕」을 프락투어로 잘못 읽었다.** 위 지시의 「고딕」은 한국어

  //     `\(…\)` 만 뽑아 넘기므로 이 함수에 **도달하지 않는다.** 실측(열역학 ch00~ch06 렌더 DOM):
  //     수식 자리(`.imath`·`.soltpl`·`.steq`·`.fmath-line`)의 `)'`·`]'`·`}'`·`|'` **0건**,
  //     같은 서명이 산문에 **29건** — 전부 renderMath 밖이다. `[[chNN:sec-x|'…]]` 의 `|'` 도
  //     fmtOne 이 xlink 를 먼저 먹으므로 같다.
  //   ★ **두 규칙의 머리 집합은 글자 그대로 같아야 한다** — 한쪽만 넓히면 같은 표기가 붙는
  //     자리에서는 살고 띄우는 자리에서는 죽는다(회귀가 그 동일성을 본다).
  t = t.replace(/[{}]/g, '');
  t = t.replace(/XLBRACEX/g, '{').replace(/XRBRACEX/g, '}');
  t = t.replace(/([A-Za-z0-9)\]}|]|<\/[a-z]+>)('+)(?=[(),_<|}])/g,
                function(m, head, marks){ return head + marks.replace(/'/g, '′'); });
  // ★ 위 규칙은 **인자 괄호·쉼표 앞**의 자리다 — 여기엔 여백을 넣지 않는다 (2026-08-08, R-52).
  // 사용자: *[발화 생략]* — `k′` 와 `(y)` 는 한 덩어리로 읽혀야 한다.
  // 옛 규칙은 `(`·`)`·`,`·`_` 까지 한 묶음이라 `x′ ,` 처럼 **문장부호 앞 공백**도 만들었다
  // (표기 규약 「문장부호 뒤 공백」의 뒷면이다). 얇은 공백이 필요한 자리는 연산자·공백·끝뿐이다.
  // 순서가 중요하다 — 붙이는 쪽이 먼저 와야 아래 규칙이 공백을 먼저 넣지 않는다.
  t = t.replace(/([A-Za-z0-9)\]}|]|<\/[a-z]+>)('+)(?=\s|$|[=+\-*/^])/g,
                function(m, head, marks){ return head + marks.replace(/'/g, '′') + ' '; });
  t = t.replace(/\n/g, '<br>');
  // ★ `.soltpl-gap` CSS 주석이 정본 — 「조건:」·「➜」 줄 앞에만 작은 여백 블록을 끼운다.
  t = t.replace(/<br>(?=조건:|➜)/g, '<br><span class="soltpl-gap"></span>');

  t = t.replace(/XBLANKMARKERX(\d+)XENDMARKERX/g, function(m, idx){
    var id = blankIds[Number(idx)];
    return '<button class="blankbtn" data-blank-id="' + id + '" onclick="openBlank(this,\'' + id + '\')" title="정답 보기">___</button>';
  });

  // 첨자 뒤 얇은 여백 — 심볼·프라임 치환이 **끝난 뒤**에 본다. 그래야 뒤따르는 것이
  // `\rho` 같은 매크로가 아니라 실제 글리프(ρ)라 「밑글자인가」를 글자로 판정할 수 있다.
  t = scriptTailGap(t, SCRIPT_TAIL_MATH);
  // ★ `ℓ` 을 조금 내린다 (2026-09-09, 사용자: *[발화 생략]* ·
  //   *[발화 생략]*).
  //   폰트 폴백이 아니다 — canvas 잉크 실측(19px 등폭)에서 폭이 `ρ`·`A`·`R` 과 같은 11.13
  //   이었다. 갈리는 것은 글리프의 성질이다: `ℓ` 은 어센더 글자(위 13 · 아래 0)이고 `ρ` 는
  //   x-height + 디센더(위 10 · 아래 4)라, 분자에 나란히 놓으면 `ℓ` 만 솟아 보인다.
  //   **잉크 중심 차 3.5px / 19px = 0.184em** 만큼 내리면 두 글자의 중심이 겹친다.
  //   `position:relative` 라 줄 상자를 안 건드린다(옆 글자·행 높이가 그대로다).
  //   ★ **맨 마지막에 감싼다** — 치환 자리(`\ell` → `ℓ`)에서 감싸면 뒤따르는 아래첨자·
  //   여백 규칙이 태그의 `>` 를 밑글자로 읽는다.
  t = t.replace(/ℓ/g, '<span class="ell">ℓ</span>');
  // HTML 속성을 보존한다. 첨자/분수 인자는 새 식이라 첫 +/-는 단항 부호다.
  var operandBefore = false;
  return t.split(/(<[^>]*>)/g).map(function(part){
    if(part.charAt(0) === '<'){
      if(/^<(?:sub|sup)>/.test(part) || /class="frac-(?:num|den)"/.test(part)) operandBefore = false;
      if(/^<\/(?:sub|sup)>/.test(part)) operandBefore = true;
      return part;
    }
    var end = 0;
    function endsOperand(text){ return /[A-Za-z0-9\u0370-\u03ff)\]}]$/.test(text.trim()); }
    var result = part.replace(/[ \t\u00a0]*(&lt;=|&gt;=|&lt;|&gt;|[=≈≠≤≥+−±-])[ \t\u00a0]*/g,
      function(match, op, at){
        var before = part.slice(end, at);
        if(before.trim()) operandBefore = endsOperand(before);
        var binary = /^[+−±-]$/.test(op), spaced = !binary || operandBefore;
        operandBefore = false; end = at + match.length;
        return spaced ? '<span class="math-' + (binary ? 'binary' : 'relation') + '">' + op + '</span>' : op;
      });
    if(part.slice(end).trim()) operandBefore = endsOperand(part.slice(end));
    return result;
  }).join('');
}

// 이론·유도 본문(plain text) 전용 제한 서식기 — 아래첨자(γ_s, P_abs), **용어 볼드**,
// 빈 줄(\n\n) 단락과 \( ... \) 인라인 수식을 다룬다.
function fmtOne(raw){
  var mathSpans = [];
  var source = raw === null || raw === undefined ? '' : String(raw);
  source = source.replace(/\\\((.+?)\\\)/g, function(_, math){
    mathSpans.push(math);
    // 글자 토큰은 아래첨자 등 중간 정규식에 먹힌다. PUA 경계는 사용자 글자와 겹치지 않는다.
    return '\uE000' + (mathSpans.length - 1) + '\uE001';
  });
  var t = esc(source);
  t = t.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  // 이전 장 딥링크: [[ch01:sec-process-cycle|과정과 사이클]] → 해당 절로 이동
  // (본문 안에서 곧바로 복습하러 갈 수 있게. 대상 존재 여부는 빌드가 검사한다.)
  // 과목 간 딥링크: [[고체역학@ch09:sec-bending|9장 굽힘응력]] → 다른 과목의 그 장으로 이동
  // (2026-08-29 — 1학기 개념을 되짚는 자리에서 쓴다. `@` 앞이 과목 폴더 이름이다. 대상 존재
  // 여부는 이 빌드가 검사하지 못한다 — 다른 git 브랜치에 있어서다. 저자가 git show 로 확인한다.)
  t = t.replace(/\[\[(?:([^@\[\]]+)@)?(ch\d{2}):([A-Za-z0-9_-]+)(?:\/([A-Za-z0-9_-]+))?\|([^\]]+)\]\]/g,
    function(_, subjectFolder, chapter, target, child, label){
      var fragment = target.indexOf('fig-') === 0 ? target :
        (target.indexOf('f-') === 0 && !child ? 'formula-' + target :
          (child ? target + '-' + child : 'theory-' + target));
      if(!subjectFolder){
        return '<a class="xlink" href="' + chapter + '.html#' + fragment + '">' + label + '</a>';
      }
      var host = location.hostname;
      var isLocal = host === 'localhost' || host === '127.0.0.1';
      var port = isLocal ? LOCAL_PORTS[subjectFolder] : null;
      var href = port
        ? location.protocol + '//' + host + ':' + port + '/'
          + encodeURIComponent(subjectFolder) + '/' + chapter + '.html#' + fragment
        : '../' + encodeURIComponent(subjectFolder) + '/' + chapter + '.html#' + fragment;
      return '<a class="xlink xlink-cross" href="' + href + '">' + label + '</a>';
    });
  // 아래첨자: 콤마·점이 들어간 복합 첨자(W_{net,out}, E_mass,in)까지 받는다.
  // 기호와 첨자는 .sym(nowrap)으로 묶어 overflow-wrap:anywhere 아래에서도 줄이 갈리지 않게 한다.
  // ★ 첨자에 **그리스 문자**를 받는다 (2026-08-02). 평문 필드의 `v_θ`(실측 `expectedOutput`)가
  //    `[A-Za-z0-9]` 에 안 걸려 화면에 밑줄째 나왔다 — 기호 쪽 클래스도 함께 넓힌다.
  t = t.replace(/([Δ∆]?[A-Za-zα-ωΑ-Ω])_\{([A-Za-z0-9α-ωΑ-Ω]+(?:[,.][A-Za-z0-9α-ωΑ-Ω]+)*)\}/g, '<span class="sym">$1<sub>$2</sub></span>');
  t = t.replace(/([Δ∆]?[A-Za-zα-ωΑ-Ω])_([A-Za-z0-9α-ωΑ-Ω]+(?:,[a-z]+)*)/g, '<span class="sym">$1<sub>$2</sub></span>');
  // 첨자 뒤 얇은 여백 — renderMath 와 **같은 자**를 쓴다(그 함수 위 주석이 정본).
  // 반드시 인라인 수식을 되돌리기 **전**이어야 한다: 되돌린 뒤면 `.intop` 의 `</sup></span>` 가
  // 섞여 들어와 적분 구간 뒤에도 여백이 붙는다.
  t = scriptTailGap(t, SCRIPT_TAIL_SYM);
  t = t.replace(/\uE000(\d+)\uE001/g, function(_, idx){
    // 감싸는 자리가 여기 하나뿐이라야 한다 — 인라인 수식을 뽑아 되돌리는 지점이 여기이므로
    // 이 한 줄이 본문 전체(이론·이해도·문항·학습목표·키워드)를 한꺼번에 덮는다.
    return '<span class="imath">' + renderMath(mathSpans[Number(idx)]) + '</span>';
  });
  return t;
}
// 한 단락 블록 → <p> 또는 불릿 목록.
// 블록의 모든 줄이 "- "로 시작하면 목록으로 렌더한다(항목: 설명 형태를 스캔하기 쉽게).
// 기존 본문에는 그런 블록이 없으므로 렌더 결과가 바뀌지 않는다.
// 파이프 표: | 머리 | 머리 |  /  |---|---|  /  | 값 | 값 |
// 본문에 표 문법을 써 놓고 렌더를 안 하면 화면에 파이프가 그대로 나온다(2026-07-22 지적).
function fmtTable(lines, cls){
  var cells = function(l){
    return l.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(function(c){ return c.trim(); });
  };
  var head = cells(lines[0]);
  var body = lines.slice(2).map(cells);
  return '<table class="tbl' + (cls || '') + '"><thead><tr>' +
    head.map(function(c){ return '<th>' + fmtOne(c) + '</th>'; }).join('') +
    '</tr></thead><tbody>' +
    body.map(function(r){
      return '<tr>' + r.map(function(c){ return '<td>' + fmtOne(c) + '</td>'; }).join('') + '</tr>';
    }).join('') + '</tbody></table>';
}
// `cls` 는 **단락 단위 변경 표시**용이다(빌드의 `_changedParas`). 안 주면 종전과 완전히 같다.
function fmtBlock(raw, cls){
  var lines = String(raw).split('\n').filter(function(l){ return l.trim() !== ''; });
  var isTable = lines.length > 2 &&
    lines.every(function(l){ return /^\s*\|.*\|\s*$/.test(l); }) &&
    /^\s*\|[\s:|-]+\|\s*$/.test(lines[1]);
  if(isTable) return fmtTable(lines, cls);
  var isList = lines.length > 1 && lines.every(function(l){ return /^\s*-\s+/.test(l); });
  if(isList) return '<ul class="tlist' + (cls || '') + '">' + lines.map(function(l){
    return '<li>' + fmtOne(l.replace(/^\s*-\s+/, '')) + '</li>';
  }).join('') + '</ul>';
  // 번호 목록 (신설 2026-08-06) — 순서가 뜻을 갖는 절차. 불릿으로 쓰면 순서가 선언되지
  // 않아 본문에 '압축액 → 포화액 → …' 같은 줄을 따로 붙여야 했다(ch03 §2 실측).
  var isOList = lines.length > 1 && lines.every(function(l){ return /^\s*\d+\.\s+/.test(l); });
  if(isOList) return '<ol class="tlist' + (cls || '') + '">' + lines.map(function(l){
    return '<li>' + fmtOne(l.replace(/^\s*\d+\.\s+/, '')) + '</li>';
  }).join('') + '</ol>';
  // 본문 안의 디스플레이 수식 (신설 2026-08-06) — 줄 전체가 인라인 수식뿐인 블록.
  // 그동안 본문에는 식을 띄워 놓을 수단이 아예 없어서(단일 \n 은 <p> 안에서 접힌다)
  // AGENTS 표기 규약의 '수식 계산 예시 → 줄바꿈 정렬된 단계' 를 지킬 방법이 없었다.
  // 조판은 유도 카드와 같은 `.fmath` 를 쓴다 — 같은 식이 자리마다 달라 보이면 안 된다.
  var isMath = lines.length > 0 && lines.every(function(l){ return /^\s*\\\(.*\\\)\s*$/.test(l); });
  if(isMath) return '<div class="fmath mono' + (cls || '') + '">' + lines.map(function(l){
    return '<div class="fmath-line">' + renderMath(l.trim().replace(/^\\\(/, '').replace(/\\\)$/, '')) + '</div>';
  }).join('') + '</div>';
  return '<p' + (cls ? ' class="' + String(cls).replace(/^\s+/, '') + '"' : '') + '>' + fmtOne(raw) + '</p>';
}
function fmtText(raw){
  // 널 가드 — 없으면 String(undefined) 가 화면에 그대로 'undefined' 로 찍힌다.
  // 열린 날 2026-08-06: 동역학 유도 카드 제목이 그렇게 나갔다(데이터가 name 대신 title).
  // renderMath 는 같은 자리에 이 가드가 있었는데 여기만 없어 한 파일 안에서 갈려 있었다.
  // ★ 이건 두 번째 방어선일 뿐이다 — 필드 누락 자체는 빌드 C38(derivation_shape_issues)이 막는다.
  //   가드만 두면 빈 화면이 조용해질 뿐이라 둘을 함께 둔다.
  if(raw === null || raw === undefined) return '';
  var parts = String(raw).split(/\n{2,}/);
  if(parts.length === 1 && !/^\s*-\s+/.test(parts[0])) return fmtOne(parts[0]);
  // ★ map 에 fmtBlock 을 **바로 넘기지 않는다** — map 은 두 번째 인자로 인덱스를 주므로
  //   `cls` 자리에 숫자가 들어간다(단락 표시를 붙이면서 생긴 함정. 회귀가 이 형태를 막는다).
  return parts.map(function(p){ return fmtBlock(p); }).join('');
}

function openBlank(btn, id){
  // ★ 예제(#exampleCard, id="ex-ans-<id>")와 연습(#pracCard, id="ans-<id>")은 같은
  //   blankIds 를 쓸 수 있어(같은 문항이 basic 이면 두 탭에 다 뜬다), 전역 getElementById
  //   로 찾으면 항상 먼저 나오는 쪽(연습)이 걸려 예제 빈칸이 연습 답을 연다(2026-09-13 실사고).
  //   그래서 클릭된 버튼이 속한 카드 컨테이너 안에서만 찾는다.
  var scope = btn.closest('#pracCard, #exampleCard') || document;
  var el = scope.querySelector('[id="ans-' + id + '"], [id="ex-ans-' + id + '"]');
  if(!el) return;
  el.open = !el.open;
  // 스크롤 이동 없음: 정답은 빈칸 자리에 인라인으로 채워지므로 화면을 옮길 이유가 없다.
  // (아래 '빈칸N' 항목을 직접 여는 경로와 동작을 일치시킨다)
}

// ★★ `illustrative` 에는 딱지를 **붙이지 않는다** (2026-08-02, 사용자 지적으로 개편).
//
//   실측: 전 챕터 삽화 136개 중 **117개(86%)가 `illustrative`** 다. 그래서 `핵심을 그림으로`
//   가 거의 모든 삽화 위에 똑같이 붙었고, ch03 이론 탭 **한 화면에만 9번** 나왔다.
//   **86% 가 같은 말이면 그건 분류가 아니라 잡음이다** — 정보가 없는 글자가 자리를 먹고
//   (예전엔 주황 굵은 글씨라) 정작 봐야 할 그림보다 먼저 시선을 가져갔다.
//
//   반대로 나머지 3종(19건, 14%)은 **독자가 읽는 방식을 실제로 바꾼다** — '차이 비교' 는
//   좌우를 나란히 보라는 뜻이다. 그래서 통째로 없애지 않고 **기본값만 지운다.**
//   데이터의 `kind` 는 그대로 둔다(표시만 바꾼다) — 감사·검사가 그 값을 쓰고, 되돌리기도 쉽다.
var kindLabel = {
  comparative:'차이 비교',
  derivational:'식이 나오는 과정',
  sequential:'시간에 따른 변화'
};
// ★ 삽화가 문제를 대신 풀어 주는 것을 막는다 (2026-07-30, 사용자 채택).
//   *[발화 생략]* /
//   *[발화 생략]*
//   **도형은 그대로 두고 조건 텍스트만** 가렸다가 버튼 한 번에 드러낸다.
//
//   ★ 단계별 노출(B안)은 **폐기**했다. 두 안을 만들어 비교한 결과 사용자가 A안을 골랐다:
//   *[발화 생략]*
//   덧붙여 내가 B안을 **잘못 만들었다** — 사용자가 말한 단계는 *조건 → 그 조건으로 중간 계산*
//   이었는데 나는 *조건을 하나씩*으로 구현했다. 되살릴 일이 있으면 그 정의부터 다시 잡을 것.
function revealBar(d){
  if(!d.revealMode) return '';
  return '<div class="fig-reveal-bar">' +
    '<span>문제를 먼저 읽고 누르세요</span>' +
    '<button class="fig-reveal-btn" data-reveal-all="' + esc(d.id) + '">조건 수치 보기</button></div>';
}

// ★★ 삽화 사유는 **주인(절·카드)의 것을 물려받는다** (열린 날 2026-08-13, 사용자:
//   *[발화 생략]*).
//   ★ **사유는 절 단위로 한 줄만 적는다는 판정(2026-08-13) 때문에 삽화는 자기 사유를 갖지 않는
//     것이 정상이다** — 그래서 삽화 dict 의 changeNote 만 보던 옛 경로는 언제나 빈손이었다.
//     배지는 붙는데 툴팁만 안 뜨던 것이 이것이다(데이터를 채워서 닫을 수 있는 결함이 아니다).
//   ★ 이건 어제 닫은 「마크와 사유는 한 함수」(reviewClass)의 **남은 반쪽**이다 — 본문 쪽은
//     합쳤는데 삽화 쪽만 옛 경로에 남아 있었다. 같은 부류로 네 번 지적받았다.
function diagramNote(d, owner){
  return reviewNoteText(d) ? reviewNote(d) : reviewNote(owner);
}
// ★ `owner` 는 **필수 인자**다. 선택으로 두면 빠뜨린 호출부가 *그 자리만 조용히 빈손*으로 남고,
//   그게 바로 이 결함의 정체다. 호출부가 전부 주인을 넘기는지는 소스 계약으로 잠근다
//   (test_diagram_note_falls_back_to_its_owner ⑶) — 여기서는 콘솔로도 알린다.
// ★ 영문 지문 낱말 풀이 — 문항의 `glossary: [{term, ko}]` 를 지문에서 그 낱말이 **처음** 나오는 자리 뒤에
//   「term (ko)」로 붙여 보인다(2026-09-14 사용자 *[발화 생략]*). 데이터의 지문은 영문 그대로 둔다 — 지문 언어
//   검사(C15)·램프(C54)가 원문을 재기 때문이다. 낱말이 지문에 실제로 있는지는 빌드 C59 가 막는다.
function glossedPrompt(item){
  var text = String((item && item.prompt) || '');
  ((item && item.glossary) || []).forEach(function(g){
    if(!g || !g.term || !g.ko) return;
    var word = String(g.term).replace(/[.*+?^$(){}|[\]\\]/g, '\\$&');
    var re = new RegExp('(^|[^A-Za-z])(' + word + ')(?![A-Za-z])', 'i');
    text = text.replace(re, function(m, pre, hit){ return pre + hit + ' (' + g.ko + ')'; });
  });
  return text;
}
function displayMathZero(svg){
  // ★ 2026-09-18 — **아무것도 바꾸지 않는다.** 0 만 본문 글꼴로 갈아끼우던 장치를 걷어냈기
  //   때문이다(위 `.mono,.imath` 주석이 실측과 근거의 정본). 삽화도 본문과 같은 등폭으로 둔다 —
  //   화면의 두 자리에서 0 의 글꼴이 갈리면 같은 지적이 삽화 쪽에서 다시 올라온다.
  //   호출부는 그대로 두었다: 다시 글리프를 손볼 일이 생기면 이 함수 하나만 고치면 된다.
  return String(svg || '');
}
function renderDiagrams(diagrams, owner){
  if(arguments.length < 2) console.error('renderDiagrams: 주인(owner) 인자가 빠졌다 — 그 자리 삽화만 사유가 빈손이 된다');
  if(!diagrams || !diagrams.length) return '';
  return diagrams.map(function(d){
    return '<div id="' + esc(d.id) + '" class="diagram-box' + (d.verticalPadding === 'compact' ? ' diagram-compact' : '') + (d._reviewChanged ? ' review-diagram' + reviewLevelClass(d._reviewChangeLevel) : '') + '"' +
      (d.revealMode ? ' data-reveal-mode="' + esc(d.revealMode) + '"' : '') + (d._reviewChanged ? diagramNote(d, owner) : '') + '>' +
      (d._reviewChanged ? '<span class="review-badge">' + (d._reviewChangeLevel === 'minor' ? '일부 수정' : '전면 수정') + '</span>' : '') +
      // 기본값(illustrative)·미지정에는 딱지가 없다 — 위 kindLabel 주석이 정본.
      (kindLabel[d.kind] ? '<div class="diagram-kind">' + esc(kindLabel[d.kind]) + '</div>' : '') +
      displayMathZero(d.svg) +
      revealBar(d) +
      motionBar(d) +
      spotlightBar(d) +
    '</div>';
  }).join('');
}

// ★ 삽화 짚어 보기 — 한 삽화 위의 여러 대상을 **하나씩** 진하게 두고 나머지를 흐린다
//   (2026-09-14 사용자 *[발화 생략]*).
//   선언 `diagrams[].spotlight = [{focus:[그룹 id…], caption}]`.
//   ★ 기본은 슬라이드 켜짐 · 첫 장(1 / N)이다 — 유도 슬라이드와 같다(2026-09-14 사용자 *[발화 생략]*). 넘김은 1 → N 한 방향, 양 끝에서 그쪽
//     버튼이 꺼진다. 슬라이드를 끄면 전체 보기(흐림 없음 · 모든 단계 본문 · 전체 캡션)이고 넘김 버튼이 숨는다.
//   켜짐/꺼짐은 보기 설정 레지스트리(`viewerSettings.spotSlideMode`)에 둔다 — 유도 슬라이드와 같은 저장 경로.
//   SVG 안 `class='spot-overview'` 는 전체 보기에서만 보인다 — 전체 캡션이 단계 설명과 함께 뜨지 않게(지적 18).
var SPOTLIGHT_BY_FIG = {};
var SPOTLIGHT_DIM = 0.22;   // 흐린 대상의 불투명도 — 윤곽은 남고 색은 물러나는 값(렌더에서 고름)
function spotlightOn(){ return !!viewerSettings.spotSlideMode; }
function spotlightBar(d){
  var s = d && d.spotlight;
  if(!s || !s.length) return '';
  var spec = SPOTLIGHT_BY_FIG[d.id] = {steps: s, at: 0};
  // 단계가 맡은 본문(`renderTheoryBody` 가 `_spotHtml` 로 옮겨 둔다)은 삽화 바로 아래에 두고 단계와 함께 넘긴다
  var parts = d._spotHtml || [];
  var body = parts.some(Boolean) ? '<div class="spot-body">' + s.map(function(st, k){
    return parts[k] ? '<div class="spot-step" data-step="' + k + '">' + parts[k] + '</div>' : '';
  }).join('') + '</div>' : '';
  // 상자가 문서에 붙은 뒤 첫 상태(켜짐이면 1 장)를 입힌다 — SVG 그룹 흐림은 DOM 이 있어야 걸린다
  setTimeout(function(){ var box = document.getElementById(d.id); if(box) applySpotlight(box, spec); }, 0);
  return body + '<div class="spot-bar" data-spot="' + esc(d.id) + '">' +
    '<button type="button" class="tool-toggle spot-toggle" data-setting-keys="spotSlideMode">슬라이드: 켜짐</button>' +
    '<span class="spot-caption"></span>' +
    '<span class="spot-nav">' +
      '<button type="button" class="motion-play spot-btn" data-dir="-1">← 이전</button>' +
      '<button type="button" class="motion-play spot-btn" data-dir="1">다음 →</button>' +
    '</span>' +
  '</div>';
}
function applySpotlight(box, spec){
  var ids = [];
  spec.steps.forEach(function(st){ (st.focus || []).forEach(function(g){ if(ids.indexOf(g) === -1) ids.push(g); }); });
  var on = spotlightOn();
  var cur = on ? spec.steps[spec.at] : null;
  var toggle = box.querySelector('.spot-toggle');
  if(toggle) toggle.textContent = '슬라이드: ' + (on ? '켜짐' : '꺼짐');
  var nav = box.querySelector('.spot-nav');
  if(nav) nav.hidden = !on;
  ids.forEach(function(gid){
    var el = box.querySelector('svg [id="' + String(gid).replace(/"/g, '\\"') + '"]');
    if(!el){ console.warn('[짚어 보기] 삽화에서 그룹을 못 찾았다 — ' + gid); return; }
    el.style.opacity = (!cur || (cur.focus || []).indexOf(gid) !== -1) ? '' : String(SPOTLIGHT_DIM);
  });
  box.querySelectorAll('svg .spot-overview').forEach(function(el){ el.style.display = cur ? 'none' : ''; });
  // 전체 보기에서는 모든 단계의 본문을, 단계에서는 그 단계 것만 — 유도 슬라이드의 켜짐/꺼짐과 같다
  box.querySelectorAll('.spot-step').forEach(function(el){
    el.hidden = !!cur && Number(el.getAttribute('data-step')) !== spec.at;
  });
  var cap = box.querySelector('.spot-caption');
  if(cap) cap.textContent = cur ? (spec.at + 1) + ' / ' + spec.steps.length + ' · ' + (cur.caption || '')
                                : '전체 보기';
  box.querySelectorAll('.spot-btn').forEach(function(b){
    b.disabled = Number(b.getAttribute('data-dir')) < 0 ? spec.at <= 0 : spec.at >= spec.steps.length - 1;
  });
}
document.addEventListener('click', function(e){
  var t = e.target.closest && e.target.closest('.spot-btn, .spot-toggle');
  if(!t || t.disabled) return;
  var bar = t.closest('.spot-bar');
  var spec = bar && SPOTLIGHT_BY_FIG[bar.getAttribute('data-spot')];
  if(!spec) return;
  if(t.classList.contains('spot-toggle')){
    updateViewerSettings({spotSlideMode: !viewerSettings.spotSlideMode});
    // 켜짐/꺼짐은 모든 짚어 보기 삽화에 같이 걸린다 — 한 장에 여럿이면 하나만 바뀌면 설정이 둘로 갈린다
    Object.keys(SPOTLIGHT_BY_FIG).forEach(function(id){
      var box = document.getElementById(id);
      if(box) applySpotlight(box, SPOTLIGHT_BY_FIG[id]);
    });
    return;
  }
  spec.at = Math.max(0, Math.min(spec.steps.length - 1, spec.at + Number(t.getAttribute('data-dir'))));
  applySpotlight(bar.closest('.diagram-box'), spec);
});

// ★ 삽화 동작 — 선언(`diagrams[].motion`)을 **읽는 쪽**. 정본 설계는
//   `docs/2026-09-07-삽화-동작-사양.md`, 재는 쪽은 `tools/buildlib/motion.py` 다.
//
// **자동 재생하지 않는다 · 한 번 돌고 선다 · 되풀이하지 않는다** (사양의 「읽는 사람 쪽 규약」).
// 근거는 2026-08-19 판정(글로우·페이드 물림) — *읽는 중에 화면이 저절로 움직이는 것*이 그때
// 물린 그 불편이다.
//
// ★★ 사양이 적은 `@keyframes` 생성 대신 **Web Animations API** 를 쓴다. 뜻은 같다 —
//   «선언 하나에서 나온다» — 이고, 두 가지가 낫다: ⑴ 삽화마다 CSS 규칙을 공유 자산에
//   찍어 넣지 않는다(장마다 다시 실리는 것을 막으려고 뷰어를 갈라 놓은 그 이유) ⑵ `grow`
//   의 대시 길이가 `getTotalLength()` 로 **런타임 실측**이라 빌드가 길이를 미리 못 재는
//   자리가 없다. 사양 문서에 정정으로 적어 둔다.
var MOTION_FRAME_MS = 250;   // 12프레임 상한에서 3초. 한 번 보고 따라갈 수 있는 길이다.
// 삽화 id → 선언. HTML 문자열에 선언을 실어 나르면 따옴표 이스케이프가 한 겹 더 생기고,
// 그 자리는 이 뷰어가 이미 여러 번 다친 곳이다. 그릴 때 등록하고 누를 때 찾는다.
var MOTION_BY_FIG = {};

function motionBar(d){
  var m = d && d.motion;
  if(!m || !m.tracks || !m.tracks.length) return '';
  MOTION_BY_FIG[d.id] = m;
  return '<div class="motion-bar">' +
    '<span class="motion-caption">' + esc(m.caption || '') + '</span>' +
    '<button type="button" class="motion-play">동작 보기</button>' +
  '</div>';
}

function motionTrackKeyframes(track, el){
  var from = Number(track.from), to = Number(track.to);
  if(track.attr === 'opacity') return [{opacity: from}, {opacity: to}];
  if(track.attr === 'dx') return [{transform: 'translate(' + from + 'px,0)'},
                                  {transform: 'translate(' + to + 'px,0)'}];
  if(track.attr === 'dy') return [{transform: 'translate(0,' + from + 'px)'},
                                  {transform: 'translate(0,' + to + 'px)'}];
  if(track.attr === 'grow'){
    var len = el.getTotalLength ? el.getTotalLength() : 0;
    if(!len) return null;
    el.style.strokeDasharray = len;
    return [{strokeDashoffset: len * (1 - from)}, {strokeDashoffset: len * (1 - to)}];
  }
  return null;
}

function playMotion(box, motion){
  var total = (Number(motion.frames) || 2) * MOTION_FRAME_MS;
  (motion.tracks || []).forEach(function(track){
    if(!track || !track.target || !track.at) return;
    var el = box.querySelector('[id="' + track.target + '"]');
    if(!el) return;
    var a = Math.max(0, Math.min(1, Number(track.at[0])));
    var b = Math.max(a, Math.min(1, Number(track.at[1])));
    var frames = motionTrackKeyframes(track, el);
    if(!frames) return;
    var anim = el.animate(frames, {
      duration: Math.max(1, (b - a) * total),
      delay: a * total,
      // `backwards` 라서 지연 동안 시작값에 머문다. `forwards` 는 안 쓴다 —
      // 끝나면 **저자가 그린 상태(=마지막 프레임)로 돌아가는 것**이 쉬는 상태다.
      fill: 'backwards',
      easing: track.ease === 'easeInOut' ? 'ease-in-out' : 'linear'
    });
    anim.addEventListener('finish', function(){
      el.style.strokeDasharray = '';
      el.style.strokeDashoffset = '';
    });
  });
}

document.addEventListener('click', function(ev){
  var btn = ev.target.closest && ev.target.closest('.motion-play');
  if(!btn) return;
  var box = btn.closest('.diagram-box');
  if(!box || !box.id) return;
  var motion = MOTION_BY_FIG[box.id];
  if(motion) playMotion(box, motion);
});

//   잠금: test_checks.py::test_given_chip_is_independent_of_reveal_mode
function paintGivenChips(scope){
  var boxes = (scope || document).querySelectorAll('.diagram-box svg');
  Array.prototype.forEach.call(boxes, function(svg){
    Array.prototype.forEach.call(svg.querySelectorAll('text[data-reveal]'), function(t){
      var prev = t.previousElementSibling;
      if(prev && prev.classList && prev.classList.contains('given-chip')) return;  // 이미 깔림
      var b;
      try { b = t.getBBox(); } catch(e) { return; }
      if(!b || b.width < 1 || b.height < 1) return;   // 숨은 페이지는 0 — 열릴 때 다시 깐다
      var r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      r.setAttribute('class', 'given-chip');
      // 가림(`조건 수치 보기`)과 **같은 속성**을 달아 둔다 — 그래야 기존 CSS·토글이 칩까지
      // 그대로 여닫는다. 칩만 남고 글자가 사라지면 '여기 뭔가 있었다'가 새어 버린다.
      r.setAttribute('data-reveal', t.getAttribute('data-reveal') || '1');
      r.setAttribute('x', (b.x - 4).toFixed(2));
      r.setAttribute('y', (b.y - 1.5).toFixed(2));
      r.setAttribute('width', (b.width + 8).toFixed(2));
      r.setAttribute('height', (b.height + 3).toFixed(2));
      r.setAttribute('rx', '3.5');
      if(t.classList.contains('shown')) r.classList.add('shown');
      t.parentNode.insertBefore(r, t);           // 글자 **앞**에 = 뒤에 깔린다
    });
  });
}

var ccStageLabel = {recall:'떠올리기', explain:'설명하기', connect:'연결하기'};
var ccIdSeq = 0;
// owner = 이 체크를 품은 **절 또는 유도 카드**. 사유는 그 단위로 적으므로 물려받는다
// (위 reviewClassOwned 주석이 정본). 인자는 **필수**다 — 빠진 호출부가 드러나야 한다.
function renderComprehensionChecks(checks, owner){
  if(arguments.length < 2) console.error('renderComprehensionChecks: 주인(owner) 인자가 빠졌다 — 그 자리 체크만 사유가 빈손이 된다');
  if(!checks || !checks.length) return '';
  var items = checks.map(function(c){
    ccIdSeq += 1;
    var domId = 'cc-' + ccIdSeq;
    // 원소 단위 변경 표시 — 바뀐 체크에만 붙는다(GRANULAR_FIELDS).
    return '<details class="cc-item' + reviewClassOwned(c, 'item', owner) + '" id="' + domId + '">' +
      // 프롬프트는 반드시 하나의 요소로 감싼다. .cc-head가 display:flex라서 감싸지 않으면
      // 안의 <span class="sym">이 **별도 flex 아이템**이 되어 앞뒤 글자와 따로 줄바꿈된다
      // ('돌' / '면 ΔEsystem'). word-break로는 고쳐지지 않는다(2026-07-22, 4회 반복).
      '<summary class="cc-head"><span class="cc-stage ' + esc(c.stage) + '">' + esc(ccStageLabel[c.stage] || c.stage) + '</span>' +
      '<span class="cc-q">' + fmtText(c.prompt) + '</span></summary>' +
      // ★★ **카드 한 번 = 답.** 그 위에 아무것도 얹지 않는다 (되돌림 2026-08-07).
      //   사용자: *[발화 생략]*
      //   ★ 원래 요구는 **선택지 둘 중 하나**였다(*[발화 생략]*) — ⓐ 없애기 / ⓑ 키워드 먼저·답은 접기. 에이전트가 ⓑ 를 골랐는데,
      //     **그 판단이 틀렸다.** 근거로 든 것은 *[발화 생략]* 였지만
      //     실제로 쓰는 사람은 답을 보러 오는 것이고, 접힘을 하나 더 두는 값이 그보다 컸다.
      //   ★ 부류: **읽는 사람이 '쓸모없다' 고 한 것을 살리려고 그 앞에 단계를 더 놓았다.**
      //     쓸모를 늘리는 대신 **비용만** 늘렸다. 선택지를 받았을 때 '없애기' 를 고르는 것이
      //     기본값이어야 한다 — 남기는 쪽이 언제나 더 그럴듯해 보이기 때문이다.
      //   ☞ 데이터의 `gradingKeywords` 는 **지우지 않았다**(콘텐츠 삭제는 빨강). 화면에서만 뺀다 —
      //     되살릴 일이 생기면 이 한 줄을 되돌리면 된다.
      '<div class="cc-body">' +
        '<div class="cc-answer">' + fmtText(c.answer) + '</div>' +
        (c.explanation ? '<div class="cc-expl">' + fmtText(c.explanation) + '</div>' : '') +
        // ★ `followUp` 은 답과 **같이** 나온다(2026-08-14). 답을 펼친 뒤 한 번 더 눌러야 하면
        //   그 지연이 곧 이 칸이 없애려던 것이다 — 자료를 떠나 AI 에 묻게 만드는 왕복.
        (c.followUp ? '<div class="cc-followup"><span class="cc-followup-tag">한 걸음 더</span>'
           + fmtText(c.followUp) + '</div>' : '') +
      '</div>' +
    '</details>';
  }).join('');
  return '<div class="cc-wrap">' + items + '</div>';
}

// ---- (삭제됨 2026-08-01) 주제별 즉시 연결 칩 — 유도→문풀 / 문풀→연습문제 번호 링크 ----
//
// 사용자: *[발화 생략]*
//
// 설계된 순서가 **이론 → 유도 → 문풀 → 연습문제**라 이 칩들은 전부 **바로 다음 탭**을 가리켰다
// — 하단 `다음 →` 버튼과 중복이다. 내부 링크의 값은 **멀리 떨어진 것**으로 갈 때 생긴다
// (5장에서 3장 표로 되짚기). 인접 단계로 가는 링크는 잡음이고, 실측상 한 카드에 6개까지 늘어서
// (`Q1 Q3 Q7 Q8 Q12 Q14`) 어느 것도 눌리지 않았다.
//
// 반박(기록만): '주제별로 골라 푼다'는 동선은 실재한다. 다만 그것은 **연습문제 탭의 필터**가
// 할 일이지 문풀 카드가 링크로 할 일이 아니다. 필요해지면 필터로 되살린다 — 칩으로 되돌리지 말 것.
// 함께 지운 것: probsByFormula·practiceByFormula 역인덱스, gotoProblem·gotoPractice,
// `.rel-chip*` CSS, `.rel-chip` 클릭 핸들러 (모두 이 칩 전용이었다).

// ---- 점프 복귀 칩: 어디서 점프해 왔는지 기억했다가 한 번에 되돌아간다 ----
var jumpBackLabel = {recap:'자가점검', practice:'연습', example:'예제', derivation:'유도', problems:'문제', textbook:'교재 문제', summary:'요약', theory:'이론', lo:'학습목표'};
function armJumpBack(fromPage){
  var btn = document.getElementById('jumpBack');
  btn.setAttribute('data-origin', fromPage);
  var lab = jumpBackLabel[fromPage] || '';
  // 조사는 마지막 글자의 받침으로 가른다 — 받침 없음 «로»(문풀·이론·문제·유도), 있음 «으로»(자가점검·요약·학습목표).
  var last = lab.charCodeAt(lab.length - 1);
  var batchim = last >= 0xAC00 && last <= 0xD7A3 && ((last - 0xAC00) % 28) !== 0;
  btn.textContent = '← ' + lab + (batchim ? '으로 돌아가기' : '로 돌아가기');
  btn.hidden = false;
}
document.getElementById('jumpBack').addEventListener('click', function(){
  this.hidden = true;
  if(this.getAttribute('data-origin') === '__cross-chapter'){ window.history.back(); return; }
  if(this.getAttribute('data-origin') === '__same-chapter'){
    if(samePageReturn){
      if(samePageReturn.page !== currentPage) showPage(samePageReturn.page);
      window.scrollTo(0, samePageReturn.y);
    }
    return;
  }
  showPage(this.getAttribute('data-origin') || 'recap');
});
// ---- 같은 장 안으로 점프해도 되돌아간다 (신설 2026-08-23, 사용자 지적) ----
// ★★ **왜 없었나 — 빠뜨린 인스턴스가 아니라 경로가 통째로 없었다.** 이 칩은 두 자리에서만
//   팔을 걷는다: 자가점검에서 탭을 옮길 때(`armJumpBack`)와 **다른 장**에서 딥링크로 들어와
//   페이지가 새로 뜰 때(`armCrossChapterBack`). 그런데 같은 장 링크(`[[ch13:sec-…]]`)의 href 는
//   **지금 이 문서**라 브라우저가 «문서 안 해시 이동» 으로 처리한다 — 로드가 없으니 둘 다 안 돈다.
// ★ 착지까지 여기서 한다. 대상이 **다른 탭**에 있으면 네이티브 해시 이동은 아무 일도 안 하기
//   때문이다(그 탭은 `.page` 가 안 켜져 레이아웃이 없다). 판정은 딥링크 진입과 같다 —
//   앵커 이름이 아니라 **DOM 위치**로 어느 탭인지 정한다.
var samePageReturn = null;
document.addEventListener('click', function(ev){
  var a = ev.target && ev.target.closest ? ev.target.closest('a.xlink') : null;
  if(!a) return;
  var url;
  try { url = new URL(a.getAttribute('href'), window.location.href); } catch(ignore) { return; }
  if(url.pathname !== window.location.pathname) return;   // 다른 장 — armCrossChapterBack 의 몫
  var target = url.hash ? document.getElementById(url.hash.slice(1)) : null;
  if(!target) return;                                     // 못 찾으면 브라우저에 맡긴다(빌드가 대상을 검사한다)
  ev.preventDefault();
  samePageReturn = {page: currentPage, y: window.scrollY};
  var host = target.closest('.page[data-page]');
  if(host && host.getAttribute('data-page') !== currentPage) showPage(host.getAttribute('data-page'));
  target.scrollIntoView({block:'start'});
  var btn = document.getElementById('jumpBack');
  btn.setAttribute('data-origin', '__same-chapter');
  btn.textContent = '← 보던 자리로 돌아가기';
  btn.hidden = false;
});
// 다른 챕터에서 복습 딥링크로 들어온 경우: 원래 챕터로 되돌아가는 칩을 띄운다.
function armCrossChapterBack(){
  var ref = document.referrer;
  if(!ref) return;
  var url; try { url = new URL(ref); } catch(ignore) { return; }
  if(url.origin !== window.location.origin) return;
  var m = /ch(\d{2})\.html$/.exec(url.pathname);
  var here = /ch(\d{2})\.html$/.exec(window.location.pathname);
  if(!m || (here && m[1] === here[1])) return;
  var btn = document.getElementById('jumpBack');
  btn.setAttribute('data-origin', '__cross-chapter');
  btn.textContent = '← ' + parseInt(m[1], 10) + '장으로 돌아가기';
  btn.hidden = false;
}

// ---- theory (full list, own page; each section gets an anchor id) ----
// 삽화는 diagrams[].afterParagraph(1-based)가 가리키는 단락 바로 뒤에 끼워 넣는다.
// 앵커가 없거나 범위를 벗어나면 예전처럼 본문 끝에 붙는다.
// linked:false — 본문에 이미 같은 대상으로 가는 링크가 있는 경우. 링크만 죽이고
// 복습 삽화는 그대로 보여준다 (중복은 링크지 그림이 아니다).
// owner = 이 복습 항목을 품은 **절**. 복습 항목 자체는 사유를 적는 단위가 아니다
// (사유는 절 단위 한 줄 — 위 diagramNote 주석이 정본).
function renderReviewItem(ref, owner){

  // 라벨만 남기면 '계·주위·경계' 같은 이미 아는 용어가 반복되고, 링크가 아닌데 밑줄이 뜬다.
  var head = ref.linked === false
    ? ''
    : '<a class="review-prereq-link" href="' + esc(ref.href) + '">' +
        '<span>' + fmtText(ref.label) + '</span><span class="review-prereq-en">' + fmtText(ref.english) + '</span><span aria-hidden="true">→</span></a>';
  return '<div class="review-prereq-item">' + head + renderDiagrams(ref.diagrams, owner) + '</div>';
}
function renderReviewPrerequisites(refs, owner){

    + refs.map(function(ref){ return renderReviewItem(ref, owner); }).join('') + '</div>';
}
// ★ 절 번호는 **데이터가 아니라 순서**에서 온다 (2026-08-02, 사용자 결정).
//   지금까지 본문은 `§1.3의 발상이…` 처럼 **교재 절 번호**로 앞 절을 가리키면서
//   정작 절 제목에는 번호가 없었다 — 독자는 그 §1.3 이 화면 어디인지 알 수 없다
//   (사용자: *[발화 생략]*).
//   heading 에 `3절` 을 **박아 두는** 길도 있지만, 절을 재배열할 때마다 전부 손으로 고쳐야 하고
//   한 번만 빠뜨리면 화면 번호와 실제 순서가 어긋난다. 그래서 렌더 시점에 index 로 매긴다 —
//   `reorder_sections.py` 로 순서를 바꿔도 자동으로 맞는다.
//   본문 링크 쪽 라벨(`[[ch01:sec-linear|4절 선형 ODE]]`)의 숫자는 빌드가 검사한다
//   (`theory_link_number_issues`) — 두 자가 갈라지는 것을 기계가 막는 자리다.
function theorySectionNo(id){
  for(var i = 0; i < CH.theory.sections.length; i++){
    if(CH.theory.sections[i].id === id) return i + 1;
  }
  return null;
}
// ★ 장별 요약 절은 **이론 절로 저장하고 화면만 「05 요약」 탭으로 보낸다** (2026-08-26).
//   왜 새 컬렉션을 안 만들었는지는 `data-page="summary"` 마크업 위 주석이 정본이다.
//   ★ 번호를 안 붙인다 — 절 번호는 이론 탭 안의 순서를 가리키는 말인데 이 절은 그 탭에 없다.
//     `theorySectionNo` 는 그대로 전체 순서로 센다(빌드 `theory_link_number_issues` 와 같은 셈법).
//     요약이 **맨 마지막**이라는 것을 빌드가 보장하므로 두 자가 갈라질 자리가 없다.
function isChapterSummary(s){ return !!(s && s.chapterSummary); }
function theoryBodySections(){
  return CH.theory.sections.filter(function(s){ return !isChapterSummary(s); });
}
function summarySections(){ return CH.theory.sections.filter(isChapterSummary); }
function theoryHeadingHtml(s){
  var n = isChapterSummary(s) ? null : theorySectionNo(s.id);
  return (n ? n + '절 ' : '') + fmtText(s.heading);
}
function renderTheoryBody(s){
  var paras = String(s.content).split(/\n{2,}/);
  var byAnchor = {}, defByAnchor = {}, tail = [];
  (s.diagrams || []).forEach(function(dg){
    var a = dg.afterParagraph;
    if(a >= 1 && a <= paras.length){ (byAnchor[a] = byAnchor[a] || []).push(dg); }
    else { tail.push(dg); }
  });
  (s.definitions || []).forEach(function(def){
    var a = def.afterParagraph;
    if(a >= 1 && a <= paras.length){ (defByAnchor[a] = defByAnchor[a] || []).push(def); }
  });
  // 복습 링크: afterParagraph가 있으면 해당 단락 뒤에 인라인, 없으면 절 상단 블록(기존 동작).
  var reviewByAnchor = {}, reviewTop = [];

  //   여전히 타당하지만, **읽는 흐름이 끊기는 비용이 더 크다는 것이 실사용에서 드러났다** —

  var claimed = {};

/* ★★ 진도 자 (신설 2026-09-18) — 「이론 여기까지」 하나로 뒤따르는 것이 함께 접힌다.

var PROGRESS_KEY = 'progress:' + chapterStoragePrefix;
function progressSections(){ return theoryBodySections(); }
function progressLimitStored(){
  var n = progressSections().length, raw = null;
  try { raw = localStorage.getItem(PROGRESS_KEY); } catch(ignore) {}
  var v = parseInt(raw, 10);
  return (v >= 1 && v <= n) ? v : n;        // 값이 없거나 절 수가 바뀌었으면 «전체»
}
var progressLimit = progressLimitStored();
function progressIsFull(){ return progressLimit >= progressSections().length; }
function sectionInRange(id){
  var secs = progressSections();
  for(var i = 0; i < secs.length; i++){ if(secs[i].id === id) return i < progressLimit; }
  return true;                               // 이론 절에 없는 id(요약 등)는 자가 안 본다
}
function itemInRange(item){
  if(!item) return true;
  if(!item.section) return progressIsFull();
  return sectionInRange(item.section);
}
/* 유도 카드의 절 — **새 필드를 안 만든다.** 문항이 `relatedFormulas` 로 이미 공식을 가리키므로
   그 문항의 `section` 에서 거꾸로 잇는다. 한 공식을 여러 절이 쓰면 **가장 앞선 절**을 택한다 —
   그 절에서 처음 필요해지기 때문이고, 뒤쪽 절 기준으로 잡으면 정작 쓸 때 안 보인다.
   가리키는 문항이 하나도 없는 카드는 자가 판정하지 않는다(늘 보인다) — 모르는 것을 감추지 않는다. */
var formulaSectionIdx = (function(){
  var order = {}, map = {};
  progressSections().forEach(function(s, i){ order[s.id] = i; });
  (CH.practice || []).concat(CH.problems || []).forEach(function(it){
    if(!it || !it.section || !Object.prototype.hasOwnProperty.call(order, it.section)) return;
    (it.relatedFormulas || []).forEach(function(fid){
      if(!Object.prototype.hasOwnProperty.call(map, fid) || order[it.section] < map[fid]) map[fid] = order[it.section];
    });
  });
  return map;
})();
function formulaInRange(f){
  if(!f || !Object.prototype.hasOwnProperty.call(formulaSectionIdx, f.id)) return true;
  return formulaSectionIdx[f.id] < progressLimit;
}
function renderProgressBar(){
  var bar = document.getElementById('progressBar');

  var secs = progressSections();
  if(secs.length < 2){ bar.hidden = true; return; }   // 절이 하나면 조절할 것이 없다
  bar.hidden = false;

  var sel = document.getElementById('progressSelect');
  sel.innerHTML = secs.map(function(s, i){

    return '<option value="' + (i + 1) + '">' + (i + 1) + '절까지 · ' + esc(name)
      + (i === secs.length - 1 ? ' (전체)' : '') + '</option>';

}

function syncTheoryTocFromScroll(){

  //   숨겨져 있어 `getBoundingClientRect().top` 이 0 이다. 좁히지 않으면 **DOM 순서상 마지막인
  //   요약 절이 언제나 기준선을 통과해** 목차가 늘 그 절에 붙는다(2026-08-26).
  var items = document.querySelectorAll('#theoryList .theory-item');

function scrollCardToReadingPosition(el, topRatio){
  if(!el) return;
  // 유도 공식 카드(.fcard)는 스테퍼(공식 N/M 카운터)를 sticky 탭바 바로 아래에 앉힌다
  // → 위 히어로의 키워드는 스크롤로 숨기고, 카운터와 공식은 보이게 한다.
  // (카드 자체를 탭바 밑에 올리면 공식이 탭바에 가려서, 스테퍼를 기준점으로 삼는다.)
  // 문풀 카드(.pcard)도 같은 기준을 쓴다 — 23% 비율 착지는 카드 높이가 문항마다 달라 번호를 누를
  // 때마다 화면이 흔들렸다(2026-09-11 사용자 지적, 연습문제·유도처럼 위쪽 고정).
  if(el.classList.contains('fcard') || el.classList.contains('pcard')){
    var sec = el.closest('.page');
    var anchor = (sec && sec.querySelector('.stepper-bar')) || el;
    var tb = document.getElementById('tabbar');
    var foff = (tb ? tb.offsetHeight : 56) + 10;
    var ftop = anchor.getBoundingClientRect().top + window.scrollY - foff;
    window.scrollTo(0, Math.max(0, ftop));
    return;
  }
  var ratio = topRatio === undefined ? 0.23 : topRatio;
  var top = el.getBoundingClientRect().top + window.scrollY - Math.round(window.innerHeight * ratio);
  window.scrollTo(0, Math.max(0, top));
}

/* 커버가 스크롤 밖으로 밀려 sticky 탭바가 화면 맨 위에 붙는 스크롤 위치.

   ★ **sticky 요소의 `offsetTop` 은 정적 위치가 아니라 '지금 붙어 있는 자리'다** (열린 날 2026-07-31,
   사용자 지적: *[발화 생략]*).
   브라우저는 sticky 로 밀려난 박스를 기준으로 `offsetTop` 을 돌려주므로, 탭바가 화면 맨 위에 붙어 있는
   동안 이 값은 **그때의 scrollY** 와 같아진다. 실측(ch01, 이론 탭 맨 아래):
     `scrollY 16719 / tabbar.offsetTop 16719` → `scrollTo(0, 16719)` = **제자리**.
     유도 탭으로 바뀐 뒤 문서가 짧아지면(1806) 그 값이 최대 스크롤로 잘려 **첫 화면이 아니라 맨 아래**에 착지한다.
   즉 `startFromTop()` 은 제대로 돌고 있었고(저장 스크롤도 지웠다), **착지 좌표를 재는 자가 틀렸다.**
   그래서 2026-07-30·31 에 '다음' 동선을 두 번 고치고도 증상이 남았다 —
   맨 위 근처에서 누르면 값이 맞아 고쳐진 것처럼 보였기 때문이다.

   고친 형태: 잴 때만 sticky 를 풀어 **정적 위치**를 읽는다. `offsetTop`(= offsetParent 기준) 대신
   `rect.top + scrollY` 를 쓰는 이유는 위 조상에 `position:relative` 가 생겨도 문서 좌표를 유지하기 위함이다.
   잠금장치: `test_checks.py::test_next_button_starts_from_top` 의 「착지 좌표」 절. */
function tabTopScroll(){
  var tb = document.getElementById('tabbar');
  if(!tb) return 0;
  var prev = tb.style.position;
  tb.style.position = 'static';
  var top = tb.getBoundingClientRect().top + window.scrollY;   // 읽는 순간 리플로우가 강제된다
  tb.style.position = prev;
  return Math.max(0, Math.round(top));

function pageEmptyInRange(name){
  if(name === 'example') return !exampleDeck().length;
  if(name === 'derivation') return !((CH.derivation && CH.derivation.formulas) || []).some(formulaInRange);
  if(name === 'practice') return !pracDeck().length;

function nextVisiblePage(from){
  for(var i = PAGE_ORDER.indexOf(from) + 1; i < PAGE_ORDER.length; i++){
    var name = PAGE_ORDER[i];
    if(hiddenPages.indexOf(name) >= 0 || pageEmptyInRange(name)) continue;
    return name;
  }
  return 'recap';
}
// 뒤로 가기용 대칭 함수 (신설 2026-09-13, 예제 탭 도입과 함께) — derivPrevBtn·pracPrevBtn 이
// 「바로 앞 탭」을 하드코딩하고 있었는데, 예제 탭처럼 비어서 숨는 탭이 그 사이에 끼면 숨은
// 탭으로 되돌아가는 죽은 자리가 된다(nextVisiblePage 가 앞에서 이미 푼 것과 같은 문제).
function previousVisiblePage(from){
  for(var i = PAGE_ORDER.indexOf(from) - 1; i >= 0; i--){
    var name = PAGE_ORDER[i];
    if(hiddenPages.indexOf(name) >= 0 || pageEmptyInRange(name)) continue;
    return name;
  }
  return 'lo';
}

// (2026-07-30 선례: 문구와 동작이 어긋나면 그 자체가 결함이다).
function lastCardLabel(from, normalNext, normalText){
  var to = nextVisiblePage(from);
  return to === normalNext ? normalText : '다음: ' + PAGE_LABEL[to] + ' →';

/* ★ 브라우저 뒤로가기가 **탭 이력**을 따라간다 (2026-09-18, 사용자: *[발화 생략]*).

   URL 없이 부르면 주소는 그대로이고 **이력 항목만** 쌓인다.

   않는 경로도 있어 `load` 에서 한 번 더 받친다. */
var tabHistoryStarted = false, restoringTab = false;
function syncTabHistory(name){
  if(restoringTab || !name) return;
  try {
    if(!tabHistoryStarted){ history.replaceState({vtab:name}, ''); tabHistoryStarted = true; }
    else if(!(history.state && history.state.vtab === name)){ history.pushState({vtab:name}, ''); }
  } catch(ignore) {}
}
window.addEventListener('popstate', function(e){
  var name = e.state && e.state.vtab;
  if(!name || name === currentPage) return;
  restoringTab = true;
  try { showPage(name); } finally { restoringTab = false; }
});
window.addEventListener('load', function(){
  if(tabHistoryStarted || !currentPage) return;
  try { history.replaceState({vtab:currentPage}, ''); tabHistoryStarted = true; } catch(ignore) {}
});
function showPage(name, practiceEntryRatio){
  // ★ 시험 장에서는 채점 전에 자가점검으로 못 간다 — 답을 내기 전에 되짚기를 여는 길이다.
  //   막기만 하지 않고 **답안을 내는 자리로 데려간다**(막힌 이유가 화면에 보여야 한다).
  if(name === 'recap' && examLocksRecap()){
    var submit = document.querySelector('.exam-submit');
    if(submit) submit.scrollIntoView({block:'center', behavior:'smooth'});
    return;
  }
  if(currentPage) pageScroll[currentPage] = window.scrollY;
  if(name !== 'example') exampleReturnSection = null;
  // 예제 탭도 같은 카드형 작업 화면이라 첫 진입 스크롤 정책을 함께 쓴다(2026-09-13).
  var firstPracticeEntry = (name === 'practice' || name === 'example') && !Object.prototype.hasOwnProperty.call(pageScroll, name);
  document.querySelectorAll('.page').forEach(function(el){
    el.classList.toggle('active', el.getAttribute('data-page') === name);
  });
  document.querySelectorAll('.tabbtn').forEach(function(el){
    el.classList.toggle('active', el.getAttribute('data-tab') === name);
  });
  currentPage = name;
  syncTabHistory(name);
  document.getElementById('tabbar').setAttribute('data-theory-active', String(name === 'theory'));
  document.documentElement.classList.toggle('theory-active', name === 'theory');
  document.documentElement.classList.toggle('derivation-active', name === 'derivation');
  // 문풀 탭만 **작업 화면**이라 읽기 폭(640) 규칙에서 빠진다 — 가로 화면에서 2열로 펼치기 위해서다
  // (W-45. 640 은 *읽는 텍스트*의 폭이고 문풀 카드는 풀면서 보는 화면이다).
  // ★ 예제 탭(2026-09-13)은 같은 `.pcard` 마크업을 그대로 재사용하므로 이 클래스도 함께 쓴다 —
  //   전용 CSS를 새로 만들면 두 탭이 갈라질 자리가 생긴다.
  document.documentElement.classList.toggle('practice-active', name === 'practice' || name === 'example');
  // 연습문제 탭도 같은 이유로 읽기 폭에서 뺀다 — 삽화(좌)와 정답(우)을 나란히 놓는 **작업 화면**이다.
  // 2026-08-01 사용자 요청. 실측 근거는 위 `html.problems-active` CSS 주석에 있다.
  document.documentElement.classList.toggle('problems-active', name === 'problems');
  if(name !== 'theory') setTheoryTocOpen(false);
  if(name !== 'derivation') setDerivTocOpen(false);
  // 처음 여는 탭은 커버(챕터 표지) 아래, 즉 탭바가 화면 맨 위에 오도록 착지시킨다.
  // scrollTo(0,0)이면 커버가 화면을 채워 '01 이론…' 탭이 스크롤 밖으로 밀린다(2026-07-23 회귀).
  // 이미 본 탭이면 그 세션에서 보던 위치를 복원한다.
  if(Object.prototype.hasOwnProperty.call(pageScroll, name)) window.scrollTo(0, pageScroll[name]);
  else window.scrollTo(0, tabTopScroll());
  saveReaderPosition();  // 탭 전환도 즉시 저장 — 스크롤 안 해도 마지막 화면이 새로고침 후 유지된다 (2026-07-27)
  if(firstPracticeEntry){
    var entryCardSel = '#' + (name === 'example' ? 'exampleCard' : 'pracCard') + ' .pcard';
    requestAnimationFrame(function(){
      scrollCardToReadingPosition(document.querySelector(entryCardSel), practiceEntryRatio === undefined ? 0.16 : practiceEntryRatio);
    });
  }
  if(name === 'theory') syncTheoryTocFromScroll();
  // 숨은 페이지에서는 getBBox 가 0이라 칩이 안 깔린다 — 탭이 열리는 이 순간이 유일한 기회다.
  paintGivenChips(document);
}

/* ★ 2026-07-31 재발 — **한 전이만 고쳤더니 나머지 넷이 그대로였다.**

       → `showPage` 가 옛 스크롤을 복원해 첫 카드의 위쪽이 잘린 채 착지한다.
     · 문풀(`practice`)·연습문제(`problems`) 로 가는 버튼은 이 함수를 **거치지도 않았다**.
   그래서 '맨 위에서 시작한다'는 정책이 다섯 전이 중 둘에만 살아 있었다.

   고친 형태: **스크롤 버리기는 모든 탭 공통**으로 하고, 카드형은 그 위에 인덱스 초기화를 더한다.
   그리고 모든 '다음' 버튼이 이 함수를 지나가게 한다 —
   잠금장치는 `test_checks.py::test_next_button_starts_from_top`(소스에서 직접 확인). */
function startFromTop(name){
  delete pageScroll[name];        // 스크롤형·카드형 공통 — 저장 위치를 버려야 탭 맨 위로 착지한다
  if(name === 'example'){ exampleIndex = 0; renderExampleCard(); }

  // 「유도로」를 눌렀는데 접힌 카드만 보여 «유도 볼 게 없다»로 읽혔다).
  if(name === 'derivation'){

    renderDerivCard();
  }
  if(name === 'practice'){ pracIndex = 0; renderPracCard(); }
}

// 가르고, 둘 다 없으면 진도 전체일 때만 보인다(모르는 것을 진도 안이라고 단정하지 않는다 — itemInRange 와 같은 규칙).
function textbookInRange(it){
  if(!it) return true;
  if(it.section) return sectionInRange(it.section);
  var objs = it.objectives || [];
  if(!objs.length) return progressIsFull();
  var los = {};
  (CH.learningObjectives || []).forEach(function(lo){ if(lo && lo.id) los[lo.id] = lo; });
  return objs.some(function(o){
    var secs = (los[o] && los[o].relatedSections) || [];
    return secs.some(function(sid){ return sectionInRange(sid); });
  });
}
function renderTextbook(){
  var tb = CH.textbookProblems || {};
  var items = (tb.items || []).filter(textbookInRange);
  var host = document.getElementById('textbookList');
  if(!items.length){ host.innerHTML = ''; return; }
  var head = '<div class="tb-head">' + fmtText(tb.source || '') +
    (tb.note ? '<div class="tb-note">' + fmtText(tb.note) + '</div>' : '') + '</div>';
  host.innerHTML = head + items.map(function(it, i){
    // ★ 교재문제는 「풀이 해설」 접힘을 쓰지 않는다 (2026-09-18, 사용자: *[발화 생략]*). 접힘은 문풀·연습문제 쪽 판정(2026-09-13)이고,
    //   여기는 답 바로 아래 한두 줄이라 접으면 여는 품만 든다.
    var outline = (it.outline && it.outline.length)
      ? '<ol class="q-outline">' + it.outline.map(function(st){
          return '<li>' + renderStep(st) + '</li>'; }).join('') + '</ol>'
      : '';
    return '<article class="qcard tb-card' + reviewClass(it, 'answer') + '" id="tb-' + esc(it.id) + '">' +
      '<div class="tb-ref">' + esc(it.ref) + (it.topic ? ' <span class="tb-topic">· ' + fmtText(it.topic) + '</span>' : '') + '</div>' +
      // ★ 「왜 이 문항인가」는 접힘 **안**에 둔다 (2026-09-18, 사용자: *[발화 생략]*). 밖에 두면 교재를 펴기 전에
      //   방법이 먼저 읽힌다 — 이 카드의 목적은 번호를 주고 스스로 풀게 하는 것이다.
      '<details class="q-answer"><summary>정답 · 풀이 뼈대 펼치기 (먼저 스스로 푼 다음에)</summary>' +
        (it.why ? '<div class="tb-why' + reviewClass(it, 'why') + '">' + fmtText(it.why) + '</div>' : '') +
        '<div class="q-ans-val' + reviewClass(it, 'answer') + '">' + renderAnswer(it.answer || '') + '</div>' +
        (outline ? '<div class="q-outline-wrap' + reviewClass(it, 'outline') + '">' + outline + '</div>' : '') +
      '</details></article>';
  }).join('');
}
