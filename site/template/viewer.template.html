     ★ 경로는 챕터 파일 기준 상대(`../fonts/`)다 — 파일을 직접 열어도 뜨게 하려는 것이다. */

  /* ★ 세리프는 **굵은 것 하나만** 싣는다 — 19px 이상 자리(표지·공식 이름·번호)가 전부

    src:url("../fonts/JeongriSerif-Bold.woff2") format("woff2");}
  :root{
    /* ★★ 종이색 — **회녹(제도지)** (사용자 판정 2026-08-13, 후보 일곱 중 5번).
       고른 근거가 기록될 값어치가 있다: 사용자가 [발화 생략] 고 했고, 그 순서가 **파랑 채널**과 정확히 같았다
       (크림 236 · 중성 244 · 차가움 247). 즉 **눈 편함은 파랑을 낮추는 데서 오고,

       그래서 파랑은 크림만큼 낮게(236) 두고 색상만 녹 쪽으로 옮겼다. 제도지·모눈종이가
       실제로 이 색이라 이 자료의 성격과도 맞는다. */
    --paper:#f0f3ec;
    --paper-raised:#f8faf5;
    /* ★ 본문 대비를 **13.89 → 11.72** 로 내렸다 (2026-08-13, 「AI 냄새」 배치 C 항).
       옛 값 #20242b 는 종이 대비 **13.89:1** 이었다. 인쇄물의 본문은 보통 10~12 이고,
       그보다 높으면 흰 바탕에서 글자가 «떠서» 오래 읽을 때 눈이 먼저 지친다.
       #2b3138 = **11.72:1** — 인쇄물 구간 안이면서 AAA(7:1)에 아직 4.7 만큼 여유가 남는다.
       ★ 색상은 안 건드렸다(B > G > R 그대로). 명도만 한 칸 올린 것이라 «회색 글씨»가 되지 않는다.

         어두운 바탕에서 번진다(halation). 한쪽만 내리면 같은 결함이 반대 테마에 남는다. */
    --ink:#2b3138;
    /* 2026-07-26: 이전 #6b6558은 --paper 대비 5.2:1이라 AA는 넘어도 AAA(7:1)에 한참 못 미쳤다.
       `초기화`·`정답 · 풀이 뼈대 펼치기` 등 --sub 글자가 11.5~12.5px로 작아서, 낮은 대비가
       '폰트가 뭉개진다'로 체감됐다(사용자 지적 — 폰트를 바꿔도 안 없어지던 증상).
       #575145 = 7.1:1 (AAA). --ink(14.1:1)보다는 여전히 밝아 본문/보조 위계는 유지된다.

    --sub:#575145;
    --blue:#2c4a66;
    --blue-soft:#e6ecf1;

       *«어울리는 건 짙은 청록인 듯. 이전에 크림과 구리가 비슷했던 것처럼»* — 즉 **유사색 조화**다.
       크림+구리가 둘 다 따뜻한 계열이라 붙었듯이, 회녹 종이에는 같은 녹 계열의 청록이 붙는다.
       ★ 지켜볼 것: 삽화의 **저온 유체 파랑**(#4d7690)과 색상이 31도 차이다. 역할이 달라
         (강조는 글자·선, 저온은 면 채우기) 지금은 구별되지만, **한 삽화에서 둘 다 글자로

    --copper-soft:#d9e8e4;

       *[발화 생략]*
       선택 표시는 **어디에 있는지 알려 주는 것**이지 읽을 것을 가리키는 신호가 아니다.
       그런데 --copper-soft 를 그대로 써서 변경점 하이라이트와 같은 세기로 경쟁하고 있었다.
       바꿀 일이 생기면 이 두 값만 고친다 — 다섯 군데에 흩어 놓으면 다시 갈라진다.
       ★ 2026-07-30 재조정 38% → 22%/30%. 사용자: *[발화 생략]*
       면(--sel-soft)은 더 많이 내리고 **테두리(--sel-line)는 덜 내린다** — 인지는
       윤곽이 담당하고 시선을 끄는 것은 면적이라, 둘을 같은 비율로 내리면
       '눌렸다는 것'까지 같이 사라진다(38%를 한 번에 균등하게 내려 실패한 자리다).
       ★ 2026-08-18 재조정 22%\30% → 14%\26% (**3회차 지적**). 사용자: *[발화 생략]*. 값은 **고른 값**이다 — 직전 조정의 비율
       (면 38→22 = −42% · 테두리 38→30 = −21%, 대략 2:1)을 한 번 더 적용했다.
       ★ 세 번 다 같은 방향으로 왔다는 것이 이 값의 성질을 말한다: **선택 표시는 계속 진해
       보인다.** 다음에 또 오면 비율을 또 적용하지 말고 «면을 아예 빼고 테두리만 남길지»를 묻는다 —
       비율을 반복하면 0 에 수렴할 뿐 판정을 안 한 것이다. */
    --sel-soft:color-mix(in srgb, var(--copper-soft) 14%, transparent);
    --sel-line:color-mix(in srgb, var(--copper) 26%, transparent);
    --line:#ded6c2;
    --line-strong:#c9bfa5;
    --s1:#4d7690;
    --s1-soft:#e2ebf0;
    --s2:#8a7530;
    --s2-soft:#efe8d3;
    --s3:#2f6b63;
    --s3-soft:#f3e2d3;
    --code-bg:#ece6d6;
    --warn:#a04432;
    --warn-soft:#f4e2db;

       구리·남색·회색은 셋 다 채도·명도가 비슷해 '다르다'만 말하고 '더 크다'를 못 했다.
       서열 채널을 **채도**로 바꾼다 — 고채도 빨강 > 파스텔 > 무채색 회색.
       사용자 원문: *[발화 생략]*.
       `-ink`는 배지 글자색이다. 배경 채도가 내려가면 흰 글자가 안 읽히므로 레벨마다 따로 잡는다

    /* #dc3b2f 는 흰 글자 대비가 4.46 이라 AA(4.5)에 아슬하게 못 미쳤다(DOM 실측 2026-07-29).

    --rv-major:#cc2f26;    --rv-major-ink:#ffffff;
    --rv-minor:#9cc7e8;    --rv-minor-ink:#11384f;

       다크에서만 값이 생긴다. 아래 `.diagram-box svg` 주석이 정본. */
    --fig-edge:transparent;
    /* ★★★ 글자 크기 사다리 — **네 단** (신설 2026-08-13, 사용자 [발화 생략] 배치의 A·B 항).
       ★ 왜 색보다 이쪽인가: **색은 «무슨 느낌»을 정하고 크기 단계는 «정돈됐나»를 정한다.**
         실측(브라우저, ch01 한 화면) 저작된 단계가 **17개**였다 —
         10 · 10.5 · 11 · 11.5 · 12 · 12.5 · 13 · 13.5 · 14 · 14.5 · 15 · 15.5 · 17 · 19 · 20 · 28 · 52.
         이웃한 두 단의 차이가 0.5px(3%)이라 **독자는 «다른 단»으로 못 읽는다.** 그러면 위계가
         아니라 잡음이고, 자리마다 값이 갈린 것과 화면에서 구별되지 않는다.
       ★ 값을 고른 자: 이웃 단의 비가 **1.13 · 1.19 · 1.23** 이 되게 잡았다. 1.1 아래로 붙이면
         위 실측의 상태로 되돌아간다. 표지(28·52)는 한 장에 한 번 나오는 자리라 사다리 밖이다.
       ★★ `--fs-body` 15.5px 은 **못 박힌 값이다.** 삽화 자 전부가 여기 묶여 있다
         (`checks_svg.FIGURE_TEXT_BODY_PX` 15.5 · 첨자 하한 12.9 = 15.5 × 0.83).
         이 값을 움직이면 삽화 4천 곳의 판정이 통째로 어긋난다.
       ★ 배정은 **값이 아니라 역할**로 한다(가까운 단으로 반올림하지 않는다):
         micro = 뱃지·상태 칩·출처·눈금 라벨 / small = UI 컨트롤·조밀한 목록·보조 문장 /
         body = 독자가 문장으로 읽는 것 / head = 공식 이름·디스플레이 수식·번호.
       잠금 `test_checks.py::test_type_scale_is_a_short_ladder` — 새 자리가 날 px 을 쓰면 막는다. */
    --fs-micro:11.5px;
    --fs-small:13px;
    --fs-body:15.5px;
    --fs-head:19px;
    --fs-cover-title:28px;
    --fs-cover-num:52px;

  :root[data-theme="dark"]{
    /* 다크 짝도 같은 채널 순서를 지킨다(G > R > B) — 라이트가 회녹이면 다크도 회녹이어야
       한 화면에서 색상이 갈리지 않는다. */
    --paper:#151814; --paper-raised:#1c201b; --ink:#d8d3c8; --sub:#a39c8a;
    --blue:#8fb3d1; --blue-soft:#1f2c37; --copper:#e2915a; --copper-soft:#332318;
    --line:#31363d; --line-strong:#3d444d; --s1:#7fa9c4; --s1-soft:#1c2a33;
    --s2:#c8ac5a; --s2-soft:#2e2a18; --s3:#e2915a; --s3-soft:#332318; --code-bg:#20252b;
    --warn:#e0876c; --warn-soft:#38221a; --answer:#5fc9ad; --answer-soft:#16302a;
    /* 다크에서는 고채도 빨강이 번져 눈이 아프다 — 명도를 올리고 채도를 조금 낮춘 뒤
       글자를 어둡게 뒤집는다. 서열(고채도 > 파스텔 > 무채색)은 그대로 유지된다. */
    --rv-major:#f2665a; --rv-major-ink:#3a0d08;
    --rv-minor:#7fb0d2; --rv-minor-ink:#0c2333;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -12px rgba(0,0,0,.55);
    --fig-edge:rgba(0,0,0,.5);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#151814; --paper-raised:#1c201b; --ink:#d8d3c8; --sub:#a39c8a;
      --blue:#8fb3d1; --blue-soft:#1f2c37; --copper:#e2915a; --copper-soft:#332318;
      --line:#31363d; --line-strong:#3d444d; --s1:#7fa9c4; --s1-soft:#1c2a33;
      --s2:#c8ac5a; --s2-soft:#2e2a18; --s3:#e2915a; --s3-soft:#332318; --code-bg:#20252b;
      --warn:#e0876c; --warn-soft:#38221a; --answer:#5fc9ad; --answer-soft:#16302a;
    /* 다크에서는 고채도 빨강이 번져 눈이 아프다 — 명도를 올리고 채도를 조금 낮춘 뒤
       글자를 어둡게 뒤집는다. 서열(고채도 > 파스텔 > 무채색)은 그대로 유지된다. */
    --rv-major:#f2665a; --rv-major-ink:#3a0d08;
    --rv-minor:#7fb0d2; --rv-minor-ink:#0c2333;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -12px rgba(0,0,0,.55);
      --fig-edge:rgba(0,0,0,.5);
    }
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  /* display:flex 등 저자 스타일이 hidden 속성(UA display:none)을 덮어쓰는 사고 방지 */
  [hidden]{display:none !important;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Jeongri Sans","Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:var(--fs-body); line-height:1.7; -webkit-font-smoothing:antialiased;
  }
  .serif{font-family:"Jeongri Serif","Nanum Myeongjo","Noto Serif KR","Batang",Georgia,serif;}
  /* ★ `.imath` = 본문 산문 속 인라인 수식 `\( … \)` (신설 2026-08-02, 사용자 결정).
     왜 — DOM 실측 결과 같은 식이 화면에서 **셋**으로 갈렸다: 유도 카드 `.fmath`·문풀 `.soltpl`
     은 등폭, 삽화는 (2026-08-02 재조판 후) 등폭, 그런데 **본문만 Pretendard 산세리프**였다.
     `\frac`·`_{}` 같은 구조가 없는 식(`a ds = v dv`)은 감싸도 화면이 평문과 **완전히 같아서**,
     표기를 아무리 통일해도 독자에게는 '수식'이라는 표시가 전달되지 않았다.
     글꼴 스택은 `.mono` 와 **한 선언을 공유한다** — 두 벌로 적으면 반드시 갈라진다
     (이 리포가 캡션 자·치수 그룹 자에서 이미 두 번 겪은 부류). 잠금은
     `test_checks.py::test_inline_math_uses_math_font`. */
  /* ★★ **숫자 0 만 본문 글꼴로 갈아끼우던 `@font-face`("Jeongri Math Zero", `unicode-range:U+0030`)를
     걷어냈다** (2026-09-18, 사용자: *[발화 생략]*).
     실측(캔버스 `measureText`, 700 13px): 0 은 7.74px(Jeongri Sans) · 3 은 7.15px(ui-monospace)
     로 **한 수 안에서 글꼴과 폭이 둘로 갈렸다.** 그게 화면에서 «0만 두껍다» 로 보인 것이다.
     되돌리지 않는 이유: Jeongri Sans 의 숫자는 비례폭(0:8.58 · 3:8.30 · 2:7.93)이라 전부 그쪽으로
     넓히면 **자릿수 정렬이 깨진다.** 등폭 쪽(전부 7.15)으로 통일하는 것이 수식·표에 맞다.
     옛 장치가 막으려던 것(등폭 글꼴의 점 찍힌 0)이 거슬리면 그때는 **글꼴 전체**를 바꾸지
     0 하나만 갈아끼우지 않는다 — 한 수 안에서 글꼴이 갈리는 것이 더 크게 보인다. */
  .mono,.imath{font-family:ui-monospace,"SF Mono","Cascadia Code",Consolas,"Liberation Mono",monospace;}

       이 자리다. **빠뜨린 것이 아니라 자리를 열거하는 형태 자체가 원인**이다: 새 컨테이너가
       생길 때마다 목록에 적어야 하고, 안 적으면 **조용히** 브라우저 기본으로 떨어진다.
     ★ **그래서 기본값에는 자리 이름을 쓰지 않는다.** 자리 이름이 붙은 규칙은 **예외일 때만** 둔다 —
         · `.fmath` : 밑글자가 19px 라 0.68 (위 주석)
         · `.intop` : 위치가 ∫ 잉크 실측으로 잠겨 있어 하한을 안 건다 (아래 주석)
       `.imath` 는 예외가 아니라 **기본값 그 자체**라 전용 규칙을 두지 않는다 — 두면 같은 값이
       두 벌이 되고, 두 벌로 적은 값은 이 리포에서 이미 두 번 갈라졌다(캡션 자·치수 그룹 자).
     ★ 값은 하나도 새로 만들지 않았다 — 비율 0.72 와 `--script-floor`·`--script-cap` 그대로다.
       결과(브라우저 실측, 밑글자 → 첨자 px): 15.5 12.92→**11.16** · 15 12.5→**10.80** ·
       14.5 12.08→**10.50** · 13.5 11.25→**10.50** · 13 10.83→**10.50** · 12.5 10.42→**10.50**.
       여섯 자리 모두 **같은 밑글자의 `.imath` 값과 정확히 일치**한다. 12.5px 자리만 0.08px
       커지는데 그것은 상한 0.84 와 브라우저 기본 0.834 의 차이(0.7%)이고 위 주석이 이미 판정했다.
     ★ 겹침은 늘지 않는다 — 첨자가 **커진 자리가 없어** 줄 상자가 자랄 수 없다. 검사 727블록에서
       충돌 1건으로 전·후 같고, 그 1건은 ch04 문풀 틀 안의 ∫ 한계라 **이 변경 전부터 있던 것**이다.
     잠금: `test_script_size_has_a_pixel_floor` ⑻ — *자리 이름 없는 기본 규칙이 있는가*. */
  :root{--script-floor:10.5px; --script-cap:.84em;}
  sub, sup{font-size:min(max(.72em, var(--script-floor)), var(--script-cap));}
  h1,h2,h3,h4{text-wrap:balance; margin:0;}

  /* ★ 읽기 열의 폭은 한 곳에서 정한다 (W-40, 2026-07-30 사용자 결정).
     실측: 본문 `.theory-c` 는 640(한 줄 41자, 한글 가독성 권장 35~45자 안)인데
     표지·키워드칩·탭바는 892~900 이라 오른쪽 끝이 **252px 어긋나** 있었다.
     사용자 판단: *[발화 생략]*
     → 640 을 유지하고 **위쪽을 여기에 맞춘다.** 값을 변수로 둔 이유는 문풀 탭이
     이 폭에서 빠져야 하기 때문이다(아래 W-45). */
  /* 문풀 탭의 본문 폭도 같은 자리에서 정한다 (W-50, 2026-07-30). 문풀은 왼쪽 640(문제+삽화) +
     오른쪽 ~430(템플릿·빈칸) + 간격이라 읽기 열과 값이 다르다 — 그래서 별도 변수다.
     이 값을 바꾸면 그리드 트랙·`.shell` 상한·중앙 보정이 **함께** 따라온다. */
  :root{--read-w:640px; --practice-w:1100px;}
  /* ★ 넓은 화면에서는 총폭을 키운다 (2026-08-01, 사용자 요청).
     *[발화 생략]*

     **좌측 640px 은 못 건드린다** — 삽화가 610px 로 렌더돼야 실효 글자 규격
     (FIGURE_RENDER_WIDTH=612)이 성립한다. 그래서 총폭을 키우면 **늘어나는 것은 우측 열뿐**이고,
     그게 정확히 요청된 것이다(우측 378px 에서 `W_a = ½m(V₂²−V₁²) = …` 가 세 줄로 깨졌다).

     **왜 미디어 쿼리로 단계를 두나** — 총폭은 사이드바(측정 307px) 오른쪽 공간 안에 들어가야 한다.
     뷰포트 1920 실측: 사이드바가 390 에서 끝나고 shell 이 410~1510(1100px), 오른쪽 여백 410px.
     즉 쓸 수 있는 폭은 대략 `뷰포트 − 390` 이라, 1500 이하에서는 1100 도 빠듯하다
     (1500 → 여유 10px). 그래서 **넓은 쪽에서만** 올린다. */
  @media (min-width:1600px){ :root{--practice-w:1180px;} }
  @media (min-width:1800px){ :root{--practice-w:1360px;} }
  .app-layout{max-width:1120px; margin:0 auto; display:grid; grid-template-columns:minmax(0,900px) 190px; gap:28px; padding:0 24px;}
  .shell{grid-column:1; grid-row:1; min-width:0; padding:0 0 90px; max-width:var(--read-w);}
  .theory-toc,.deriv-toc{grid-column:2; grid-row:1; position:sticky; top:18px; align-self:start; max-height:calc(100vh - 36px); overflow:auto;}
  /* 스크롤 막대가 회색 통줄로 도드라져 「세로줄」로 읽힌다는 지적(2026-09-02) — 얇게 다듬어도
     여전히 두껍고, 애초에 모바일 UX는 스크롤 막대를 상시 노출하지 않는다는 재지적(같은 날) →
     아예 감춘다. 스크롤 자체(휠·터치·키보드)는 막지 않는다 — `overflow:auto` 는 그대로 둔다. */
  .course-pane,.theory-toc,.deriv-toc{scrollbar-width:none;}
  .course-pane::-webkit-scrollbar,.theory-toc::-webkit-scrollbar,.deriv-toc::-webkit-scrollbar{display:none;}
  .course-pane{position:fixed; z-index:40; top:0; bottom:0; left:0; width:min(300px,calc(100vw - 52px)); max-height:none; overflow:auto; padding:28px 18px; background:var(--paper-raised); border-right:1px solid var(--line); box-shadow:var(--shadow); transform:translateX(-105%); transition:transform .18s ease;}
  .course-pane.open{transform:translateX(0);}
  .course-pane.drawer-mode{transform:translateX(-105%);}
  .course-pane.drawer-mode.open{transform:translateX(0);}
  /* 사이드바 전체 접기 버튼은 2026-09-17 에 없앴다(사용자 *[발화 생략]*).
     접힘 상태 클래스·설정 키도 함께 걷었다 — 다시 펼 컨트롤이 없으면 저장된 접힘이 영구 고착된다.
     잠금 `test_sidebar_collapse_button_stays_removed`. */
  .theory-toc-title,.deriv-toc-title{font-size:var(--fs-micro); color:var(--sub); font-weight:700; letter-spacing:.08em; text-transform:uppercase; margin:0 0 8px;}
  .course-tree{display:flex; flex-direction:column;}
  .ct-subj{border-bottom:1px solid var(--line);}
  .ct-subj:last-child{border-bottom:0;}
  .ct-head{display:flex; align-items:center; gap:8px; padding:10px 6px; cursor:pointer; list-style:none; user-select:none;}
  .ct-head::-webkit-details-marker{display:none;}
  .ct-head:hover .ct-name{color:var(--copper);}
  /* 드로어 목차의 장 이름 — 본문 크기(15.5)라 **산세리프**다(위 19px 경계). 게다가 드로어는
     읽는 자리가 아니라 옮겨 다니는 컨트롤이라 두 규칙이 같은 답을 가리킨다. */
  .ct-name{flex:1; font-weight:700; font-size:var(--fs-body); color:var(--ink);}
  .ct-chev{flex:none; color:var(--sub); font-size:var(--fs-micro); transition:transform .18s ease;}
  .ct-subj[open] .ct-chev{transform:rotate(90deg);}
  .ct-chaps{display:flex; flex-direction:column; gap:2px; padding:2px 0 8px;}
  .chapter-link.disabled{opacity:.45; cursor:default; pointer-events:none;}
  .chapter-nav{display:flex; flex-direction:column; gap:4px;}
  .chapter-link{display:flex; align-items:flex-start; gap:8px; padding:8px; color:var(--sub); text-decoration:none; border-left:2px solid transparent; border-radius:0 6px 6px 0; font-size:var(--fs-small); line-height:1.45;}
  .chapter-link:hover{background:var(--paper-raised); color:var(--ink);}
  .chapter-link.current{color:var(--copper); background:var(--sel-soft); border-left-color:var(--copper); font-weight:700;}
  .chapter-no{font-family:ui-monospace,"SF Mono",Consolas,monospace; flex:none; color:var(--copper);}
  .chapter-title{min-width:0;}
  .chapter-status{display:inline-block; margin-top:3px; font-size:var(--fs-micro); color:var(--sub);}
  .chapter-link.reviewing .chapter-status{color:var(--s2);}
  .course-menu,.toc-trigger,.steam-table-link{font-family:inherit; border:1px solid var(--line-strong); background:var(--paper-raised); color:var(--ink); cursor:pointer; border-radius:6px; font-size:var(--fs-small); font-weight:700;}
  .course-menu{display:inline-flex; align-items:center; justify-content:center; min-height:36px; padding:6px 10px;}
  /* ★ 표지 밖으로 나간 뒤의 「챕터」 (2026-09-09, 사용자: *[발화 생략]*). 표지의 것은 스크롤하면 사라지는데 목차 버튼은 떠 있어
     **장을 옮기려면 맨 위까지 되돌아가야** 했다. 기본은 숨기고 `html.cover-out` 일 때만 뜬다 —
     표지가 보이는 동안 같은 버튼을 둘 띄우지 않으려는 것이다. */
  .course-menu.floating{display:none;}
  .cover-actions{display:flex; align-items:center; gap:8px;}
  .steam-table-link{display:inline-flex; align-items:center; justify-content:center; min-height:36px; padding:6px 10px; text-decoration:none;}
  .steam-table-link:hover{border-color:var(--copper); color:var(--copper);}
  .course-scrim{display:none; position:fixed; inset:0; z-index:35; background:rgba(0,0,0,.18);}
  .course-scrim.open{display:block;}
  .cover-topline{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .theory-toc,.deriv-toc{padding-top:112px; visibility:hidden; pointer-events:none;}
  html.theory-active .theory-toc{visibility:visible; pointer-events:auto;}
  html.derivation-active .deriv-toc{visibility:visible; pointer-events:auto;}
  .theory-toc-list,.deriv-toc-list{display:flex; flex-direction:column; gap:3px;}
  .theory-toc-link,.deriv-toc-link{border:0; border-left:2px solid transparent; border-radius:0 5px 5px 0; background:none; color:var(--sub); cursor:pointer; font-family:inherit; font-size:var(--fs-small); line-height:1.42; padding:6px 8px; text-align:left; width:100%;}
  .theory-toc-link:hover,.deriv-toc-link:hover{background:var(--paper-raised); color:var(--ink);}
  .theory-toc-link.current,.deriv-toc-link.current{border-left-color:var(--copper); color:var(--copper); background:var(--sel-soft); font-weight:700;}
  .theory-page-tools,.deriv-page-tools{display:none; justify-content:flex-end; margin-bottom:12px;}
  .toc-trigger{font-family:inherit; border:1px solid var(--line-strong); background:var(--paper-raised); color:var(--ink); cursor:pointer; border-radius:100px; font-size:var(--fs-small); font-weight:700;}
  .view-tools{margin-left:auto; display:flex; align-items:center; gap:4px;}
  /* ★ 열린 날 2026-07-26 — 여기는 `font:700 12px/1 inherit` 였다. `inherit` 같은 CSS 전역
     키워드는 **단축 속성의 한 조각으로 쓸 수 없어**(값 전체일 때만 유효) 브라우저가 이 선언을
     통째로 버렸다. `<button>`은 body 폰트를 상속하지 않으므로(UA가 시스템 UI 폰트를 지정)
     이 버튼들만 Pretendard 스택 밖으로 떨어져 나갔다 — 사용자가 폰트를 설치해도
     `초기화`·`너비맞춤`만 그대로 뭉개져 보인 원인이다. 개별 속성으로 편다. */
  .view-tool{min-width:32px; min-height:32px; padding:5px 8px; font-family:inherit; font-weight:700; font-size:var(--fs-small); line-height:1; color:var(--sub); background:var(--paper-raised); border:1px solid var(--line-strong); border-radius:6px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:5px;}
  .view-tool .ico{width:13px; height:13px; flex:none;}
  .view-tool:hover{border-color:var(--copper); color:var(--copper);}
  /* ★ 흐름 안에 놓인 이해도 체크 (2026-07-28 채택 · ch01 인박스 42번).
     절/카드 **끝**에 모아 두면 독자가 "다 읽었다" 상태로 도달해서, 바로 옆 '다음' 버튼을
     누르고 지나간다(사용자 실측: *[발화 생략]*).
     문장 중간에 있으면 그 심리가 약해진다 — 막지 않고 **위치만으로** 유도한다. */
  .cc-inline{margin:16px 0 20px; padding-left:12px; border-left:3px solid var(--copper);}
  .reading-content{zoom:var(--reader-scale, 1);}
  /* 너비맞춤·초기화 단추는 2026-09-13 에 뺐다(사용자: [발화 생략]) — 배율은 −·+ 만 남는다. */

  .cover{
    position:relative; z-index:0; /* 자체 스태킹 컨텍스트 — ::before(z:-1)가 반드시 글자 뒤로 가게 */
    padding:44px 4px 36px; border-bottom:1px solid var(--line);
  }
  /* 표지 격자무늬는 제거함 (2026-07-21 사용자 결정) — 태블릿 세로에서는 글자가 폭을
     거의 다 차지해 격자와 안 겹치는 영역이 없다. 마스크·워시로 피하려던 시도 2회 모두

  .eyebrow{font-size:var(--fs-micro); letter-spacing:.12em; text-transform:uppercase; color:var(--sub); font-weight:600;}

  .home-link{color:inherit; text-decoration:none; border-bottom:1px solid transparent;}
  .home-link:hover{color:var(--copper); border-bottom-color:var(--copper);}
  .course-home{display:inline-block; margin:0 0 10px; font-size:var(--fs-small); color:var(--sub); text-decoration:none;}
  .course-home:hover{color:var(--copper);}
  .cover-title-row{display:flex; align-items:baseline; gap:18px; margin-top:12px; flex-wrap:wrap;}
  .chnum{font-family:"Jeongri Serif","Nanum Myeongjo","Noto Serif KR",Georgia,serif; font-size:var(--fs-cover-num); line-height:1; color:var(--copper); font-weight:700; font-variant-numeric:tabular-nums;}
  .chtitle{font-family:"Jeongri Serif","Nanum Myeongjo","Noto Serif KR","Batang",Georgia,serif; font-size:var(--fs-cover-title); font-weight:700; color:var(--ink);}
  .cover-sub{margin-top:8px; color:var(--sub); font-size:var(--fs-body); max-width:68ch;}
  /* ★ align-items:center 를 지우지 말 것 (2026-08-02, 사용자 지적).
     기본값 stretch 라 **줄에서 가장 높은 칩(분수가 든 칩)의 높이로 나머지가 늘어나고**,
     늘어난 상자 안에서 글자는 위쪽에 붙는다 — `위치 s`·`변위 Δs` 가 `속도 v = ds/dt` 옆에서
     위로 뜬 것이 이것이다. 칩 자체를 inline-flex 로 바꾸는 방법은 쓰지 않았다:
     칩 안의 `속도 v = ` 텍스트와 `<span class="frac">` 이 각각 flex 항목이 되어
     사이 공백이 사라진다(같은 줄 수식이 붙어 버린다). 줄 정렬만 바꾸는 쪽이 안전하다. */
  .kw-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; align-items:center;}
  .kw{font-size:var(--fs-micro); padding:4px 10px; border-radius:100px; border:1px solid var(--line-strong); color:var(--sub); background:var(--paper-raised);}

  .tabbar{
    position:sticky; top:0; z-index:5; display:flex; gap:4px; padding:10px 0;
    background:var(--paper); border-bottom:1px solid var(--line); margin-bottom:28px; flex-wrap:wrap;
  }
  .tabbtn{
    font-family:inherit; font-size:var(--fs-small); padding:8px 12px; border-radius:8px; border:1px solid transparent;
    background:none; color:var(--sub); cursor:pointer; font-weight:600;

  .tabbtn:hover{color:var(--ink); background:var(--paper-raised);}
  .tabbtn.active{color:var(--copper); background:var(--sel-soft); border-color:var(--sel-line);}
  .review-tools{margin-left:auto; display:flex; align-items:center; gap:8px; font-size:var(--fs-micro); color:var(--sub);}
  .review-toggle.on{background:var(--sel-soft); color:var(--copper); border-color:var(--sel-line);}
  .review-summary{white-space:nowrap;}
  .review-nav{display:none; align-items:center; gap:4px; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .review-mode .review-nav{display:flex;}
  .review-nav-btn{width:26px; height:26px; padding:0; border:1px solid var(--line-strong); border-radius:6px; background:var(--paper-raised); color:var(--ink); cursor:pointer; font:inherit; font-weight:700;}
  .review-nav-btn:hover{border-color:var(--copper); color:var(--copper);}
  /* ★ 흐림은 **한 규칙**이 맡는다 (2026-08-13 에 `.is-home` 을 이 선택자에 붙였다).
     초기화 버튼은 `disabled` 속성을 쓰지 않는다 — 뷰어에서 그 속성을 대입하는 자리는
     **이동 버튼 둘뿐이고 둘 다 `= false`** 라는 것이 계약이기 때문이다
     (test_review_nav_reaches_a_single_change 의 전수 케이스가 그 계약을 잠근다).
     그래서 상태는 클래스로 말하고 **보이는 것은 같은 한 규칙**으로 그린다. */
  .review-nav-btn:disabled,.review-nav-home.is-home,.review-nav-home.is-home:hover{cursor:default; opacity:.38; border-color:var(--line-strong); color:var(--sub);}
  .review-nav-count{min-width:38px; text-align:center;}
  /* ★ 초기화 동글이 (2026-08-13). 지름·테두리·배경은 ◀▶ 와 **같은 .review-nav-btn** 을 그대로
     쓰고 여기서는 모양(원)과 아이콘 크기만 정한다 — 글자가 없으니 상자가 아니라 원으로 두어
     '이동'이 아닌 다른 종류의 조작임을 형태로 가른다(사용자 표현: [발화 생략]).
     .ico 의 크기 규칙은 .view-tool 안에만 있어서 이 자리에는 안 닿는다 → 여기서 따로 준다.
     ★ 13px 의 근거(브라우저 실측 2026-08-13): ◀ 글리프의 **잉크**는 11px 글자에서 8.58×9.79px 이고
       이 아이콘의 잉크는 호 지름 + 선굵기 = (14+2.8)/24 × 크기 ≈ 0.70×크기다. 13px → 9.1px 로
       삼각형의 가로·세로 사이에 든다. 속이 빈 고리는 같은 크기에서 solid 삼각형보다 가볍게
       보이므로 가로(8.58)가 아니라 그 위쪽에 맞춘 것이고, 마침 읽기 도구의 .view-tool .ico
       와도 같은 13px 이라 **두 초기화 아이콘이 같은 크기**로 남는다. 눈으로 조정하지 말 것. */
  .review-nav-home{border-radius:50%; display:inline-flex; align-items:center; justify-content:center;}
  .review-nav-home .ico{width:13px; height:13px; flex:none;}
  /* ★ 변경 규모 3단계 — 표시 채널 3차 개정 (2026-07-29). 앞선 두 번은 실패했다:
     ⑴ 색상(hue)만 달리 → 색상은 **명목** 채널이라 '다르다'는 말은 해도 '더 크다'를 못 한다.
     ⑵ 굵기 6/4/2px 추가 → 6과 4는 1.5배 차이인 데다, 하이라이트가 화면에 흩어져 있어
        **나란히 비교할 기회 자체가 없다.** 절대값을 기억해야 읽히는 신호는 안 읽힌다.
     ★ 3차의 핵심은 색이 아니라 **글자**다. 삽화에는 이미 `전면 수정/일부 수정/표기만`
     배지가 있었는데(.review-badge) 본문 하이라이트에만 없어서, 같은 등급 체계가 한쪽은
     텍스트로 한쪽은 암호로 표시되고 있었다 — 같은 말을 두 표기로 하고 있었던 것이 진짜 결함이다.
     본문에도 **같은 어휘**의 배지를 붙인다. 어휘를 바꾸려면 1229행 삽화 배지와 함께 바꿀 것.
     색은 보조로 남기되 서열 채널을 **채도**로 옮겼다(--rv-* 팔레트). 굵기 6/4/2는 유지한다. */
  .review-mode .review-mark{background:color-mix(in srgb, var(--rv-major) 13%, transparent);
    box-shadow:inset 6px 0 0 var(--rv-major); border-radius:4px;}
  .review-mode .rv-minor{background:color-mix(in srgb, var(--rv-minor) 22%, transparent);
    box-shadow:inset 4px 0 0 var(--rv-minor);}
  /* ★★ '표기만'(cosmetic) 등급과 그 접기 토글은 **없앴다** (2026-08-13, 사용자 판정).
     *[발화 생략]*
     → 볼 것이 아니면 **빌드가 아예 안 만든다**(buildlib/review.py 의 판정선이 정본).
     여기 CSS 로 감추던 층이 통째로 사라진 이유가 그것이다 — 되살리려면 그 주석부터 볼 것. */
  /* ★★ 문풀·연습문제의 하이라이트를 **컬렉션 이름으로 지우던 규칙은 뺐다** (2026-08-13, 실측).
     원래 뜻은 옳았다 — *[발화 생략]*.
     그런데 2026-08-07 에 **목록 쪽 판정만** `hiddenTabs`(그 장이 스스로 선언한 숨김)로 옮기고
     **CSS 는 옛 스위치(`review-hide-drill`)에 남겨 두어**, 문풀까지 검수를 마친 ch01·ch02 에서
     *목록에는 있는데 화면은 안 칠해진* 자리가 생겼다(실측 ch02 문풀 3 + 연습 10 = 13곳:
     `box-shadow:none`·배지 `display:none` 인데 ◀▶ 는 거기 선다).
     ★ 판정은 하나여야 한다 — **화면에 없는 탭은 애초에 열 수 없고**(탭 버튼을 내린다) 목록도
     그것으로 자른다. 그래서 이 CSS 층은 필요가 없고, 있으면 갈라지기만 한다. */
  /* 등급 배지. content 를 CSS 에 두는 이유: reviewClass() 는 **클래스 문자열만** 돌려주고
     그 호출부가 18곳이라, JS 로 넣으려면 전부를 고쳐야 하고 한 곳만 빠뜨려도 조용히 새어나간다.
     한 곳(여기)에서만 정의하면 새로 생기는 호출부도 자동으로 배지를 얻는다. */
  /* ★ 배지는 본문 열 **바깥 오른쪽**에 띄운다 (2026-07-29, 사용자 지적).
     *[발화 생략]*
     인라인(::before 기본)으로 두면 배지가 **문장 앞을 밀어** 첫 줄만 들여쓰기된 것처럼 보이고,
     블록마다 들여쓰기 양이 달라 본문이 들쭉날쭉해진다. PC는 본문 열 바깥에 여백이 남으므로
     거기로 빼면 본문 흐름을 전혀 건드리지 않는다. 페이지 맨 오른쪽(‘다음: 유도’ 줄)이 아니라
     **본문 폭 바로 바깥**이다 — 멀리 두면 어느 블록의 배지인지 짝이 안 보인다. */
  .review-mode .review-mark{position:relative;}
  .review-mode .review-mark::before{
    content:'전면 수정'; position:absolute; left:100%; top:0; margin-left:10px;
    padding:1px 6px; border-radius:4px; font-size:var(--fs-micro); font-weight:700; line-height:1.6;
    letter-spacing:.02em; white-space:nowrap; z-index:2; pointer-events:none;
    background:var(--rv-major); color:var(--rv-major-ink);}
  /* 좁은 화면에는 뺄 여백이 없다 — 인라인으로 되돌린다. 그대로 두면 배지가 뷰포트를 넘겨
     가로 스크롤이 생기는데, 그건 본문을 읽는 것 자체를 방해한다.
     기준선 860px 는 실측으로 정했다(2026-07-29 DOM): 본문 열은 **640px 고정**이고
     배지에 필요한 폭은 여백 10 + 배지 50 + 안전 8 = 68px 이라, 900px 뷰포트에서도
     176px 이 남았다. 처음 1180 으로 잡았더니 노트북 폭에서 전부 인라인으로 되돌아갔다 —
     **추측으로 정한 기준선이 기능을 통째로 끈** 경우다. 열 폭을 바꾸면 이 값도 다시 잰다. */
  @media (max-width:860px){
    .review-mode .review-mark::before{position:static; margin-left:0; margin-right:7px;
      display:inline-block; vertical-align:2px;}
  }
  /* ★★ **넘침을 자르는 상자에서는 배지를 안쪽 인라인으로** (2026-08-04, 사용자 지적:
     *[발화 생략]*).
     위 배지는 `left:100%` 로 상자 **밖**에 놓인다. 그런데 그 상자가 `overflow-x` 를 가지면
     절대 위치 자식이 **스크롤 가능한 넘침**으로 잡힌다 — 실측 `.fmath` 가 **70px** 넘쳤고
     그게 유도 카드에 늘 떠 있던 빈 스크롤바의 정체다(수식은 넘치지 않았다: 검수 모드를 끄면 0).
     반대 피해도 있었다 — `.soltpl` 은 `overflow-x:hidden` 이라 **배지가 통째로 잘려 안 보였다.**
     `overflow-x:hidden` 과 `overflow-y:visible` 은 CSS 상 공존할 수 없으므로(한쪽이 visible 이
     아니면 다른 쪽도 auto 가 된다) 자르면서 내보낼 방법이 없다 — 그래서 **자르는 상자에서만**
     좁은 화면(≤860px)에서 이미 쓰던 인라인 형태로 되돌린다. 잘리지도, 넘치지도 않는다. */
  .review-mode .fmath.review-mark::before,
  .review-mode .fmath-col.review-mark::before,
  .review-mode .steq.review-mark::before,
  .review-mode .soltpl.review-mark::before,
  .review-mode .tbl.review-mark::before{position:static; margin-left:0; margin-right:7px;
    display:inline-block; vertical-align:2px;}
  /* ★ 등급 선택자는 **반드시 .review-mark 와 함께** 쓴다. `.rv-minor::before` 처럼 쓰면
     삽화(.review-diagram.rv-minor — .review-mark 가 없다)에도 걸려서, 이미 있는
     .review-badge 위에 인라인 배지가 하나 더 붙는다. 게다가 그 자리에는 위 기본 규칙의
     배지 크기 규격(당시 10px · 지금 `--fs-micro`)이 안 걸려 본문 크기로 튀어나온다 — 2026-07-29 DOM 실측으로 잡았다.
     소스만 봐서는 안 보이는 부류라 회귀 케이스로 잠갔다. */
  .review-mode .review-mark.rv-minor::before{content:'일부 수정'; background:var(--rv-minor); color:var(--rv-minor-ink);}
  .review-mode .pcard.rv-minor,.review-mode .qcard.rv-minor{border-color:var(--rv-minor); box-shadow:inset 4px 0 0 var(--rv-minor);}
  .review-mode .review-diagram.rv-minor{border-color:var(--rv-minor);
    background:color-mix(in srgb, var(--rv-minor) 20%, transparent);
    box-shadow:0 0 0 5px color-mix(in srgb, var(--rv-minor) 45%, transparent), var(--shadow);}
  .review-mode .review-diagram.rv-minor .review-badge{background:var(--rv-minor); color:var(--rv-minor-ink);}
  .review-legend{display:none; gap:12px; align-items:center; flex-wrap:wrap; margin:0 0 14px; font-size:var(--fs-micro); color:var(--sub);}
  .review-mode .review-legend{display:flex;}
  .review-legend b{font-weight:700; color:var(--ink);}
  .rl-chip{display:inline-flex; align-items:center; gap:5px;}
  /* ★ 범례는 **화면에 실제로 뜨는 배지 그대로** 보여준다 (개정 2026-07-29).
     색 견본만 두면 범례가 '색'을 가르치는데, 정작 화면이 말하는 것은 '글자'라 서로 다른 것을
     설명하게 된다. 여기 문구는 배지 content(위 .review-mark::before 계열)와 **같아야 한다.** */
  .rl-dot{display:inline-block; padding:1px 6px; border-radius:4px; font-size:var(--fs-micro);
    font-weight:700; line-height:1.6; letter-spacing:.02em; white-space:nowrap;}
  .rl-major{background:var(--rv-major); color:var(--rv-major-ink);}
  .rl-minor{background:var(--rv-minor); color:var(--rv-minor-ink);}
  /* ★★ 하이라이트 막대가 글자를 덮지 않게 — **여백을 목록이 아니라 기본값으로** (2026-08-05, R-32).
     사용자 지적: *[발화 생략]* →
     *[발화 생략]*
     ★ 원인은 값이 아니라 **구조**다. 막대는 상자 **안쪽**에 그려지는데(box-shadow:inset 6/4/2px),
     그만큼의 왼쪽 여백을 갖는지는 **여기 있던 선택자 목록**이 관리했다. 목록은 13종인데
     reviewClass() 호출부는 18곳이라 목록 밖 셋이 여백 0 인 채 남았다 — 즉 **빠뜨려도 통과되는 구조**였다.
     DOM 실측(2026-08-05, 768px, 글자 왼쪽 여백):
       .q-ans-val 0px · .q-outline-wrap 0px · .pitfall-item 0px  ← 막대가 첫 글자를 덮는다
       .theory-c 8 · .prompt 8 · .cc-item 13 · .tbl 11 · .pcard 18 · .qcard 19  ← 안전
     → 목록을 **없애고** 여백을 `.review-mark` 전체의 기본값으로 준다. 새 호출부가 생겨도 자동으로 안전하다.
     예외는 **이미 자기 여백이 막대보다 넉넉한 것**만 `:not()` 으로 뺀다 — 빠뜨리면 여백이
     남는 쪽으로 틀리므로 글자를 덮지 않는다(안전한 쪽이 기본값).
     왼쪽 12px 를 쓰는 이유: 가장 굵은 막대(전면 수정 6px)를 빼고도 6px 이 남는다.
     옛 8px 는 전면 수정에서 2px 밖에 안 남아 *[발화 생략]* 라는 지적의 절반이 남아 있었다.
     .tbl 을 빼는 이유: `display:block; overflow-x:auto` 라 좌우 여백이 스크롤 폭에 더해진다
     — 글자 여백은 이미 11px(th 여백)로 안전한데 넣으면 없던 가로 스크롤이 생긴다.
     잠금: tools/test_checks.py::test_review_mark_clears_the_bar */
  .review-mode .review-mark:not(.pcard):not(.qcard):not(.cc-item):not(.tbl):not(.tlist){padding:4px 8px 4px 12px;}
  /* ★ 목록을 예외로 뺀 이유 (2026-08-06, 사용자: *[발화 생략]*).
     목록은 왼쪽 여백이 **마커 자리**인데 위 규칙이 `padding` 을 통째로 덮어써서 12px 로
     잘렸다 — 번호는 24.8 → 12px 라 본문이 왼쪽으로 13px 밀리고 숫자가 막대 위로 올라앉는다.
     **번호 목록에서 크게 드러났을 뿐 불릿도 17.8 → 12px 로 밀리던 같은 결함이다** —
     형태를 늘리며 만든 버그가 아니라 늘려서 보이게 된 버그다.
     처음엔 목록용 여백 규칙을 따로 두 줄 넣었는데 `test_review_bar_does_not_cover_text` 가
     막았다 — **여백 규칙이 둘 이상이면 그게 곧 '요소마다 한 줄' 목록의 부활**이라는 잠금이
     이미 있었다(옛 13종이 그렇게 쌓였고 새 호출부가 여백 0 으로 나갔다). 그 설계가 옳으므로
     규칙은 하나로 두고 `:not(.tlist)` 예외로 뺀다. 예외의 조건은 **자기 여백이 막대보다
     넓을 것** 이고, 그래서 아래 `.tlist` 의 여백을 em 이 아니라 px 로 적어 검사가 읽게 했다. */
  .review-mode .pcard.review-mark,.review-mode .qcard.review-mark{border-color:var(--rv-major); box-shadow:inset 6px 0 0 var(--rv-major);}
  /* 변경 사유 툴팁 — 하이라이트에 마우스를 대면 "왜 바꿨는지"가 뜬다 (사용자 요청 2026-07-28). */
  /* ★ 빈 사유는 툴팁을 띄우지 않는다 (2026-08-13) — 마크와 사유가 한 함수에서 나오게 하면서
     `data-change-note=""` 가 생길 수 있게 됐다. 걸러내지 않으면 빈 검은 상자가 뜬다. */
  .review-mode [data-change-note]:not([data-change-note=""]){position:relative;}
  /* ★★ **같은 항목 안에서 같은 사유는 한 번만 뜬다** (2026-08-13, 사용자: *[발화 생략]*).
     ★★ 처음에는 **툴팁만** 접고 칠은 남겼는데, 그 조합이 곧 *[발화 생략]* 였다(같은 지적 5회). 지금은 표시가 하나(`data-note-quiet`)이고 붙으면
       **칠·배지·툴팁이 함께** 꺼진다 — 불변조건은 **「보이는 마크에는 반드시 사유가 뜬다」**.
     ★ 판정은 `reviewFoldDuplicateNotes()` 가 하고 여기는 그 표시만 읽는다.
       판정을 CSS 와 JS 두 곳에 적으면 갈라진다(이 파일이 여러 번 겪은 부류). */
  .review-mode [data-change-note]:not([data-change-note=""]):not([data-note-quiet]):hover::after{content:attr(data-change-note); position:absolute;
    left:0; top:calc(100% + 6px); z-index:40; width:max-content; max-width:min(420px,88vw);
    white-space:pre-line; text-align:left; background:var(--ink); color:var(--paper);
    font-size:var(--fs-small); line-height:1.45; font-weight:400; padding:8px 11px; border-radius:8px;
    box-shadow:0 6px 18px rgba(0,0,0,.25); pointer-events:none;}
  /* ★ 2026-09-17 표(`.tbl`)는 가로 스크롤 상자(overflow-x:auto → y 도 auto)라, 그 안을 기준으로 뜬 툴팁이
     스크롤 높이를 늘려 마우스를 올리면 오른쪽 스크롤바가 생겼다(응용고체 ch11 인박스 S11-17 · DOM 실측
     scrollHeight 96→175). 표를 기준 상자에서 빼고 툴팁을 제자리(표 바로 아래)에 두면 스크롤 상자 밖에서
     그려진다. 표 내용은 자르지 않는다 — 좁은 화면의 가로 스크롤은 그대로다. */
  .review-mode .tbl.review-mark[data-change-note]{position:static;}
  .review-mode .tbl[data-change-note]:not([data-change-note=""]):not([data-note-quiet]):hover::after{top:auto; left:auto; margin-top:6px;}
  /* 삽화 테두리는 본문 하이라이트보다 두껍게 간다 — 사용자 지적 2026-07-29:
     *[발화 생략]* 삽화는 폭이 넓어
     같은 3px 링이라도 좌우 변에서는 면적 대비가 작아 사실상 안 보인다. */
  /* ★★★ **되돌림 — 삽화 변경 표시도 토글을 따른다** (2026-09-06, 사용자: *[발화 생략]*). 2026-08-19 결정([발화 생략])은
     "변경점 표시: 꺼짐" 인 채로 켜져 있는 이 배지를 사용자가 직접 보고서야 실제 의도와 다르다고
     정정했다 — 2026-08-29에 슬라이드 삽화 쪽을 *[발화 생략]* 로 이미 한 번
     뒤집었는데, 그 원칙이 일반 이론 삽화(`diagrams[]`)에는 안 옮겨져 있었다(규칙 7 위반 — 인스턴스만
     고치고 부류를 안 본 자리). 이제 `.review-mode` 안으로 들어가 본문·카드 하이라이트와 같은 토글을
     쓴다 — 삽화라고 다른 문을 갖지 않는다. */
  .review-mode .review-diagram{background:color-mix(in srgb, var(--rv-major) 11%, transparent); border-color:var(--rv-major); box-shadow:0 0 0 7px color-mix(in srgb, var(--rv-major) 40%, transparent), var(--shadow);}
  /* ★★★ **같은 사유가 3번 나온 뒤로는 표시 자체를 하지 않는다** (2026-08-13, 사용자:
     *[발화 생략]*) — ◀▶ 목록은 이미 앞 3개에서만 섰는데 **화면의 칠은 전부 남아 있어서**
     둘이 갈려 있었다. 같은 판정(`REVIEW_CLASS_STOPS`)을 화면도 쓰게 맞춘다.
     ★ 여기는 **표시만** 읽는다 — 판정은 `reviewFoldDuplicateNotes()` 한 곳에서 한다.
     ★ 속성을 지우지 않는 이유는 위 `data-note-folded` 와 같다: ◀▶ 가 그 사유를 계속 읽어야 한다. */
  /* ★ 2026-09-17 `padding:0` 은 위 기본 여백(4px 8px 4px 12px)을 걷어 내는 몫이라 그 규칙과 같은
     예외를 받는다(응용고체 ch11 인박스 S11-07·12). 예외 없이 두면 자기 여백을 가진 카드(.cc-item 9px 12px)가
     조용한 사유로 접히는 순간 여백 0 이 되어 글자가 테두리에 붙고 왼쪽으로 쏠렸다. */
  .review-mode .review-mark[data-note-quiet]{background:none; box-shadow:none;
    border-color:inherit;}
  .review-mode .review-mark[data-note-quiet]:not(.pcard):not(.qcard):not(.cc-item):not(.tbl):not(.tlist){padding:0;}
  .review-mode .review-mark[data-note-quiet]::before{content:none;}
  .review-mode .cc-item.review-mark[data-note-quiet]{border-color:var(--line);}
  .review-diagram[data-note-quiet]{background:none; border-color:var(--line);
    box-shadow:none;}
  .review-diagram[data-note-quiet] .review-badge{display:none;}
  .review-mode [data-change-note][data-note-quiet]:hover::after{content:none;}

  .page{display:none;}
  .page.active{display:block;}

  /* ★ 장 도입부 — **팔레트 밖에 남아 있던 자리** (2026-08-13, 사용자: *[발화 생략]*). 테두리 `#b5651d`(구리)·라벨 `#8a6a44`(갈색)·바탕 `#fbf9f6`(크림)이
     **하드코딩**이라 종이·강조색을 청록 계열로 옮길 때 이 카드만 옛 팔레트로 남았다.
     ★ 부류: **토큰을 안 쓰는 색은 팔레트 개편에서 조용히 빠진다.** 값을 직접 적는 순간
       그 자리는 «다음에 색을 바꿀 때 아무도 안 보는 곳»이 된다 — 삽화 색을 도구로 갈아끼우게
       만든 것과 같은 이유다. 여기도 토큰으로 옮긴다. */
  .ch-intro{margin:0 0 22px; padding:16px 18px; border:1px solid var(--line); border-left:4px solid var(--copper);
            border-radius:3px; background:var(--paper-raised);}
  .ch-intro-sum{margin:0 0 12px; line-height:1.75;}
  .ch-intro-row{display:flex; gap:12px; padding:5px 0; align-items:baseline;}
  .ch-intro-k{flex:0 0 118px; font-size:var(--fs-small); font-weight:700; color:var(--copper);}
  .ch-intro-v{flex:1; line-height:1.7;}
  @media (max-width:640px){ .ch-intro-row{flex-direction:column; gap:2px;} .ch-intro-k{flex:none;} }
  .lo-list{list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:12px;}
  .lo-item{display:flex; gap:14px; align-items:center; background:var(--paper-raised); border:1px solid var(--line); border-radius:10px; padding:16px 18px;}
  .lo-num{font-family:"Jeongri Serif","Nanum Myeongjo",Georgia,serif; font-size:var(--fs-head); color:var(--copper); font-weight:700; flex:none; width:28px;}
  .lo-text{font-size:var(--fs-body); padding-top:2px;}

  .recap-item{background:var(--paper-raised); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:12px;}
  .recap-q{font-size:var(--fs-body); font-weight:600; margin-bottom:10px;}
  .review-set-row{font-size:var(--fs-small); margin:4px 0; line-height:1.6;}
  .review-set-row b{display:inline-block; min-width:4.5em;}
  .recap-toggle{display:flex; gap:8px; flex-wrap:wrap;}
  .recap-btn{font-family:inherit; font-size:var(--fs-small); padding:6px 12px; border-radius:100px; border:1px solid var(--line-strong); background:var(--paper); color:var(--sub); cursor:pointer;}
  .recap-btn.picked-yes{background:var(--s1-soft); color:var(--s1); border-color:var(--s1);}
  .recap-btn.picked-no{background:var(--s3-soft); color:var(--s3); border-color:var(--s3);}

  .theory-item{padding:18px 0; border-top:1px solid var(--line); scroll-margin-top:108px;}
  .theory-item:first-child{border-top:none;}
  .theory-item:last-child{border-bottom:none;}
  .theory-h{font-weight:700; font-size:var(--fs-body); color:var(--blue); margin-bottom:8px;}
  .theory-h .ptag{display:inline-block; margin-left:8px; font-size:var(--fs-micro); color:var(--copper); background:var(--copper-soft); border-radius:5px; padding:2px 6px; font-weight:600;}
  .theory-c{width:100%; max-width:640px; color:var(--ink);}
  /* ★ 본문 폭 통일 (신설 2026-07-30). 사용자 지적:
     *[발화 생략]*
     DOM 실측: 이론 텍스트 640 = 삽화 640(일치) · 유도·문풀 798 vs 640 · 연습문제 806 vs 640.
     `.theory-c` 에만 640 상한이 있었고 카드 안 텍스트는 카드 폭에서 패딩만 뺀 값이었다.
     기존 검사는 **삽화끼리 같은가**만 봤지 텍스트와 맞는지는 아무도 안 봤다.
     ★ 왜 삽화를 넓히지 않고 텍스트를 좁히나: 삽화 폭은 화면 실효 글자 크기의 **분모**다
     (`FIGURE_RENDER_WIDTH`). 그걸 건드리면 전 챕터의 글자 크기가 한꺼번에 바뀌어
     방금 맞춘 본문 하한(15px)과 상한(19px)이 동시에 흔들린다. 640 은 이론에서 이미 쓰던 값이라
     새 숫자를 만들지도 않는다. */
  .prompt,.soltpl,.answers,.expected,.fmath,.fvars,.fsteps,.fnote,
  .q-ans-val,.q-outline,.givens{max-width:640px;}
  .theory-c p{margin:0 0 13px;}
  .theory-c p:last-child{margin-bottom:0;}
  /* ★ 딥링크 착지 여백 — 세 종류(.theory-item/.def-anchor/.diagram-box)를 같은 값으로 묶는다.
     2026-07-24: .def-anchor가 80px이라 착지 시 첫 줄이 헤더 아래로 잘렸다(사용자 지적).
     본문 line-height 실측 26.35px이므로 한 줄 여유를 더해 108px로 통일한다.
     값을 바꿀 때는 세 곳을 함께 — tools/test_checks.py::test_deep_link_scroll_margin이 감시한다. */
  .def-anchor{display:block; height:0; scroll-margin-top:108px;}
  .theory-c .diagram-box{margin:4px 0 28px; width:100%; max-width:640px; box-sizing:border-box;}
  .review-prereq{margin:0 0 22px; padding:14px 16px; border:1px solid var(--line); border-left:4px solid var(--copper); border-radius:10px; background:var(--copper-soft);}
  .review-prereq-h{font-size:var(--fs-small); font-weight:800; color:var(--ink); margin-bottom:8px;}
  .review-prereq-item{padding:8px 0; border-top:1px dashed var(--line-strong);}
  .review-prereq-item:first-of-type{border-top:0; padding-top:0;}
  .review-prereq-link{display:inline-flex; gap:7px; align-items:baseline; color:var(--blue); font-weight:700; text-decoration:none;}
  .review-prereq-link:hover{text-decoration:underline;}
  .review-prereq-en{font-size:var(--fs-small); font-weight:500; color:var(--sub);}
  .review-prereq .diagram-box{margin:10px 0 4px; background:var(--paper);}
  /* 인라인 복습은 강조 상자를 쓰지 않는다. copper 상자는 '여기부터 복습 구역'이라는
     표식이었고 그 표식은 헤딩('1장에서 먼저 복습')과 한 몸이었다. 복습을 문장별로 쪼개
     본문 사이에 끼우면서 헤딩이 빠졌고, 이유 없는 하이라이트만 남았다(2026-07-23 지적). */
  .review-prereq-inline{margin:12px 0 18px; padding:0; border:0; background:none;}
  .review-prereq-inline .review-prereq-item{padding:0; border-top:0;}

  /* 이론·유도 본문의 불릿 목록 ("- 항목: 설명" 블록) — 문단보다 촘촘하게, 걸어 들여쓰기 */
  /* 여백을 em 이 아니라 **px** 로 적는다 — 이 값이 검수 하이라이트 막대를 덮고도 남는지를
     `test_review_bar_does_not_cover_text` ⑷ 가 읽어야 하기 때문이다(em 이면 못 읽는다).
     18px 은 종전 1.15em(=17.8px)과 같은 자리다. */
  .tlist{margin:10px 0 14px; padding-left:18px; list-style:none;}
  .tlist li{position:relative; margin:5px 0; line-height:1.72;}
  .tlist li::before{content:"·"; position:absolute; left:-0.95em; color:var(--copper); font-weight:700;}
  /* 번호 목록 — 순서가 뜻을 갖는 절차용(신설 2026-08-06). 불릿은 순서를 선언하지 않는다.
     `.tlist` 를 그대로 쓰되 가짜 불릿(::before ·)을 끄고 숫자를 살린다. */
  ol.tlist{list-style:decimal; padding-left:25px;}
  ol.tlist li::before{content:none;}
  ol.tlist li::marker{color:var(--copper); font-weight:700;}
  /* ★ 삽화 박스 폭은 **한 값이어야 한다** (2026-07-28, 사용자 지적).
     SVG는 `width:100%`로 이 폭에 맞춰 스케일되므로 화면 글자 크기 = font-size x (이 폭 / viewBox폭) 이다.
     즉 이 값이 자리마다 다르면 **같은 삽화가 자리에 따라 다른 크기로 보이고, 크기 규격 자체가
     계산 불가능해진다.** 예전에는 기본 680 / 이론·문풀 640 / 연습문제 460으로 셋이 갈려 있었다.
     `checks_svg.FIGURE_RENDER_WIDTH`가 이 값(패딩 제외)과 짝이며 `test_figure_box_width_is_uniform`이 잠근다. */
  .diagram-box{position:relative; margin-top:14px; background:var(--paper-raised); border:1px solid var(--line); border-radius:3px; padding:14px; max-width:640px; scroll-margin-top:108px;}
  /* 세로 여백을 줄일 근거가 있는 도판만 선언으로 고른다. SVG를 억지로 잘라 내거나
     전역 매트를 줄이면, 빽빽한 그림과 여백이 필요한 그림이 함께 망가진다. */
  .diagram-box.diagram-compact{padding-top:7px; padding-bottom:7px;}
  /* ★★ **다크에서 도판은 밝은 카드로 남는다 — 가리지 않고 가장자리를 준다** (판정 2026-08-13).
     삽화는 라이트 팔레트로 그려져 있고 **색마다 뜻이 배정돼 있다**(유체=온도 · 부품=역할 ·
     강조=미지수). 그래서 다크에서 반전·필터로 덮으면 **뜻이 깨진다** — 팔레트를 따로 만드는
     것은 삽화 4천 곳을 토큰화한 뒤의 일이다.
     ★ 지금 나쁜 것은 밝은 것 자체가 아니라 **반쯤 만든 다크모드**다. 페이지·카드·글자는 다
       어두운데 도판만 밝으면 «안 만든 것»으로 읽힌다. 14px 매트(`.diagram-box` 안쪽 여백)와
       **1px 가장자리**를 주면 «그렇게 만든 것»으로 읽힌다 — 기술 문서의 밝은 도판 카드는 관례다.
     ★ 라이트에서 `--fig-edge` 는 투명이다. 거기서는 도판 배경(#f7f4ec)과 종이(#f6f3ec)가
       거의 같아 가장자리를 그으면 없던 상자가 생긴다. */
  .diagram-box svg{display:block; width:100%; height:auto; border-radius:2px;
    box-shadow:0 0 0 1px var(--fig-edge);
    /* ★★ **도판 글자는 산세리프로 못 박는다** (2026-08-13). 본문이 세리프로 바뀌어도
       삽화는 따라가면 안 된다 — `checks_svg.run_width` 가 **이 글꼴 스택의 폭**을 전제해
       글자 겹침·라벨 여백·분수 조판을 판정한다. 상속시키면 그 자들이 통째로 어긋난다.
       ★ 시각적으로도 이쪽이 맞다: **세리프 본문 + 산세리프 도판 라벨**은 교재·저널의
       표준 조합이라 «따로 노는 것»이 아니라 «구별한 것»으로 읽힌다. */
    font-family:"Jeongri Sans","Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
  /* ★ 삽화 종류 딱지 (2026-08-02 개편, 사용자: *[발화 생략]*).
     옛 스타일은 **라틴 eyebrow 라벨을 한글에 그대로 씌운 것**이었다 —
     `text-transform:uppercase` 는 한글에 대문자가 없어 **아무 효과 없는 죽은 규칙**이었고,
     `letter-spacing:.06em` 은 라틴 소문자용 관용구라 **한글에서는 낱말 덩어리가 풀려** 흩어져 보인다.
     거기에 10.5px·700·주황이 겹쳐 *작은데 튀는* 글자가 됐다.
     → 자간을 없애고, 크기를 올려 읽히게 하고, 색을 낮춰 **그림보다 뒤에 세운다.** */
  .diagram-kind{font-size:var(--fs-micro); color:var(--sub); font-weight:700; margin-bottom:8px;}
  .diagram-box .filled-answer-slot{fill:var(--answer); font-weight:700;}
  /* ★ 조건 텍스트 가림 — **임시 비교용** (2026-07-30). 경위는 revealBar() 주석이 정본이다.
     visibility 를 쓰는 이유: display:none 이면 글자가 차지하던 자리가 사라져 **도형이 움찔한다.**
     자리는 그대로 두고 보이지만 않게 해야 '도형은 그대로, 텍스트만 감춤'이 된다. */
  /* W-35: 안내 문구는 왼쪽, 버튼은 오른쪽 끝. 삽화를 왼→오로 읽고 마지막에 누르는 동선이다. */
  .fig-reveal-bar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:space-between; margin-top:10px; font-size:var(--fs-small); color:var(--sub);}
  .fig-reveal-btn{font-family:inherit; font-size:var(--fs-small); font-weight:700; padding:6px 13px; border-radius:100px;
    border:1px solid var(--line-strong); background:var(--paper); color:var(--sub); cursor:pointer; min-height:32px;}
  /* ★ 삽화 동작 (2026-09-08 — 정본 `docs/2026-09-07-삽화-동작-사양.md`).
     **쉬는 상태가 마지막 프레임이다.** 저자는 SVG 를 «다 끝난 그림»으로 그리고, 재생은
     거기서 되감아 한 번 돌아 제자리로 온다. 사양은 처음에 «첫 프레임을 쉬는 상태로» 라고
     적었는데 그러면 `prefers-reduced-motion` 독자가 **미완성 그림**을 본다 — 그 한 줄만
     뒤집었다(사양 문서에 정정으로 적어 둔다).
     그래서 이 미디어 쿼리는 그림을 안 건드리고 **막대만 감춘다.** */
  .motion-bar{display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    justify-content:space-between; margin-top:10px; font-size:var(--fs-small); color:var(--sub);}
  .motion-caption{flex:1 1 auto;}
  .motion-play{font-family:inherit; font-size:var(--fs-small); font-weight:700; padding:6px 13px;
    border-radius:100px; border:1px solid var(--line-strong); background:var(--paper);
    color:var(--sub); cursor:pointer; min-height:32px;}
  @media (prefers-reduced-motion: reduce){ .motion-bar{display:none;} }
  /* 짚어 보기 — 유도 슬라이드(`.fslide-bar`)와 같은 꼴: 삽화 → 그 단계가 맡은 본문 → 한 줄 막대(설명 | 이전·다음).
     두 버튼은 한 덩어리라 줄이 바뀌지 않는다(2026-09-14 사용자 [발화 생략]).
     동작이 아니라 이동이라 `.motion-bar` 를 안 쓴다 — 그 클래스는 움직임 줄이기 설정에서 통째로 숨는다. */
  .spot-body{margin-top:12px; text-align:left;}
  .spot-bar{display:flex; gap:10px; align-items:center; margin-top:10px; font-size:var(--fs-small); color:var(--sub);}
  .spot-caption{flex:1 1 0; min-width:0;}
  .spot-nav{display:flex; gap:6px; flex:none; white-space:nowrap;}
  .spot-btn:disabled{opacity:.38; cursor:default;}
  .diagram-box[data-reveal-mode] svg [data-reveal]{visibility:hidden;}
  .diagram-box[data-reveal-mode] svg [data-reveal].shown{visibility:visible;}
  /* ★★ '주어진 조건값' 표시 = **옅은 배경 칩** (사용자 판정 2026-08-01, 인박스 R-14).
     사용자: *[발화 생략]*

     예전에는 `font-weight='700'` 이 그 표시였다. 결함이 둘이다 —
     ⑴ **신호와 의미가 어긋난다.** 굵기는 보통 *중요하다*는 뜻인데 여기서는 *주어진 값이다*라는
        **분류**였다. 그래서 정작 구해야 할 값(`= ?`)이 안 굵어 **위계가 뒤집혀 보인다.**
     ⑵ **신호가 둘이라 손으로 맞춰야 했다.** `data-reveal`(가림 대상)과 굵기를 각각 붙이는데,
        실측 48건 중 **20건이 어긋나** 있었다(인박스는 '예외 1건'으로 봤으나 전수를 세니 20건).
     → 칩은 `data-reveal` **하나**에서 나온다. 두 신호가 갈릴 수가 없다.

     ★ 1차 구현(stroke 워시)은 **반려됐다** — 사용자: *[발화 생략]*
       글자 윤곽을 두껍게 두르는 방식이라 **글자 사이마다 파여 구름 같은 울퉁불퉁한 테두리**가 됐다.
       칩은 *칸*이지 *후광*이 아니다. 좌표를 데이터에 못 박는 사정(글자 폭 추정 불가)은 그대로이므로
       **런타임에 `getBBox()` 로 실제 글자 상자를 재서 뒤에 둥근 사각형을 깐다**(아래 paintGivenChips).
       인라인 halo(`stroke='#f7f4ec'`)는 칩 위에서 흰 테두리로 보이므로 여기서 끈다 —
       선과의 분리는 이제 칩이 맡는다. */
  .diagram-box svg text[data-reveal]{stroke:none;}
  .diagram-box svg rect.given-chip{fill:#e9dfc7;}

  .theory-item.out-of-range > :not(.theory-h){display:none;}

  /* ★ 가로 스크롤은 **넘칠 때만** 생긴다 (2026-08-04, 사용자 지적: *[발화 생략]*). `overflow-x:auto` 를 늘 걸어 두면, 스크롤바를 항상 보이게
     설정한 환경에서는 **넘치지 않는 상자에도 빈 막대가 그려진다.** DOM 실측으로
     `scrollWidth == clientWidth`(586) 임을 확인했으니 그 카드에 스크롤할 것은 없다.
     ★ 그래서 기본을 `hidden` 으로 두고, **읽는 사람의 브라우저에서 재서**(`syncXScroll`)
     실제로 넘칠 때만 `.has-xscroll` 을 붙인다 — 글꼴·확대율이 달라 여기서는 안 넘치고
     저기서는 넘치는 경우에도 각자 맞게 동작한다(내 화면 기준으로 자르면 그쪽에서 잘린다).
     `.soltpl` 이 이미 `hidden` 이라 문풀에는 이 증상이 없었다 — 유도 카드만 남아 있었다. */
  .fmath{margin:14px 0; padding:16px; background:var(--blue-soft); border-radius:8px; font-size:var(--fs-head); color:var(--blue); overflow-x:hidden; overflow-y:hidden;}
  /* ★ 긴 식은 **등호 앞에서만** 접는다 (2026-08-12 지적: *[발화 생략]*).
     **어디서 접을지를 고르는 CSS 속성은 없다** — 자리 선택은 JS(`breakBeforeEquals`)가 하고
     여기서는 이어지는 줄이 `= …` 로 시작해 **보이게** 행걸이 들여쓰기만 준다.
     ★★ **당김과 보정을 한 요소에 둔다** (정정 2026-08-13, 브라우저 실측으로 열림).
       옛 형태는 `.fmath{text-indent:-1.15em; padding-left:calc(16px + 1.15em)}` 였다 —
       당김은 `.fmath-line` 이 **상속으로** 받고 보정하는 padding 은 `.fmath` 에만 있는 구조라,
       **바깥 padding 이 다른 값으로 덮이는 순간 첫 줄이 상자 밖으로 나간다.**
       검수 모드가 정확히 그랬다 — 하이라이트 여백 규칙(아래 「막대를 덮지 않는 여백」)이
       padding-left 를 37.85 → **12px** 로 덮어, 첫 줄이 상자 왼쪽 **9.9px 밖**에서 시작하고
       `overflow-x:hidden` 이 그대로 잘랐다(사용자 화면: `…et,in Ẇ net,in = …`).
       ★ **같은 부류를 같은 날 두 번 겪었다** — `.fmath-col` 도 상속된 당김을 바깥 padding 이
         못 따라와 잘렸다(바로 아래 주석). 그때는 그 자리에서 `text-indent:0` 으로 껐는데,
         그건 **증상이 난 자리를 하나씩 막는 처방**이라 다음 자리가 또 난다. 원인은
         *보정이 다른 요소에 있다* 는 구조 자체이므로, 여기서 그 구조를 없앤다.
       → 줄 블록이 자기 padding 으로 자기 당김을 보정한다. 바깥 padding 이 무엇이든 무관하다. */
  .fmath-line{padding-left:1.15em; text-indent:-1.15em;}
  /* ★★ **상속을 여기서 끊는다** — 이게 사용자가 본 두 증상의 **한 원인**이다 (2026-08-13 실측).
     `text-indent` 는 상속되어 **자식이 만드는 line box 마다 다시** 걸린다. 그래서 `\dot` 을
     그리는 `.dot`(inline-block) 안에서 글자가 1.15em 왼쪽으로 밀렸고, 게다가 shrink-to-fit
     폭이 `글자폭 − 1.15em` 으로 **음수가 되어 0px 로 잘렸다.** 결과가 둘이다 —
       ⑴ 줄 첫 글자가 상자 밖으로 나가 `overflow-x:hidden` 에 **잘린다**
          (실측 `Ẇ_{net,in}` 헤드라인: Q 글리프 left **41.2** vs 상자 left **51**)
       ⑵ `.dot` 폭이 0 이라 뒤따르는 첨자가 그 자리에서 시작해 **글자·닷과 겹친다**
          (실측 가로 간격 **-1.7px**). 닷은 0 폭 상자의 가운데(left:50%)에 찍히므로 자기 글자에서
          21.85px 오른쪽, 곧 첨자 위에 얹혔다.
     ★ 자식을 이름으로 나열하지 않는다 — 새 인라인블록이 생기면 또 새는 부류다(`.dot` 하나만
       막았으면 `.frac`·`.sqrt` 에서 다시 났을 것이다). `text-indent` 는 **블록 컨테이너의 첫
       줄에만** 작용하므로, 자손 전체를 0 으로 끊어도 `.fmath-line` 자신의 행걸이는 그대로다. */
  .fmath-line *{text-indent:0;}
  /* 두 열 격자에는 행걸이가 애초에 해당이 없다(아래 .fmath-col 주석). */
  .fmath-line.fmath-cols{padding-left:0; text-indent:0;}
  /* ★ 두 축을 함께 선언한다 — `overflow-x` 만 바꾸면 `overflow-y:visible` 이 `auto` 로 계산돼
     **세로 막대가 딸려 온다**(위 `.steq` 주석이 정본. 2026-08-07 재발의 원인이 정확히 이것이다). */
  /* ★★ **홑클래스로 두면 캐스케이드 순서에 진다**(2026-09-05, 사용자: *[발화 생략]*). `.fmath-col`·`.steq` 가 이 규칙보다 **뒤에** 같은 단일-클래스 특이성으로
     `overflow-x:hidden` 을 다시 선언해서, 그 두 자리에 `.has-xscroll` 이 붙어도 소스 순서상
     나중 규칙이 이겨 넘치는 식이 스크롤 대신 **그대로 잘렸다**(`f-07-exergy-balance` 스텝4
     체인식 실사고). 순서에 기대지 않도록 대상마다 겹쳐 써 특이성을 올린다(0,0,2,0). */
  .has-xscroll{overflow-x:auto; overflow-y:hidden;}
  .fmath.has-xscroll,.fmath-col.has-xscroll,.steq.has-xscroll{overflow-x:auto; overflow-y:hidden;}
  /* 비율 0.68 의 근거와 하한·상한(`--script-floor`·`--script-cap`)의 근거는 위 첨자 규격 주석
     (`sub, sup`)이 정본이다. **여기는 자리 이름이 붙은 두 예외 중 하나다** — 밑글자가 19px 라
     기본 0.72 를 주면 화면에서 가장 큰 첨자가 된다. 하한은 지금 무동작이지만(19px → 12.92px)
     한쪽만 걸면 새는 자리가 된다. */
  .fmath sub, .fmath sup{font-size:min(max(.68em, var(--script-floor)), var(--script-cap));}
  .fvars{margin:12px 0; font-size:var(--fs-small); color:var(--sub);}
  .fvars div{padding:3px 0;}
  .fvars b{color:var(--ink); font-weight:600;}
  /* ★ 스키마 확장 2026-07-26 — 식은 세로로 세운다(사용자: [발화 생략]).
     .fmath-line : latex 배열의 각 줄 · .sttext/.steq : 한 단계의 설명과 독립 식 줄 */
  .fmath-line + .fmath-line{margin-top:8px;}
  /* ★ 등호 정렬 (2026-09-09). 세 열 격자에 **줄을 `display:contents` 로 풀어** 넣는다 —
     그래야 여러 줄의 좌변·등호·우변이 같은 열에 서고 등호가 세로로 맞는다.
     줄 간격은 `margin-top` 이 아니라 `row-gap` 이 맡는다(줄 상자가 사라지므로).
     `.fmath-line` 의 행걸이 들여쓰기(`text-indent:-1.15em`)도 함께 무효가 되는데,
     그건 **한 줄짜리 긴 식이 접힐 때** 쓰던 것이라 여기서는 할 일이 없다. */
  /* ★ `ℓ` 만 내린다 — 값의 유래는 `renderMath` 안 그 치환 자리의 주석이 정본이다.

  .ell{position:relative; top:.184em;}
  .fmath-lines.aligned{display:grid; grid-template-columns:max-content max-content max-content; justify-content:center; row-gap:8px;}
  .fmath-lines.aligned .fmath-line{display:contents;}
  .fmath-lines.aligned .eq-lhs{justify-self:end; text-align:right;}
  .fmath-lines.aligned .eq-rel{padding:0 .35em;}
  .fmath-lines.aligned .eq-rhs{justify-self:start; text-align:left;}
  /* ★ 병렬 열 2026-07-28 — 같은 논리의 두 갈래(x쪽/y쪽)를 위아래로 쌓으면 '순서'로 읽혀
     한쪽만 쓰는 것처럼 보인다. 나란히 두고 점선으로 갈라야 '둘 중 하나를 고른다'가 보인다.

  .fmath-cols{display:grid; grid-template-columns:1fr 1fr; gap:0; align-items:start;}
  /* ★★ 행걸이 들여쓰기를 **두 열 격자에는 물려주지 않는다** (2026-08-13, DOM 실측으로 열림).

     접힐 때* 둘째 줄을 들여쓰라고 넣은 것인데, **`text-indent` 는 상속돼 `.fmath-col` 마다

     제 상자 왼쪽으로 삐져나가 `overflow-x:hidden` 에 잘렸다 — 실측(1400px): 왼쪽 열 **-21.8px

     잠금: `test_checks.py::test_review_change_is_binary` 의 `.fmath-col` 항목. */
  .fmath-col{min-width:0; overflow-x:hidden; padding:0 0 0 16px; text-indent:0;}
  .fmath-col:first-child{padding:0 16px 0 0;}
  .fmath-col + .fmath-col{border-left:1px dashed var(--line-strong);}

    .fmath-col + .fmath-col{border-left:0; border-top:1px dashed var(--line-strong);

  }
  .sttext{margin-bottom:2px;}

     점(li::before)은 top:12px 고정이라 따라오지 않는다. 실측 — 단락 1개면 .sttext top 5px,
     2개면 19px. 사용자 지적: [발화 생략].
     단락 사이 간격은 유지하고 **바깥쪽 마진만** 없앤다. */
  .sttext > p{margin:0 0 8px;}
  .sttext > p:last-child{margin-bottom:0;}
  /* ★★ **세로 스크롤바가 생기던 자리** (열린 날 2026-08-07, 사용자: *[발화 생략]*) — **재발이다.**

     세로 여백을 2px → 7px 로 올려 큰 기호(∫ 한계·분수)가 상자 안에 들어오게 했다.
     자르기만 켜고 여백을 안 올리면 증상만 감추고 글자를 잃는다. */
  .steq{margin:6px 0 6px 2px; padding:7px 0 7px 12px; border-left:2px solid var(--line-strong);
        font-size:var(--fs-body); color:var(--blue); overflow-x:hidden; overflow-y:hidden;}
  /* ★ 체인식(연속 등호) 정렬 (신설 2026-09-05, 사용자: [발화 생략] — f-07-exergy-balance 처럼 등호로 이어지는 여러 줄에서 다음 줄도 맨 왼쪽부터
     시작해 "다음 줄"인지 안 보였다). `.steq-chain` 은 두 칸 grid — 좌변(우측정렬) · 등호부터
     (좌측정렬) — 라 좌변이 없는 줄(연속 등호, 빈 칸)도 같은 열에 놓여 등호가 자동으로 세로로
     맞는다. 실제 식은 첫 '=' 에서만 쪼갠다(그 뒤 '=' 는 우변에 그대로 남는다).

     overflow-x/y 를 바로 선언해도 된다(`.steq-chain.has-xscroll` 는 아래서 별도 선언).
     ★★ 실측으로 결함 둘을 더 찾았다(2026-09-05 재확인, "위아래로 뽈록"·"옆으로 샌다" 두

     ⑵ 컨테이너에 `overflow-x` 선언이 아예 없어 긴 체인(`f-07-exergy-balance` 스텝 4 실측:
       필요 폭 678px vs 상자 556px)이 옆으로 122px 새면서도 `.has-xscroll` 후보에도 안 들어
       가로 스크롤이 아예 안 걸렸다 — 아래에서 `.steq-chain` 도 `.steq` 와 같은 후보로 만든다. */
  /* ★ 우변은 넘치면 스크롤 대신 **줄바꿈** 한다 (2026-09-06, 사용자: 넓은 PC 화면에서도
     `f-07-exergy-balance` 스텝4(678px 필요)가 가로 스크롤바로 뜨고 글자가 잘려 보였다 —
     "결함"으로 재지적). 2026-09-05 판은 «자르기보다 스크롤이 낫다»로 닫았었는데, 그건
     ★ **좌변 열을 `max-content`로 굳혀 두면 우변 열도 덩달아 못 줄어드는 것**을 놓친
     결정이었다 — `minmax(0,1fr)`로 우변 열만 컨테이너 폭까지 줄어들게 하면 `white-space:normal`
     이 실제로 줄바꿈을 받아준다(전에는 `max-content`가 폭을 무한정 늘려 wrap이 무의미했다).

  /* ★ 좌변이 분수 분자처럼 위로 떠 보이던 결함 (2026-09-06, 사용자: [발화 생략]). 실측(첫 텍스트 노드 기준): 좌변 글자 top이
     우변보다 8.6px 높았다 — 두 셀의 바깥 상자(top·height)는 완전히 같은데 **안쪽 글자
     기준선이 달랐다.** 원인은 우변에만 있는 `.intop .bigop`(적분 기호, font-size 1.35em)
     이다 — 그 확대된 인라인 요소 때문에 우변 줄의 줄상자가 커지고, 브라우저가 그 여유를
     대개 글자 **위쪽**에 얹어 우변 텍스트를 아래로 밀어낸다. 좌변엔 그런 요소가 없어 밀리지
     않으니, 겉보기엔 좌변이 위로 뜬 것처럼 보인다. `align-items:baseline`을 주면 그리드가
     한 행 안의 두 칸을 **첫 줄 글자 기준선**으로 맞춰, 우변 줄상자가 커져도 좌변 글자가
     그 기준선을 따라 함께 내려간다. */
  .steq-chain{display:grid; grid-template-columns:max-content minmax(0,1fr); column-gap:.4em;
              align-items:baseline;
              margin:6px 0 6px 2px; padding:0 0 0 12px; border-left:2px solid var(--line-strong);
              overflow-x:hidden; overflow-y:hidden;}
  .steq-chain.has-xscroll{overflow-x:auto; overflow-y:hidden;}

  .steq-chain .steq-lhs{text-align:right; white-space:nowrap;}
  .steq-chain .steq-rhs{text-align:left; white-space:normal; overflow-wrap:anywhere;}
  .steq-chain .steq-full{grid-column:1 / -1; text-align:left;}

     *[발화 생략]*).

  .badge.diff-intermediate{background:var(--s2-soft); color:var(--s2); border-color:var(--s2);}
  /* ★ 「예제」 탭에서는 단계·난이도 뱃지를 안 보인다 (2026-09-18, 사용자: *[발화 생략]*).
     ⑴ 난이도 — 예제 탭은 `difficulty: basic` 만 모으므로 **모든 카드가 「기초」다.** 값이 하나뿐인
        칸은 정보가 0 이고 자리만 먹는다. 연습·문제 탭에는 셋이 섞이므로 거기서는 남긴다.
     ⑵ 단계 — 빈칸 하나인지 풀이 전체인지는 **카드 모양이 이미 보여 준다.** 「1·2·3단계」는 문항을
        설계할 때 쓰는 분류이지 푸는 사람이 읽을 것이 아니다.
     탭 단위로 가른다 — `html.practice-active` 는 예제·연습이 함께 쓰므로 못 쓴다(같은 마크업 재사용). */
  #exampleCard .pcard-top .badge{display:none;}
  .badge.diff-advanced{background:var(--s3-soft); color:var(--s3); border-color:var(--s3);}
  /* 조회표 밖의 값이 와도 배지가 무스타일 영문으로 나가지 않게 하는 폴백 (2026-07-26). */
  .badge.diff-unknown{background:var(--paper-raised); color:var(--sub); border-color:var(--line-strong);}
  .badge.ox-kind{background:var(--paper-raised); color:var(--sub); border:1px solid var(--line-strong);}
  .prompt{font-size:var(--fs-body); margin-bottom:14px;}
  /* ★ 상자를 내용 폭에 맞춘다 (사용자 2026-07-30).
     *[발화 생략]*
     블록 기본값이라 본문 열 전체를 채우고 있었다. '이미 주어진 값 몇 개'라는 작은 묶음인데
     폭이 본문과 같으면 본문의 한 문단처럼 보여 **주어진 것과 풀 것의 구분이 흐려진다.**
     fit-content 로 줄이되 좁은 화면에서 넘치지 않게 max-width 를 건다. */
  .subresults{margin:0 0 14px; padding:12px 14px; background:var(--blue-soft); border-radius:8px; font-size:var(--fs-small);
    width:fit-content; max-width:100%;}
  .subresults .sr-h{font-size:var(--fs-micro); text-transform:uppercase; letter-spacing:.06em; color:var(--sub); margin-bottom:6px;}
  /* ★ W-44 (2026-07-30). 예전에는 `justify-content:space-between` 이라 라벨은 왼쪽 끝,
     값은 **오른쪽 끝**에 붙었다. 라벨 길이가 줄마다 달라 값의 시작 x 가 흔들렸고
     (실측: 한 줄은 618, 다른 줄은 다른 위치) 두 줄이 한 표로 안 읽혔다.
     사용자: *[발화 생략]*.
     → **그리드로 바꾼다.** 그리드는 열이 행끼리 정렬되므로 ⑴ 기호(P_atm·P_gage)가 세로로 맞고
     ⑵ 값의 시작점이 같아지며 ⑶ 뒤 설명은 자연스럽게 흐른다 — 요구 세 가지가 한 번에 풀린다.
     `symbol` 이 없는 항목은 2열로 병합해 예전과 같게 보인다(스키마 전환 중 안전장치). */
  .subresults{display:grid; grid-template-columns:auto max-content 1fr; column-gap:12px; row-gap:2px; align-items:baseline;}
  .subresults .sr-h{grid-column:1 / -1;}
  .subresults div.sr-row{display:contents;}
  .subresults .sr-label{grid-column:1;}
  .subresults .sr-sym{grid-column:2; color:var(--blue); white-space:nowrap;}
  .subresults .sr-row:not(:has(.sr-sym)) .sr-label{grid-column:1 / 3;}
  .subresults .sr-val{grid-column:3; color:var(--blue); font-variant-numeric:tabular-nums;}
  /* ★ 두 축을 함께 선언한다 — `.fmath`·`.steq`와 같은 결함(2026-09-05, 사용자: [발화 생략]). overflow-x만 hidden이면 overflow-y가 미선언 상태에서
     auto로 계산돼(CSS 스펙) 세로로 몇 px만 넘쳐도 막대가 뜬다. 위 두 곳의 주석(831·916행)이 정본. */
  .soltpl{background:var(--code-bg); border-radius:8px; padding:16px 18px; font-size:var(--fs-body); line-height:2; color:var(--ink); white-space:pre-wrap; overflow-x:hidden; overflow-y:hidden; overflow-wrap:anywhere;}
  /* ★ 「구할 것」·「조건」·「➜」 각 단락 사이 여백 (2026-09-06, 사용자: [발화 생략]). `<br><br>` 로 빈 줄을 넣으면 `line-height:2`가 그대로 두 번 겹쳐
     한 줄 전체(~2배)만큼 벌어져 사용자가 크다고 한 그 폭이 된다 — 그래서 빈 줄이 아니라
     0.6em짜리 블록 하나를 끼운다. renderMath 가 `조건:`·`➜` 줄 앞에만 이 마커를 붙인다
     (구할 것 다음 줄부터이므로 첫 줄 앞에는 안 붙는다). */
  .soltpl-gap{display:block; margin-top:.6em;}

  /* ★ W-45 (2026-07-30, 사용자 결정). 가로 화면에서 문풀 카드를 2열로 편다.
     사용자: *[발화 생략]* — 그 판정이
     `orientation: landscape` 다. **JS 도 기기 API 도 필요 없다** — 뷰포트의 가로>세로를
     그대로 읽고, 태블릿을 돌리면 브라우저가 알아서 다시 평가한다.

     ★ 방향만으로는 부족하다: 가로모드 휴대폰(844×390)도 landscape 지만 2열을 넣을 폭이 없다.
     그래서 `min-width` 를 함께 건다. 실측 근거 — 왼쪽(문제+삽화 640) + 오른쪽(템플릿·빈칸 ~400)
     + 간격 ≈ 1100.

     실측(2026-07-30): 1920×1080 에서 `ch01-p07` 카드가 **1465px** 라 화면(1080)을 385px 넘겼다.
     가로는 1920 중 640만 쓰면서 세로가 모자란 상태 — 전형적인 2열 후보였다. */
  @media (orientation:landscape) and (min-width:1180px){
    /* ★ `.shell` 의 max-width 만 올리면 소용없다 — 바깥 그리드 트랙이 `minmax(0,900px)` 라
       거기서 잘린다(2026-07-30 실측: shell 의 계산된 max-width 는 1100 인데 실제 폭은 900,
       오른쪽 열이 178px 로 찌그러졌다). **상한은 가장 바깥에서 걸린다** — 트랙도 같이 연다. */

    /* ★★ W-50 개정 (2026-07-30) — **그리드를 풀지 않는다.**
       옛 규칙은 `display:block` 으로 그리드를 통째로 풀었다. 그러면 **레일이 자기 열을 잃는다** —
       1920 실측: 좌측 과목 레일 `.course-pane` 이 전폭(1180px)짜리 블록이 되고 `position:sticky`
       라 스크롤을 따라오며 **본문(x=403) 위에 얹혔다**(사용자 스크린샷의 그 겹침).
       우측 소주제 레일도 열을 잃어 본문 아래 1180px 짜리 빈 칸(y=1411)으로 남았다.

       옛 주석이 걱정한 '트랙을 재정의하면 무너진다'의 진짜 원인은 트랙 재정의가 아니라,
       `visibility:hidden` 인 소주제 레일이 `grid-column:3` 을 계속 요구해 **암시적 3번째 트랙**이
       생기던 것이다. 문풀 탭에는 그 레일이 필요 없으므로 `display:none` 으로 빼면 재발하지 않는다
       (`visibility:hidden` 을 쓰던 이유 = 탭 전환 때 열 폭이 안 흔들리게 — 문풀은 어차피
        본문 트랙 자체가 넓어지므로 그 이유가 성립하지 않는다).
       → 결론: **트랙을 없애는 대신 본문 트랙만 넓힌다.** 레일은 끝까지 자기 열에 있는다. */
    html.practice-active .theory-toc,
    html.practice-active .deriv-toc{display:none;}
    /* 문풀도 **같은 중심**에 둔다 — 탭을 옮길 때 열이 좌우로 튀지 않고 가운데에서 넓어지기만 한다. */
    html.practice-active .app-layout{
      grid-template-columns:minmax(0,var(--practice-w));
      max-width:calc(var(--practice-w) + 48px); margin-left:auto; margin-right:auto;
    }
    html.practice-active .shell{max-width:var(--practice-w); margin:0 auto;}
    html.practice-active .pcard{
      display:grid; grid-template-columns:minmax(0,640px) minmax(0,1fr); column-gap:28px; align-items:start;
    }
    html.practice-active .pcard .diagram-box{margin-bottom:0;}
    /* ★ 우측 열은 378px 뿐이라 3열(라벨|기호|값)이 들어가지 않는다.
       사용자 지적(2026-07-30): *[발화 생략]*.
       실측(ch01 문풀, 뷰포트 1440): 문제 7의 값 열이 **105px** 로 눌려
       `13,600 × 9.81 × 0.30 ≈ 40.0 kPa` 가 3줄로 깨졌고, 그 탓에 우측 열 높이가
       **1047px 로 좌측(645px)의 1.6배**가 됐다. 다른 7문제는 277~659px 로 멀쩡했다.
       ★ 좌우 비율은 못 바꾼다 — 좌측 640px 은 삽화가 **610px 로 렌더돼야**
       실효 글자 규격(FIGURE_RENDER_WIDTH=612)이 성립하기 때문이다. 좁히면 전 삽화가 L6에 걸린다.
       → 그래서 비율이 아니라 **우측 표를 2단으로 접는다.** 라벨이 자기 줄을 쓰고
       기호와 값이 다음 줄을 나눠 가지면 값 열이 105 → 300px 대가 된다. */
    html.practice-active .pcard-work .subresults{grid-template-columns:max-content minmax(0,1fr);}
    html.practice-active .pcard-work .subresults .sr-label,
    html.practice-active .pcard-work .subresults .sr-row:not(:has(.sr-sym)) .sr-label{grid-column:1 / -1;}
    html.practice-active .pcard-work .subresults .sr-sym{grid-column:1; padding-left:10px;}
    html.practice-active .pcard-work .subresults .sr-val{grid-column:2;}
    html.practice-active .pcard-work .subresults .sr-row + .sr-row .sr-label{margin-top:7px;}
    /* 같은 이유로 풀이 템플릿도 좁은 열에서는 줄간격을 줄인다 — 실측 문제 7에서
       이 블록 하나가 438px(우측 열 1018px 의 43%)였다. line-height 2 는 넓은 1열용 값이다.
       1.8 밑으로는 내리지 않는다 — 빈칸 버튼(밑줄)이 윗줄 글자에 붙는다. */
    html.practice-active .pcard-work .soltpl{line-height:1.8;}
    /* ★ 연습문제 탭도 같은 2열로 (2026-08-01, 사용자 요청).
       *[발화 생략]*

       실측(ch01 19문제, 뷰포트 1920, details 전부 펼친 상태):
       삽화 힌트 평균 **396px** · 정답 평균 **266px** 이고 **15건 전부 삽화 쪽이 높다**(우측이 긴 경우 0건).
       문풀 7번에서 문제가 됐던 '우측이 좌측보다 훨씬 김'의 **반대 방향**이고 편차도 130px 로 작다 —
       그래서 문풀 X-1 을 A안(현 구조 유지)으로 닫은 판단과 모순되지 않는다. 그건 우측이 길어
       좌측 하단이 비는 경우였고 여기는 그 반대다.
       카드 총높이 평균 ~900px → ~400px 로 줄어 19문제 세로 스크롤이 절반 이하가 된다.

       ★ `:has()` 로 **삽화가 있는 카드만** 2열로 만든다. 삽화 없는 문항(ch01 Q18)까지 2열이면
       정답이 좁은 우측 열에 갇힌 채 왼쪽이 통째로 비는 — 고치려던 것과 똑같은 그림이 된다.
       ★ 좌측 640px 은 문풀과 같은 이유로 고정이다(삽화가 610px 로 렌더돼야 FIGURE_RENDER_WIDTH=612
       실효 글자 규격이 성립한다). 좁히면 전 챕터 삽화가 L6 에 걸린다. */
    html.problems-active .theory-toc,
    html.problems-active .deriv-toc{display:none;}
    html.problems-active .app-layout{
      grid-template-columns:minmax(0,var(--practice-w));
      max-width:calc(var(--practice-w) + 48px); margin-left:auto; margin-right:auto;
    }
    html.problems-active .shell{max-width:var(--practice-w); margin:0 auto;}
    html.problems-active .qcard:has(> .q-fig-hint, > .diagram-box){
      display:grid; grid-template-columns:minmax(0,640px) minmax(0,1fr); column-gap:28px; align-items:start;
    }
    html.problems-active .qcard > .q-meta,
    html.problems-active .qcard > .prompt,
    html.problems-active .qcard > .selfmark{grid-column:1 / -1;}
    html.problems-active .qcard > .q-fig-hint,
    html.problems-active .qcard > .diagram-box{grid-column:1; margin-bottom:0;}
    html.problems-active .qcard > .q-answer{grid-column:2;}
  }
  .blankbtn{display:inline-block; border:none; border-bottom:2px dashed var(--copper); background:transparent; color:var(--copper); font-weight:700; padding:0 4px; cursor:pointer; font-size:.95em; font-family:inherit;}
  .blankbtn:hover{background:var(--copper-soft);}
  .blankbtn.filled{color:var(--answer); border-bottom-color:var(--answer); border-bottom-style:solid; max-width:100%; white-space:normal; overflow-wrap:anywhere; word-break:break-word; text-align:left; vertical-align:baseline;}
  /* ★ 빈칸 답 박스를 화면에서 뺀다 (2026-09-06, 사용자: [발화 생략]). `___` 버튼을
     누르면 `syncInlineBlank`가 이미 빈칸 자리에 답을 인라인으로 채운다 — 그 아래 이 박스는
     같은 답을 헤딩+설명까지 붙여 다시 보여주는 중복이었다. DOM/토글 배선(`.answers details`의
     open 상태로 최종 답 잠금을 푸는 `syncExpected`, `figureSlot` 채우기)은 그대로 두고
     **보이지 않게만** 한다 — 지우면 그 배선까지 다 다시 짜야 한다.*/
  .answers{display:none;}
  .answers details{border:1px solid var(--line); border-radius:7px; padding:9px 12px; background:var(--paper);}
  .answers details[open]{border-color:var(--copper);}
  .answers summary{cursor:pointer; font-size:var(--fs-small); font-weight:700; color:var(--sub); list-style:none; display:flex; gap:8px; align-items:center;}
  .answers summary::-webkit-details-marker{display:none;}
  .answers summary .tick{color:var(--copper);}
  .ans-body{margin-top:8px; font-size:var(--fs-small);}
  .ans-answer{font-weight:700; color:var(--ink); margin-bottom:4px;}
  .ans-expl{color:var(--sub);}
  .expected{margin-top:16px; font-size:var(--fs-small); padding-top:10px; border-top:1px dashed var(--line); display:flex; justify-content:space-between; gap:10px; color:var(--sub);}
  .expected b{color:var(--ink);}
  .expected-lock{margin-top:16px; font-size:var(--fs-small); color:var(--sub); padding-top:10px; border-top:1px dashed var(--line);}

  .tipslist{padding-left:20px; font-size:var(--fs-body);}
  .tipslist li{margin-bottom:10px;}

  .qcard{background:var(--paper-raised); border:1px solid var(--line); border-radius:3px; padding:20px 22px; margin-bottom:14px; scroll-margin-top:108px;}
  .q-meta{display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:10px;}
  /* ★ 소문제 (a)(b)(c) 표시 (2026-08-01). 답이 한 줄로 이어져 지저분하던 것을 줄로 가른다.
     라벨을 색·굵기로 세워 **어디가 어느 소문제의 답인지**가 훑어보기만 해도 잡히게 한다. */
  .ans-part{margin-bottom:5px;}
  .ans-part:last-child{margin-bottom:0;}
  .ans-key{font-weight:700; color:var(--copper); margin-right:6px;}
  .sub-head{font-weight:700; color:var(--copper); margin:11px 0 3px; font-size:var(--fs-small);}
  .q-outline-wrap > .q-outline:first-child{margin-top:8px;}
  .q-answer{margin-top:12px; border:1px solid var(--line); border-radius:8px; padding:10px 14px; background:var(--paper);}
  .q-answer[open]{border-color:var(--copper);}
  .q-answer summary{cursor:pointer; font-size:var(--fs-small); font-weight:700; color:var(--sub); list-style:none;}
  .q-answer summary::-webkit-details-marker{display:none;}
  .q-fig-hint{margin-top:12px; border:1px solid var(--line); border-radius:8px; padding:0 14px; background:var(--paper);}
  .q-fig-hint[open]{border-color:var(--blue);}
  .q-fig-hint summary{min-height:44px; display:flex; align-items:center; cursor:pointer; font-size:var(--fs-small); font-weight:700; color:var(--sub); list-style:none;}
  .q-fig-hint summary::-webkit-details-marker{display:none;}
  /* ★ 삽화 박스 폭은 자리와 무관하게 같다 (2026-07-28).
     예전에는 연습문제만 460px이라, 같은 viewBox·font-size인 삽화가 이론(640px)보다
     글자가 1.5배 작게 렌더됐다 — 사용자 지적 [발화 생략]의 실체가 이것이다.
     실효 크기 = font-size x (박스폭 / viewBox폭) 이므로 박스폭이 갈리면 규격 자체가 성립하지 않는다. */
  /* 삽화는 컨테이너(`.q-fig-hint` details, padding-left 14px)의 안쪽 여백과 무관하게
     **본문 열 시작점에 맞춘다.** DOM 실측 2026-07-30: 본문 87 vs 삽화 102 로 15px 어긋나 있었다
     — 폭이 같아도 시작점이 다르면 어긋나 보인다(사용자 지적). */
  .q-fig-hint .diagram-box{margin:0 0 14px -14px; max-width:640px;}
  .q-ans-val{font-weight:700; margin:10px 0 6px;}
  .q-outline{margin:0; padding-left:18px; font-size:var(--fs-small);}
  .q-outline-prose{margin:6px 0;}
  .q-outline-prose > summary{cursor:pointer; font-size:var(--fs-small); color:var(--sub); font-weight:600;}
  .q-outline-prose[open] > summary{margin-bottom:4px;}
  .q-outline li{margin:4px 0;}
  .q-src{margin-top:8px; font-size:var(--fs-micro); color:var(--sub);}
  .qcard > .diagram-box{margin:0 0 14px; max-width:640px;}
  /* 한국어는 어절 단위로 끊는다. keep-all 없이 overflow-wrap:anywhere만 있으면
     '돌면'이 '돌' / '면'으로 갈라진다(2026-07-22 지적, 3회째). 긴 토큰은 여전히 끊긴다. */
  body{word-break:keep-all;}
  .fsrc{margin-top:6px; font-size:var(--fs-micro); color:var(--sub);}
  /* 본문 파이프 표. 좁은 화면에서는 표만 가로로 스크롤한다(페이지는 안 밀린다). */
  .tbl{width:100%; border-collapse:collapse; margin:12px 0; font-size:var(--fs-small); display:block; overflow-x:auto;}
  /* ★★ 칸의 세로 정렬은 **글자 밑선**이다 (2026-08-27 지적: *[발화 생략]*).
     열린 자리: 과목 요약의 대조표에서 왼쪽 칸이 `v = ds/dt`(쌓은 분수), 오른쪽 칸이 한 줄
     글이었다. `vertical-align:top` 은 **상자 위끝**을 맞추는데, 분수가 든 줄상자는 보통 줄의
     2.3배라 그 안의 밑선이 훨씬 아래로 밀린다 — 실측: 그 행 45px, 옆 행 30~35px. 그래서
     한 줄짜리 옆 칸이 **위쪽에 붕 뜨고** 두 칸의 `=` 가 서로 안 맞는다.
     `baseline` 은 두 칸의 **첫 줄상자 밑선**을 맞춘다 — 분수가 있든 없든 `=` 가 한 줄에 선다.
     ★ 부류다. 새로 넣은 요약 식 표 열두 자리가 전부 「분수 든 칸 + 한 줄 칸」을 섞어 쓴다. */
  .tbl th,.tbl td{border:1px solid var(--line); padding:7px 10px; text-align:left; vertical-align:baseline;}
  .tbl th{background:var(--paper-raised); font-weight:700; white-space:nowrap;}
  .recap-links{margin-top:10px; font-size:var(--fs-small); color:var(--sub); display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
  .recap-status{display:flex; gap:16px; align-items:center; margin-bottom:14px; font-size:var(--fs-small); color:var(--sub); flex-wrap:wrap;}
  .recap-status b{color:var(--ink); font-variant-numeric:tabular-nums;}
  .recap-done{background:var(--s1-soft); border:1px solid var(--s1); border-radius:10px; padding:14px 18px; font-size:var(--fs-small); color:var(--ink); margin-bottom:16px; line-height:1.7;}
  .recap-actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:10px;}
  .recap-actions .navbtn{display:inline-flex; align-items:center; justify-content:center; text-decoration:none;}
  .recap-link{font-family:inherit; font-size:var(--fs-small); padding:4px 10px; border-radius:100px; border:1px solid var(--line-strong); background:var(--paper); color:var(--blue); cursor:pointer;}
  .recap-link:hover{border-color:var(--blue);}

  /* \vec — 결합문자 대신 글자 위에 화살표를 얹는다 (Windows 폰트 호환) */
  /* ★ 화살표도 **글자 기준**이다 — `.dot` 과 똑같은 구조라 같은 처방을 미리 넣는다 (2026-08-02).
     `top` 이 inline-block 상자 위 모서리 기준인데 그 상자 높이는 둘러싼 `line-height` 를
     따라가므로, `line-height` 가 다른 자리(근호 안 등)에 들어가면 화살표가 글자에 붙는다.
     `.dot` 이 정확히 그렇게 터졌다(사용자 지적). 아직 데이터에 `\vec` 이 0건이라 증상이
     드러나지 않았을 뿐이므로, 쓰기 시작하는 순간 같은 결함이 난다 — 먼저 막는다. */
  .vec{display:inline-block; position:relative; line-height:1;}
  .vec::before{content:"→"; position:absolute; top:-0.62em; left:0; right:0; text-align:center; font-size:.58em; line-height:1;}
  /* \mathbf — 벡터. 교재가 굵기로 벡터/스칼라를 가르므로 같은 장치를 쓴다(위 renderMath 주석이 정본).
     글자 **위쪽을 쓰지 않는 것**이 이 표기를 고른 이유다 — `\dot`·`\ddot` 과 겹치지 않는다. */
  .vecb{font-weight:700;}
  /* ★★ `\mathsf{…}` — **엑서지 E·e** (2026-09-08). Moran 은 같은 로마자를 글자꼴로 가른다:
     에너지는 세리프 이탤릭 `E`, 엑서지는 **업라이트 산세리프** `E`(교재 p.312 식 7.1 렌더 확인).
     ★ 그 대비를 그대로 못 옮긴다 — **우리 수식은 이미 등폭 업라이트**라 「업라이트」가 표시가
       안 된다. 그래서 옮기는 것은 «기울기»가 아니라 **«글자꼴이 다르다»** 라는 사실이고,
       등폭 옆에서 그것을 내는 것은 **산세리프 + 굵기**다. 색을 쓰지 않는 이유는 이 자료에서
       색이 이미 「대조(`\hl`)」를 맡고 있어서다 — 한 시각 요소는 한 뜻만 맡는다.
     ★ 굵기 700 은 `.vecb`(벡터)와 같은 값이지만 **글꼴 갈래가 달라** 둘이 안 겹친다. */
  .sansup{font-family:"Jeongri Sans","Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
          font-weight:700; font-style:normal;}
  /* ★ `\overline{…}` — 몰 기준 상태량의 윗줄. 결합문자 대신 밑줄의 반대편을 쓴다(renderMath 주석).
     `text-decoration-thickness` 를 못 박는 이유는 기본값이 글꼴마다 달라 `\dot` 의 점보다
     굵어지는 자리가 생기기 때문이다 — 한 식 안에서 두 표시가 굵기로 경쟁하면 안 된다. */
  .ovl{text-decoration:overline; text-decoration-thickness:.06em; text-underline-offset:0;}
  /* `.dbar` 는 **없앴다 (2026-09-08)** — 노름은 이제 진짜 글리프 `‖`(U+2016)로 그린다
     (renderMath 주석이 정본). ASCII 이중 파이프의 자간을 좁히는 우회였고, 사용자가 두 번
     물렸다: *[발화 생략]*(09-06) → *[발화 생략]*(09-07). 우회를 남겨 두면 다음 사람이 그것을 규격으로 읽으므로 지운다. */
  /* ★ `\hl{…}` — 짝지어 놓인 두 식에서 **여기가 다르다**를 짚는 색. 뜻은 하나(대조)이고
     물리량이 아니다. 색은 이 자료가 강조에 쓰는 주황을 그대로 쓴다(새 색을 만들지 않는다). */
  .mathhl{color:#b5602c;}
  /* \dot — 결합문자 대신 글자 위에 점을 얹는다 (Windows 폰트 호환) */
  /* ★ 점(dot)은 **글자 기준**이어야 한다 — 상자 기준이면 문맥마다 달라진다 (2026-08-02).
     사용자: *[발화 생략]* — 맞았다.
     `.dot-mark` 의 `top` 은 `.dot`(inline-block) **상자 위 모서리** 기준인데, 그 상자 높이는
     둘러싼 `line-height` 를 따라간다. DOM 실측: 본문 **25.10px** vs 근호 안 **19.38px**
     (`.sqrt{line-height:1}` 때문 — 2026-08-01 에 근호가 내려앉는 것을 고치며 넣은 값이다).
     상자 위에서 점까지는 양쪽 다 0.29px 로 같은데 **상자가 5.7px 낮으니 글자에 그만큼 붙는다.**
     → `.dot` 에 `line-height:1` 을 박아 상자를 **글자 em 상자에 고정**하고, `top` 을 음수로
     돌려 글리프 기준으로 잰다. 이러면 어느 문맥에서도 같은 자리에 찍힌다.
     `-0.29em` 은 본문의 현재 모습(사용자가 옳다고 본 쪽)을 그대로 재현한 값이다:
     본문 half-leading (25.10-15.5)/2 = 4.80px, 거기서 0.30px 내려온 4.50px = 0.29em.
     상자가 **작아지는** 방향이라 근호 높이를 다시 부풀리지 않는다(2026-08-01 회귀 유지).
     잠금: `test_dot_mark_is_glyph_relative`. */
  .dot{display:inline-block; position:relative; line-height:1;}
  /* ★ 크기에는 **하한**이 있다 — 비율(.18em)만 두면 바닥이 없다 (2026-08-14).
     사용자: *[발화 생략]* — 맞았다. DOM 실측(ch05, 닷 140개):
       12.35px 3개(닷 2.22) · **13.00px 65개(2.34)** · 14.72px 3개(2.65) ·
       **15.50px 62개(2.79)** · 19.00px 7개(3.42)
     본문 15.5 와 체크·작은 글씨 13 이 **거의 반반이고 같은 화면에 나란히 뜬다.**
     지름이 19% 차이나는 데다 2.34px 는 서브픽셀이라 **안티에일리어싱으로 흐려지고**
     2.79px 는 또렷하다 — 같은 규칙인데 다르게 보이는 정체가 이것이다.
     `2.79px` 는 **사용자가 옳다고 본 본문 자리의 실측값**이다(15.5 × .18). 첨자 하한을
     `본문 × 비율` 로 정한 것과 같은 방식이다. 위치(`top`)는 그대로 em 비례로 둔다 —
     어긋나 보이는 것은 크기이지 높이가 아니었다.
     잠금: `test_dot_mark_has_a_floor`. */
  /* ★★ 크기 — **비례를 유지하고 하한을 올린다** (2026-08-16, 사용자 판정 *[발화 생략]*).
     옛 하한 `2.79px` 는 본문(15.5 × .18)이라 **본문·첨자 2.79 vs 유도 카드 3.42** 로 갈렸고,
     그 1.23배가 *[발화 생략]* 의 정체다. 하한을 **유도 카드 값 3.42px
     (19 × .18)** 로 올리면 본문·첨자·유도가 한 크기가 되고 그보다 큰 자리에서만 비례로 커진다.
     ★ 고정 크기로 안 바꾼 이유: 큰 수식에서 점만 작아 보인다 — 비례가 조판의 정석이다. */
  /* ★★★ **하한을 걷었다 — 비율 하나로 간다** (2026-08-23, 사용자 판정: *[발화 생략]* → 네 크기를 나란히 그린 비교본을 보고 판정).
     ★ **위 두 조항이 틀렸던 것이 아니라 목표가 뒤집혔다.** 하한은 «어디서나 같은 지름» 을
       만들었는데, 실측해 보니 그 하한이 **모든 자리에서 이겨** 사실상 고정값이었고
       (11.5~19px 어디서나 3.41px) 그래서 **글자 대비 비율이 0.179~0.296em 으로 1.65배** 갈렸다.
       *[발화 생략]* 의 정체가 그것이다 — 고친 것이 새 증상을 만든 자리라 그대로 적어 둔다.
     ★ **유도 카드는 안 바뀐다** — 옛 하한이 그 자리의 비율값(19 × .18 = 3.42px)이라 같다.
       사용자가 *[발화 생략]* 라고 한 그 줄이고, 비율로 가도 그 값이 그대로 나온다.
     ★ 남는 것: 11.5px 자리가 2.07px 로 내려간다. 2배 화면에서는 물리 4.1픽셀이라 또렷하고
       1배 화면에서는 2픽셀이다 — **흐리다는 지적이 오면 하한을 되살리지 말고 그 자리의
       글자 크기를 올릴 것**(첨자 하한을 그렇게 닫았다: 「비율만 두면 바닥이 없다」의 처방은
       *점을 키우는 것이 아니라 밑글자를 키우는 것*이었다). */
  .dot-mark{position:absolute; width:.18em; height:.18em; top:-.29em; left:50%; transform:translateX(-50%); border-radius:50%; background:currentColor;}
  /* ★★ 높이 — **밑글자의 잉크 높이**를 따라간다 (2026-08-16, 사용자 지적).
     *[발화 생략]* — 맞다. `top` 은 `.dot` 의 **em 상자** 기준이라
     상자에서 점까지는 늘 같은데, `r` 은 잉크가 x-높이에서 끝나고 `θ`·대문자는 어센더까지
     올라와 **눈에 보이는 간격이 그만큼 줄어든다.** 삽화 규격은 이 문제를 이미 인정해
     밑글자별로 **두 값**을 쓴다(소문자 0.676em · 대문자 0.873em — AGENTS 「시간율의 점」).
     **뷰어만 한 값이라 규격보다 뒤처져 있었다.**
     `-.487em` = `-.29em − 0.197em` 이고 그 **0.197** 은 삽화 두 값의 차다 — 새로 정한 수가
     아니라 **이미 사용자가 수용한 값**에서 왔다(실행 규율 16: 수치에는 근거를 붙인다).
     ★ 판정선은 **대소문자가 아니라 잉크 높이**다 — `θ` 는 소문자인데 어센더가 있다.
     ★ 분모 안에서는 아래 `.frac-den:has(.dot)` 가 이긴다 — 거기는 분수선이 상한이라 별도 판정이다. */
  .dot-mark.dot-tall{top:-.487em;}
  /* \ddot — 2계 도함수. 동역학 극좌표(r̈·θ̈)에 대체 표기가 없다(2026-08-01).
     ★★ **두 점 사이를 지름만큼 벌린다** (2026-08-23, 사용자: *[발화 생략]* ·
       *[발화 생략]*). 옛 값(−130%/30%)은 **사이 여백이 지름의 0.6배**라
       (실측 19px: 지름 3.41 · 여백 2.04) 두 점이 하나의 굵은 덩어리로 읽혔다 — 특히 점이
       작아진 뒤에 그렇다. **여백을 지름의 1.0배**로 두면(−150%/50%) 두 점으로 갈린다.
     ★ 값의 근거: 라틴 diaeresis 의 통상 여백이 점 지름의 0.8~1.0배다. 1.0 을 고른 이유는
       **점이 여기서 가장 작아지는 자리(11.5px, 지름 2.07)에서도 여백이 2px 이상 남아야**
       두 점으로 보이기 때문이다(그보다 좁으면 안티에일리어싱이 사이를 메운다).
     ★ 총 폭은 지름의 3배(0.54em)라 기울어진 글자의 advance(0.5~0.6em)와 비슷하다 — 절대 위치라
       레이아웃을 밀지 않고, 악센트가 글자 폭을 조금 넘는 것은 조판에서 정상이다.
     ★★★ **점을 얇게 하고 더 벌린다 — 「C안」** (2026-08-23, 사용자가 세 안을 나란히 보고 판정).
       벌리는 것만으로는 안 풀렸다(*[발화 생략]*). 두 점이 붙어 보인 것은
       **간격만의 문제가 아니라 두 점이 차지하는 잉크의 양**이었다 — 같은 자리에 단일 닷의
       잉크가 **두 배** 들어가니 단일 닷과 나란히 놓으면 그쪽만 굵어 보인다.
       → `\ddot` 의 점만 **0.15em**(단일 닷 0.18em 의 83%)으로 줄이고 여백을 **지름의 1.4배**로 둔다.
       ★ **크기 통일 규칙의 예외이고, 그 예외가 곧 목적이다** — 눈이 재는 것은 점 하나의 지름이
         아니라 **덩어리의 무게**라, 두 개짜리를 조금 줄여야 한 개짜리와 같은 무게로 보인다
         (조판에서 diaeresis 를 단일 악센트보다 작게 그리는 이유와 같다).
       ★ 여백 1.4배의 계산: `translateX` 는 **자기 폭** 기준이라 −170%/70% → 중심 거리 2.4w,
         사이 여백 1.4w. 폭 합계는 3.4 × 0.15em = 0.51em 으로 A안(3 × 0.18 = 0.54em)보다 좁다. */
  .dot-mark.dot-l,.dot-mark.dot-r{width:.15em; height:.15em;}
  .dot-mark.dot-l{transform:translateX(-170%);}
  .dot-mark.dot-r{transform:translateX(70%);}
  /* ★ 적분기호와 피적분함수 사이가 너무 벌어져 있었다 (좁힘 2026-08-07).
     사용자: *[발화 생략]*
     `padding-right` 는 **위첨자가 앉을 자리**를 비우는 값이라, 넓게 잡으면 그만큼 뒤 글자가
     밀린다. 위첨자는 `left:.78em` 에서 시작하고 폭이 대략 .62em 이므로 필요한 자리는
     1.40em 이 아니라 **0.78 + 0.62×(글자수 보정)** 이다. 실측해서 0.74em 으로 좁혔다.
     구간 글자는 .62 → .72em (본문 대비 너무 작아 읽히지 않는다는 지적).
