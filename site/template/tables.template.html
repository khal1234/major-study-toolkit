<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{SUBJECT}} · {{TABLES_LABEL}}</title>
<style>
  :root{
    --paper:#f6f3ec; --paper-raised:#fffdf8; --ink:#20242b; --sub:#6b6558;
    --blue:#2c4a66; --blue-soft:#e6ecf1; --copper:#b85f28; --copper-soft:#f3e2d3;
    --line:#ded6c2; --line-strong:#c9bfa5; --code-bg:#ece6d6;
    --shadow:0 1px 2px rgba(32,36,43,.06),0 6px 18px -8px rgba(32,36,43,.14);
    --head-row-height:42px;
  }
  :root[data-theme="dark"]{
    --paper:#14171b; --paper-raised:#1b1f24; --ink:#e9e4d8; --sub:#a39c8a;
    --blue:#8fb3d1; --blue-soft:#1f2c37; --copper:#e2915a; --copper-soft:#332318;
    --line:#31363d; --line-strong:#3d444d; --code-bg:#20252b;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.55);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#14171b; --paper-raised:#1b1f24; --ink:#e9e4d8; --sub:#a39c8a;
      --blue:#8fb3d1; --blue-soft:#1f2c37; --copper:#e2915a; --copper-soft:#332318;
      --line:#31363d; --line-strong:#3d444d; --code-bg:#20252b;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.55);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0; max-width:100%; overflow-x:hidden;}
  [hidden]{display:none!important;}
  body{
    min-width:0; background:var(--paper); color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;}
  a:focus-visible,button:focus-visible,tr:focus-visible{outline:2px solid var(--copper); outline-offset:2px;}
  .shell{width:min(100%,1400px); margin:0 auto; padding:34px 24px 72px; min-width:0;}
  .topline{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:8px;}
  .eyebrow{font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--sub); font-weight:700;}
  h1{font-family:"Nanum Myeongjo","Noto Serif KR","Batang",Georgia,serif; font-size:32px; letter-spacing:0; margin:0;}
  .metadata{color:var(--sub); font-size:12.5px;}
  .source{margin-top:2px; color:var(--sub); font-size:11.5px;}
  .shell{padding-top:20px;}
  .head-row{display:flex; align-items:baseline; gap:18px; flex-wrap:wrap;}
  .head-note{flex:1 1 320px; min-width:0; text-align:right;}
  @media (max-width:700px){ .head-note{text-align:left;} }
  /* 줄 사이 여백은 좁게 — 머리글·물질 줄·표 종류 줄이 연달아 오는데 예전 값(26/22px)은 화면 한 판을
     세 줄이 차지했다(2026-09-20 사용자 [발화 생략]·「여기도」). */
  .tabs{
    position:sticky; top:0; z-index:20; display:flex; gap:5px; margin:10px 0 14px;
    padding:6px 0; overflow-x:auto; background:var(--paper); border-bottom:1px solid var(--line);
    scrollbar-width:thin;
  }
  .tab-button{
    flex:none; min-height:44px; padding:9px 14px; border:1px solid transparent; border-radius:8px;
    background:none; color:var(--sub); cursor:pointer; font-size:13px; font-weight:700;
  }
  /* ★ 물질 줄은 **고정(sticky)하지 않는다** — 표 종류 줄이 이미 `top:0` 에 붙어 있어서
     둘 다 붙이면 스크롤 중에 겹친다. 물질은 한 번 고르고 마는 것이라 따라다닐 이유도 없다. */
  .tabs.substances{position:static; margin:10px 0 0; padding:2px 0 0; border-bottom:0;}
  .tab-button:hover{color:var(--ink); background:var(--paper-raised);}
  .tab-button.active{color:var(--copper); background:var(--copper-soft); border-color:var(--copper);}
  .table-panel{min-width:0;}
  .panel-heading{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:10px;}
  .panel-heading h2{font-family:"Nanum Myeongjo","Noto Serif KR","Batang",Georgia,serif; font-size:20px; margin:0;}
  .panel-note{font-size:12px; color:var(--sub); margin:0;}
  /* ★ 표는 **자기 상자 안에서** 세로로도 스크롤한다 (2026-09-20, 사용자 [발화 생략]). 머리글의 `position:sticky` 는 가장 가까운
     스크롤 상자를 기준으로 붙는데, 이 상자가 가로만 스크롤하면 기준이 되어 버려 페이지를 내려도 머리가
     따라오지 않았다. 높이를 화면에 맞춰 두면 머리글이 상자 위에 붙은 채 몸만 흐른다. */
  /* ★ 스크롤 막대는 숨긴다 (2026-09-20 사용자 [발화 생략]) — 세로 스크롤
     상자로 바꾸면서 막대가 표 오른쪽에 늘 떠 있었다. 스크롤 자체는 그대로 된다(휠·터치·키보드). */
  .table-scroll{scrollbar-width:none; -ms-overflow-style:none;}
  .table-scroll::-webkit-scrollbar{width:0; height:0;}
  .table-scroll{width:100%; max-width:100%; overflow:auto; max-height:calc(100vh - 150px); border:1px solid var(--line); border-radius:8px; background:var(--paper-raised); box-shadow:var(--shadow); overscroll-behavior-x:contain;}
  .data-table{width:max-content; min-width:100%; border-collapse:separate; border-spacing:0; font-variant-numeric:tabular-nums; font-size:12.5px;}
  .data-table th,.data-table td{height:44px; padding:9px 12px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); text-align:right; white-space:nowrap;}
  .data-table th:last-child,.data-table td:last-child{border-right:0;}
  .data-table tbody tr:last-child td{border-bottom:0;}
  .data-table thead th{position:sticky; z-index:4; background:var(--blue-soft); color:var(--blue); font-weight:700; text-align:center;}
  .data-table thead tr:first-child th{top:0; height:var(--head-row-height);}
  .data-table thead tr:nth-child(2) th{top:var(--head-row-height); height:var(--head-row-height);}
  .data-table tbody tr{cursor:pointer;}
  .data-table tbody tr:hover td{background:var(--blue-soft);}
  .data-table tbody tr.selected td{background:var(--copper-soft); color:var(--ink);}
  /* ★★ **세로(열)도 고를 수 있다** (신설 2026-08-19, 사용자: *[발화 생략]*). 표를 읽는 동작이 실제로 둘이라서다 — 아는 값으로 **줄**을 찾고,
     읽을 성질로 **칸**을 따라 내려간다. 가로만 고를 수 있으면 그 절반만 도와주는 셈이다.
     · 고르는 자리는 **머리글**이다 — 본문 셀 클릭은 이미 줄 선택이 쓰고 있고, 한 클릭에
       두 뜻을 얹으면 어느 쪽이 켜졌는지 사람이 못 가린다.
     · 묶음 머리글(비체적·엔탈피 …)을 누르면 그 아래 칸이 **함께** 켜진다. 표가 그렇게 묶여
       있으니 고르는 단위도 그래야 한다.
     · 순서를 뒤에 둔다 — 줄 hover 보다 뒤여야 «칸을 켜 둔 채 줄을 훑는» 것이 보인다. */
  .data-table thead th[data-cols]{cursor:pointer;}
  .data-table tbody tr td.col-selected{background:var(--copper-soft); color:var(--ink);}
  .data-table thead th.col-selected{background:var(--copper-soft); color:var(--copper);}
  .data-table .sticky-first{position:sticky; left:0; z-index:3; background:var(--paper-raised); font-weight:700; color:var(--ink);}
  .data-table thead .sticky-first{z-index:8; background:var(--blue-soft); color:var(--blue);}
  .data-table tbody tr:hover .sticky-first{background:var(--blue-soft);}
  .data-table tbody tr.selected .sticky-first{background:var(--copper-soft);}
  /* ★ 압력 칩은 **줄을 바꿔 쌓는다** (2026-09-20 사용자 [발화 생략]).
     한 줄로 두고 가로 스크롤을 걸면 오른쪽 칩이 화면 밖에 숨어 몇 개가 있는지 안 보였다. */
  .pressure-chips{display:flex; flex-wrap:wrap; gap:6px; padding:2px 0 10px; margin-bottom:8px;}
  .pressure-chip{
    flex:none; min-height:44px; padding:8px 13px; border:1px solid var(--line-strong); border-radius:8px;
    background:var(--paper-raised); color:var(--sub); cursor:pointer; font-size:12.5px; font-weight:700;
  }
  .pressure-chip:hover{border-color:var(--blue); color:var(--blue);}
  .pressure-chip.active{border-color:var(--copper); background:var(--copper-soft); color:var(--copper);}
  .pressure-nav{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:10px 0;}
  .nav-button{min-height:44px; padding:9px 14px; border:1px solid var(--line-strong); border-radius:8px; background:var(--paper-raised); color:var(--ink); cursor:pointer; font-size:13px; font-weight:700;}
  .nav-button:hover:not(:disabled){border-color:var(--copper); color:var(--copper);}
  .nav-button:disabled{opacity:.35; cursor:default;}
  .block-heading{font-family:"Nanum Myeongjo","Noto Serif KR","Batang",Georgia,serif; font-size:19px; font-weight:700; text-align:center;}
  .sat-tag{display:inline-block; margin-left:7px; padding:2px 6px; border-radius:5px; background:var(--copper-soft); color:var(--copper); font-size:10px; font-weight:700; vertical-align:middle;}
  /* 이중보간 계산기 — 두 압력 블록 × 두 온도 줄의 네 값을 격자로 두고 단계를 편다 */
  .interp{margin-top:18px; padding:14px 16px; border:1px solid var(--line); border-radius:8px; background:var(--paper-raised); box-shadow:var(--shadow);}
  .interp h3{margin:0 0 8px; font-size:15px;}
  .interp-inputs{display:flex; flex-wrap:wrap; gap:10px; align-items:center; font-size:13px;}
  .interp-inputs input,.interp-inputs select{min-height:40px; padding:6px 8px; border:1px solid var(--line-strong); border-radius:6px; background:var(--paper); color:var(--ink); font:inherit; width:7.5em;}
  .interp-scroll{margin-top:8px; overflow-x:auto;}
  .interp-leg{margin-top:12px; font-size:12px; font-weight:700; color:var(--blue);}
  .interp-grid{margin-top:12px; border-collapse:collapse; font-variant-numeric:tabular-nums; font-size:13px;}
  .interp-grid th,.interp-grid td{padding:6px 12px; border:1px solid var(--line); text-align:right;}
  .interp-grid th{background:var(--blue-soft); color:var(--blue);}
  .interp-grid td.mid{background:var(--copper-soft); color:var(--copper); font-weight:700;}
  .interp-steps{margin:10px 0 0; padding-left:1.4em; font-size:13px; line-height:1.9; font-variant-numeric:tabular-nums;}
  .interp-final{margin-top:6px; font-weight:700; color:var(--copper);}
  .interp-note{margin-top:6px; font-size:12px; color:var(--sub);}
  .chart-box{border:1px solid var(--line); border-radius:8px; background:var(--paper-raised); box-shadow:var(--shadow); padding:8px;}
  .chart-box svg{display:block; width:100%; height:auto; touch-action:none; cursor:crosshair;}
  .chart-read{margin-top:6px; padding:6px 10px; border-top:1px solid var(--line); font-size:13px; color:var(--sub); font-variant-numeric:tabular-nums;}
  .chart-read b{color:var(--copper);}
  .chart-read.pinned{color:var(--ink);}
  @media (max-width:768px){
    .shell{padding:24px 16px 56px;}
    h1{font-size:28px;}
    .panel-heading{display:block;}
    .panel-note{margin-top:3px;}
    .data-table th,.data-table td{padding:9px 10px;}
  }
  @media (max-width:420px){
    .shell{padding:20px 12px 48px;}
    .topline{align-items:flex-start;}
    h1{font-size:25px;}
    .metadata{font-size:12px;}
    .pressure-nav{align-items:stretch; flex-wrap:wrap;}
    .pressure-nav .block-heading{order:-1; width:100%; text-align:left; font-size:17px;}
    .nav-button{flex:1;}
  }
</style>
</head>
<body>
<main class="shell">
  <!-- `data-tut-host` — 「설명 다시 보기」 버튼이 붙을 자리를 **이 화면이 선언한다**
       (튜토리얼 층은 공유 조각이라 화면마다 다른 선택자를 알면 안 된다). -->
  <div class="topline" data-tut-host>
    <!-- ★ 과목 이름을 박지 않는다 (2026-09-08). 두 과목이 이 템플릿을 함께 쓰는데 제목과
         눈썹글이 「열역학」으로 박혀 있어, 응용열역학 표를 열어도 **탭 제목이 열역학**이었다.
         빌드가 채운다(`render.build_tables_page`). -->
    <div class="eyebrow">전공정리 · {{SUBJECT}} 부록</div>
  </div>
  <!-- ★ 머리는 **두 칸 한 줄**이다 (2026-09-20 사용자 [발화 생략]·
       「이거 프로판 표 옆쪽으로 못 넣나」). 제목이 왼쪽, 단위와 출처가 오른쪽에 붙어 세 줄이 한 줄이 된다. -->
  <div class="head-row">
    <h1 id="pageTitle">수증기 표</h1>
    <div class="head-note">
      <div class="metadata" id="unitsLine"></div>
      <div class="source" id="sourceLine">CoolProp 8.0.0 (IAPWS-95) 계산값 · 유효숫자 5자리</div>
    </div>
  </div>

  <!-- ★ 물질 선택기 — **데이터에 `substances` 가 있을 때만** 채운다 (2026-09-08).
       열역학(Cengel)은 그 키가 없으므로 이 줄이 통째로 안 그려진다(선언이 곧 opt-in). -->
  <nav class="tabs substances" id="substanceTabs" aria-label="물질" hidden></nav>

  <nav class="tabs" aria-label="표 종류">
    <button class="tab-button active" data-table="saturation_T">포화 (온도 기준)</button>
    <button class="tab-button" data-table="saturation_P">포화 (압력 기준)</button>
    <button class="tab-button" data-table="superheated">과열증기</button>
    <button class="tab-button" data-table="compressed_liquid">압축액</button>
    <button class="tab-button" data-table="hs_chart">h-s 선도</button>
  </nav>
  <section class="table-panel" id="tablePanel"></section>
</main>

<script>
var STEAM = {{STEAM_JSON}};
var COMPRESS = {{COMPRESS_JSON}};     // 일반화 압축성 선도 격자 — 없으면 null 이고 탭이 숨는다
/* ★ 단위와 임계압력은 **데이터가 정한다** (2026-09-08). 열역학은 kPa(Cengel), 응용열역학은
   bar(Moran)라 이 화면이 둘을 다 그려야 한다. 임계압력을 상수 `22064` 로 박아 두면 bar 판에서
   압축액 블록이 전부 「초임계」로 읽힌다 — 포화압력표의 마지막 행이 곧 임계점이므로 거기서 읽는다. */
var PRESSURE_UNIT = (STEAM.units && STEAM.units.P) || 'kPa';
var activeTable = 'saturation_T';
var activePressureIndex = 0;

/* ★★ **물질을 고른다 — 물 + 냉매 넷** (2026-09-08). Moran 부표는 물(A-2~A-5) 말고도
   R-134a·R-22·암모니아·프로판(A-7~A-18)을 싣는다. 단위·칸 배열이 물과 같아서 표를 그리는
   코드는 하나면 되고, **바뀌는 것은 「어느 묶음을 읽는가」 하나뿐**이다 — 그래서 모든 참조가
   `SRC()` 를 지난다. 전역 하나를 직접 읽는 자리가 남으면 물질을 바꿔도 그 표만 물로 남는다.
   ★ 냉매에는 **압축액 표가 없다**(교재도 안 싣는다) — 그 탭은 물일 때만 보인다. */
var SUBSTANCES = STEAM.substances || null;
var activeSubstance = '';                       // '' = 물(최상위)
function SRC(){ return (activeSubstance && activeSubstance !== '__z') ? SUBSTANCES[activeSubstance] : STEAM; }
function CRITICAL_PRESSURE_OF(src){
  var rows = src.saturation_P.rows;
  return rows[rows.length - 1][0];
}

function esc(value){
  return String(value).replace(/[&<>]/g,function(character){
    return {'&':'&amp;','<':'&lt;','>':'&gt;'}[character];
  });
}
function textNumber(value){ return String(value); }
function unitLine(){
  var units = STEAM.units;
  return 'T [' + units.T + '] · P [' + units.P + '] · v [' + units.v + '] · u [' + units.u + '] · h [' + units.h + '] · s [' + units.s + ']';
}
document.getElementById('unitsLine').textContent = unitLine();

// ★ 열 번호를 **머리글에 박아 둔다**(`data-cols`). 클릭 때 표 구조(rowspan·colspan)를 거꾸로
//   푸는 것보다 이쪽이 안전하다 — 머리를 만드는 자리에서는 어느 칸인지가 이미 정해져 있고,
//   푸는 쪽에 두면 표 모양이 바뀔 때마다 그 계산이 조용히 어긋난다.
/* ★ 머리를 **데이터에서 짓는다** (2026-09-08). 그전에는 13칸 Cengel 배열이 통째로 박혀
   있었고, 응용열역학이 Moran 표기(증발 칸을 h 에만 두는 11칸)로 가면서 **머리와 몸이
   어긋났다** — colspan 과 `data-cols` 가 전부 한 칸씩 밀린다. 과목마다 칸이 다른 것이
   정상이므로 판정을 `columns` 하나에 맡긴다(AGENTS 「공통 도구에 과목별 사실을 박지 않는다」).
   그룹은 이름의 밑줄 앞이 정한다 — `v_f`·`v_g` 가 한 그룹, `h_f`·`h_fg`·`h_g` 가 한 그룹. */
var GROUP_LABEL = {
  v: '비체적 m³/kg', u: '내부에너지 kJ/kg',
  h: '엔탈피 kJ/kg', s: '엔트로피 kJ/(kg·K)'
};
function saturationHeader(columns,firstLabel,secondLabel){
  var groups = [];
  columns.slice(2).forEach(function(name,offset){
    var index = offset + 2;
    var cut = name.indexOf('_');
    var key = cut < 0 ? name : name.slice(0,cut);
    var sub = cut < 0 ? '' : name.slice(cut + 1);
    var last = groups[groups.length - 1];
    if(last && last.key === key){ last.cols.push(index); last.subs.push(sub); }
    else { groups.push({key:key, cols:[index], subs:[sub]}); }
  });
  var top = groups.map(function(group){
    return '<th colspan="' + group.cols.length + '" tabindex="0" data-cols="' + group.cols.join(' ') + '">' +
      esc(GROUP_LABEL[group.key] || group.key) + '</th>';
  }).join('');
  var bottom = groups.map(function(group){
    return group.cols.map(function(index,slot){
      return '<th tabindex="0" data-cols="' + index + '">' + esc(group.subs[slot]) + '</th>';
    }).join('');
  }).join('');
  return '<thead><tr>' +
    '<th class="sticky-first" rowspan="2" tabindex="0" data-cols="0">' + esc(firstLabel) + '</th>' +
    '<th rowspan="2" tabindex="0" data-cols="1">' + esc(secondLabel) + '</th>' +
    top + '</tr><tr>' + bottom + '</tr></thead>';
}
function simpleHeader(){

/* ★ 이상기체 표(공기)는 **포화·과열이라는 갈래가 없다** — 온도 하나로 줄이 정해진다.

/* ★ 기호는 **기울임 글자 + 아래첨자**로 그린다 (2026-09-20 사용자 [발화 생략]).
   밑줄 표기는 소스에 적는 방식이지 읽는 방식이 아니다. 비열은 **소문자 c** 가 맞다 — 이 표는 단위질량당

var PLAIN_LABEL = {

/* ★ 기체마다 칸이 셋(c_p·c_v·k)이면 **기체 이름을 위 줄에 한 번** 쓰고 아래 줄에 성질을 둔다

function plainHeader(columns){
  var groups = [];

    var cut = name.indexOf('_');

    var last = groups[groups.length - 1];
    if(gas && last && last.gas === gas){ last.cols.push(index); last.props.push(name.slice(cut + 1)); }
    else { groups.push({gas: gas, cols: [index], props: [cut < 0 ? name : name.slice(cut + 1)], plain: !gas}); }

    if(g.plain) return '<th' + first + ' rowspan="2" tabindex="0" data-cols="' + g.cols.join(' ') + '">' + plainLabel(columns[g.cols[0]]) + '</th>';
    return '<th' + first + ' colspan="' + g.cols.length + '" tabindex="0" data-cols="' + g.cols.join(' ') + '">' + gasName(g.gas) + '</th>';
  }).join('');
  var bottom = groups.filter(function(g){ return !g.plain; }).map(function(g){

      return '<th tabindex="0" data-cols="' + index + '">' + propLabel(g.props[slot]) + '</th>';
    }).join('');

  return '<thead><tr>' + top + '</tr><tr>' + bottom + '</tr></thead>';
}
/* ★ 기체가 여럿인 표(비열표)는 **한 기체씩** 보인다 (2026-09-20 사용자 [발화 생략]) — 여섯 기체 열여덟 칸이 한 번에 뜨면 가로로 끝없이 늘어난다.
   고른 기체의 칸만 남기고 T 칸은 언제나 남긴다. 「전부」 칸은 두지 않는다 — 사용자 [발화 생략]. */
var activeGas = '';
/* ★ 「기체 묶음」은 **같은 앞머리가 두 칸 이상**일 때만이다 (2026-09-20 사용자 [발화 생략]) — `p_r`·`v_r` 은 밑줄이 있어도 기체 이름이 아니라
   성질 이름이라, 앞머리 하나를 기체로 세면 공기표가 두 칸으로 쪼개진다. */
function gasesOf(columns){
  var count = {}, order = [];
  columns.forEach(function(name){
    var cut = name.indexOf('_');
    if(cut <= 0) return;
    var gas = name.slice(0, cut);
    if(!count[gas]){ count[gas] = 0; order.push(gas); }
    count[gas] += 1;
  });

}
function gasChipsHtml(gases){

function idealGasHtml(){

    '<div class="table-scroll"><table class="data-table">' + plainHeader(columns) +

/* ★★ 이중보간 계산기 (신설 2026-09-20, 사용자 [발화 생략]). 1회독용 — 손으로 셈하는 대신 **어느 네 값을 어떤 순서로 쓰는지**를 보인다.
   순서: 두 압력 블록 각각에서 온도로 한 번씩 → 그 두 값을 압력으로 한 번. 블록마다 온도 눈금이 달라
   (첫 줄이 포화온도) 온도 두 줄은 블록마다 따로 고른다.
   못 보는 것: 압력 블록 사이에서 포화 경계를 넘는 경우(한 블록엔 그 온도가 과열인데 다른 블록엔 없다)는
   보간하지 않고 알린다 — 그 자리는 상 경계라 직선 보간이 뜻이 없다. */
var INTERP = {P:'', T:'', x:'', prop:'h'};
var SUPER_PROPS = ['v', 'u', 'h', 's'];   // 과열·압축액 블록의 칸 차례(줄의 1~4번)
function sig5(x){ return Number(x.toPrecision(5)); }
function bracket(rows, x){
  for(var i = 0; i < rows.length; i++){
    if(rows[i][0] === x) return [i, i];
    if(i + 1 < rows.length && rows[i][0] < x && x < rows[i + 1][0]) return [i, i + 1];
  }
  return null;
}
function interpOnce(x, x1, x2, y1, y2){ return x1 === x2 ? y1 : y1 + (x - x1) * (y2 - y1) / (x2 - x1); }
/* ★★ 결과는 **표와 같은 세로 줄**로 낸다 (2026-09-20 사용자 *[발화 생략]*).

   그전에는 고른 성질 하나만 가로 다섯 칸(아래 T · 값 · 위 T · 값 · 결과)으로 냈는데,
   h 를 본 뒤 s 를 보려면 계산기를 다시 돌려야 했다 — 표를 읽을 때 눈이 가는 모양과도 달랐다.
   `mid` 는 찾는 줄이고, 표의 줄과 정확히 같으면 그 줄 하나만 낸다. */
function interpRowsHtml(head, rows){

    rows.map(function(r){
      return '<tr>' + r.cells.map(function(c){

      }).join('') + '</tr>';
    }).join('') + '</tbody></table></div>';
}
/* 아래·찾는·위 세 줄을 만든다. `cells(row)` 는 표의 줄을, `mid` 는 보간값을 글자로 돌려준다. */

function interpIdealHtml(){

  var r1 = rows[bt[0]], r2 = rows[bt[1]];

  var head = use.map(function(k){ return k === 0 ? 'T (K)' : plainLabel(cols[k]); });
  var mid = use.map(function(k){ return k === 0 ? T : sig5(interpOnce(T, r1[0], r2[0], r1[k], r2[k])); });
  var pick = function(r){ return use.map(function(k){ return r[k]; }); };
  return interpRowsHtml(head, interpStack(r1, r2, mid, pick)) +
    '<ol class="interp-steps"><li>' + plainLabel(cols[ci]) + ': ' + r1[ci] + ' + (' + T + ' − ' + r1[0] + ')/(' + r2[0] + ' − ' + r1[0] + ') × (' + r2[ci] + ' − ' + r1[ci] + ') = <b>' + sig5(y) + '</b>' +
    (r1[0] === r2[0] ? ' (표의 줄 그대로)' : '') + '</li></ol>';
}
/* ★ 칸 이름은 **밑줄이 아니라 아래첨자로 조판한다** (2026-09-20 사용자 [발화 생략]). `v_f` 는 데이터에 적는 방식이지 읽는 방식이 아니다 — 본표 머리글이 이미
   `propLabel` 로 내리고 있었는데 계산기만 날것을 냈다. 단위는 밑글자로 찾는다(`P_sat` → P). */
/* `<option>` 안에는 태그가 안 살아 아래첨자를 못 쓴다 — 그래서 첨자를 **말로 편다**.

var SAT_SUFFIX = {f: '포화액', g: '포화증기', fg: '증발', sat: '포화'};
function satOptionLabel(name){

  if(cut < 0) return name;

}
function satColLabel(name){
  var cut = name.indexOf('_');
  var base = cut < 0 ? name : name.slice(0, cut);
  var unit = STEAM.units[base];
  return propLabel(name) + (unit ? ' [' + esc(unit) + ']' : '');
}
/* ★★ 포화표는 **건도도 받는다** (2026-09-20 사용자 [발화 생략]). 습증기의 상태량은 표에 없다 — 포화액·포화증기 두 값을 건도로 섞어야 나온다.
       y = y_f + x(y_g − y_f),  h 는 표에 h_fg 가 있으면 그것을 그대로 쓴다.
   못 보는 것: x 가 0~1 밖이면 습증기가 아니므로 섞지 않고 알린다(과열·압축액은 다른 표다). */
function mixtureHtml(cols, midNum, x){

   하나(온도 기준 표는 T, 압력 기준 표는 P)라 줄 둘 사이 한 번만 보간한다. */
function interpSatHtml(kind){

function hsChartHtml(){

  var ci = function(t, n){ return t.columns.indexOf(n); };

  var pts = [];

  sat.rows.forEach(function(r){ pts.push([r[sf], r[hf]]); pts.push([r[sg], r[hg]]); });
  /* ★ 축은 **데이터가 있는 자리**에 맞춘다 (2026-09-20 사용자 [발화 생략]) — 0 부터 그리면 냉매처럼 s 가 0~2 인 물질은 그림의 한 귀퉁이에만 선이 몰린다.

  var hmin = Math.floor(hLo / hStep) * hStep, hmax = Math.ceil(hHi / hStep) * hStep;
  // 꼭대기 데이터 바로 위에 한 줄 이름표를 둘 최소 여백만 둔다. 과한 빈 축 범위는
  // 안내선을 데이터 곡선의 연장처럼 보이게 하므로, 눈금 한 칸의 1/4를 넘기지 않는다.

  var sc = chartScale(smin, smax, hmin, hmax, hsChart), X = sc.X, Y = sc.Y;
  var path = function(list){ return list.map(function(p, i){ return (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1); }).join(''); };
  var dome = sat.rows.map(function(r){ return [r[sf], r[hf]]; }).concat(sat.rows.slice().reverse().map(function(r){ return [r[sg], r[hg]]; }));
  var blocks = src.superheated.blocks, pick = [];
  var step = Math.max(1, Math.round(blocks.length / 7));

  // 그 위에 올라가는 순서 의존을 없앤다.
  var isobarData = pick.map(function(b){
    var row = null;
    satP.rows.forEach(function(r){ if(r[0] === b.P) row = r; });
    var wet = row ? [[row[ci(satP, 's_f')], row[ci(satP, 'h_f')]], [row[ci(satP, 's_g')], row[ci(satP, 'h_g')]]] : [];
    var dry = b.rows.map(function(r){ return [r[4], r[3]]; });
    var full = wet.concat(dry);
    return {b: b, full: full, screen: full.map(function(p){ return [X(p[0]), Y(p[1])]; })};
  });
  var isobars = isobarData.map(function(item){

  var hsLabels = labelPlan.map(function(at){

      '<text x="' + at.x.toFixed(1) + '" y="' + at.y.toFixed(1) + '" font-size="11" fill="var(--blue)"' +
      ' paint-order="stroke" stroke="var(--paper-raised)" stroke-width="3">' + at.item.b.P + '</text>';

  var body = chartGrid(sc, smin, smax, sStep, hmin, hmax, hStep, fmtTick(sStep), fmtTick(hStep), hsChart) +
    '<path d="' + path(dome) + '" fill="none" stroke="var(--copper)" stroke-width="1.7" stroke-linejoin="round"/>' + isobars + hsLabels +
    chartLegend([{color: 'var(--copper)', text: '포화 돔(왼쪽 액체선 · 오른쪽 증기선)'},
                 {color: 'var(--blue)', width: 1.1, text: '등압선 — 숫자는 압력 ' + esc(PRESSURE_UNIT)}], hsChart);
  var svg = chartSvg({body: body, aria: 'h-s 선도 — 포화 돔과 등압선', x0: smin, x1: smax, y0: hmin, y1: hmax,

  return '<div class="panel-heading"><h2>h-s 선도</h2><p class="panel-note">주황 = 포화 돔 · 파랑 = 등압선(숫자는 압력 ' + esc(PRESSURE_UNIT) + ') · 그림 위에서 움직이면 그 자리의 s 와 h 가 읽히고, 누르면 고정됩니다.</p></div>' +
    '<div class="chart-box">' + svg + '<div class="chart-read">그림 위로 커서를 옮기면 값이 나옵니다.</div></div>';
}
/* ★ 일반화 압축성 선도 (신설 2026-09-20) — Lee-Kesler 단순유체 식으로 계산한 격자(`compressibility.json`)를 그린다.
   가로 p_R · 세로 Z · 곡선마다 T_R. 물질과 무관한 선도라 어느 물질 탭에서 열어도 같다.
   못 보는 것: T_R < 1 의 액체 쪽과 포화선(격자에 없다) · 편심인자 보정. */
function zChartHtml(){
  /* ★ 액체 가지는 **안 그린다** (2026-09-20 사용자 [발화 생략]) — 직선에 가까운
     여덟 줄이 등온선 골을 통째로 가로질러 읽을 수가 없었다. 읽는 목적(기체의 Z 를 찾는다)에 쓰이는 것은
     T_R ≥ 1 곡선과 포화 증기선이고, 액체 쪽은 표로 읽는다. 격자에는 남아 있어 되살리려면 이 줄만 되돌린다. */
  var pmax = 10, zmin = 0.2, zmax = 1.2;
  var sc = chartScale(0, pmax, zmin, zmax), X = sc.X, Y = sc.Y;
  var clip = function(list){ return (list || []).filter(function(q){ return q[1] >= zmin && q[1] <= zmax; }); };
  var path = function(list){ return list.map(function(q, i){ return (i ? 'L' : 'M') + X(q[0]).toFixed(1) + ' ' + Y(q[1]).toFixed(1); }).join(''); };
  var curves = COMPRESS.curves.map(function(c){
    var pts = clip(c.points);
    if(pts.length < 2) return '';
    // 이름 자리 — 골이 깊은 곡선은 골 아래, 얕은 곡선은 p_R 2.5 위(끝점에 모으면 여덟이 겹친다, bbox 실측).
    var low = pts.reduce(function(m, q){ return q[1] < m[1] ? q : m; }, pts[0]);
    var deep = low[1] < 0.9;
    var at = deep ? low : (pts.filter(function(q){ return q[0] >= 2.5; })[0] || pts[pts.length - 1]);
    return '<path d="' + path(pts) + '" fill="none" stroke="var(--blue)" stroke-width="1.1" stroke-linejoin="round"/>' +
      '<text x="' + X(at[0]).toFixed(1) + '" y="' + (Y(at[1]) + (deep ? 14 : -6)).toFixed(1) + '" font-size="11" fill="var(--blue)" text-anchor="middle" paint-order="stroke" stroke="var(--paper-raised)" stroke-width="3">' + c.Tr + '</text>';
  }).join('');
  var subs = (COMPRESS.sub_curves || []).map(function(c){
    var pts = clip(c.vapor);

  }).join('');
  var sat = clip((COMPRESS.saturation || {}).vapor);
  var satLine = sat.length < 2 ? '' : '<path d="' + path(sat) + '" fill="none" stroke="var(--copper)" stroke-width="1.7" stroke-linejoin="round"/>';
  var body = chartGrid(sc, 0, pmax, 1, zmin, zmax, 0.2, function(v){ return v; }, function(v){ return v.toFixed(1); }) +
    '<line x1="' + CHART.L + '" y1="' + Y(1).toFixed(1) + '" x2="' + (CHART.W - CHART.R) + '" y2="' + Y(1).toFixed(1) + '" stroke="var(--copper)" stroke-width="0.9" stroke-dasharray="5 4"/>' +
    subs + satLine + curves;
  var svg = chartSvg({body: body, aria: '일반화 압축성 선도 — 환산압력에 따른 압축성 인자', x0: 0, x1: pmax, y0: zmin, y1: zmax,
    xname: 'p_R', yname: 'Z', xdec: 2, ydec: 3,
    xaxis: '환산압력 <tspan font-style="italic">p</tspan><tspan baseline-shift="sub" font-size="9">R</tspan>',
    yaxis: '<tspan font-style="italic">Z</tspan> = <tspan font-style="italic">pv</tspan> / <tspan font-style="italic">RT</tspan>'});
  return '<div class="panel-heading"><h2>일반화 압축성 선도</h2><p class="panel-note">어느 기체든 같은 그림입니다 — 대응상태원리로 p_R · T_R 만 있으면 Z 가 정해집니다. 굵은 주황 = 포화 증기선 · 점선 = Z 1 · 가는 선 = T_R &lt; 1 증기 쪽. 누르면 그 자리의 값이 고정됩니다.</p></div>' +
    '<div class="chart-box">' + svg + '<div class="chart-read">그림 위로 커서를 옮기면 값이 나옵니다.</div></div>';
}
function renderTable(){

// ★★ 세로(열) 고르기 — 켜진 칸을 표 전체에 다시 칠한다.
//   상태는 **인덱스 집합 하나**이고 칠은 그 집합에서만 나온다. 셀에 직접 토글을 걸면
//   새로 그린 표에서 상태가 사라져 «켜 놓았는데 안 켜진» 자리가 생긴다.
var selectedColumns = {};
function applySelectedColumns(){
  var table = document.querySelector('.data-table');
  if(!table) return;
  [].forEach.call(table.querySelectorAll('tbody tr'), function(tr){
    [].forEach.call(tr.children, function(cell,index){
      cell.classList.toggle('col-selected', !!selectedColumns[index]);
    });
  });
  [].forEach.call(table.querySelectorAll('thead th[data-cols]'), function(th){
    var cols = th.getAttribute('data-cols').split(' ');
    th.classList.toggle('col-selected', cols.every(function(col){ return !!selectedColumns[col]; }));
  });
}
function toggleColumns(th){
  var cols = th.getAttribute('data-cols').split(' ');
  // 묶음 머리글은 **다 켜져 있을 때만** 끈다 — 반만 켜진 상태에서 누르면 나머지를 켜는 것이
  // 사람이 기대하는 동작이다(부분 선택에서 누르면 꺼지는 토글은 매번 두 번 누르게 만든다).
  var turnOn = !cols.every(function(col){ return !!selectedColumns[col]; });
  cols.forEach(function(col){
    if(turnOn) selectedColumns[col] = true; else delete selectedColumns[col];
  });
  applySelectedColumns();
}

document.getElementById('tablePanel').addEventListener('click',function(event){

  var chip = event.target.closest('.pressure-chip');
  if(chip){ activePressureIndex = Number(chip.getAttribute('data-pressure-index')); renderTable(); return; }
  var nav = event.target.closest('.nav-button');

    activePressureIndex += Number(nav.getAttribute('data-pressure-step'));

  if(row) row.classList.toggle('selected');
});
/* ★ 선도 좌표 읽기 — 커서(또는 손가락) 자리의 두 값을 읽어 준다. 「s 하나 누르면 다른 하나」가 이 화면의
   쓰임이라(2026-09-20 사용자), 십자선과 숫자를 함께 둔다. 누르면 그 자리에 고정되고 다시 누르면 풀린다.
   환산에 필요한 수는 SVG 의 `data-*` 에 실려 있어 이 핸들러는 어느 선도인지 몰라도 된다. */
function chartReadout(svg, event){
  var box = svg.getBoundingClientRect();
  var vw = CHART.W, vh = CHART.H;
  var px = (event.clientX - box.left) / box.width * vw;
  var py = (event.clientY - box.top) / box.height * vh;
  var x0 = +svg.dataset.x0, x1 = +svg.dataset.x1, y0 = +svg.dataset.y0, y1 = +svg.dataset.y1;
  var cl = +(svg.dataset.chartL || CHART.L), cr = +(svg.dataset.chartR || CHART.R);
  var ct = +(svg.dataset.chartT || CHART.T), cb = +(svg.dataset.chartB || CHART.B);
  var inx = Math.min(Math.max(px, cl), vw - cr);
  var iny = Math.min(Math.max(py, ct), vh - cb);
  var xv = x0 + (inx - cl) / (vw - cl - cr) * (x1 - x0);
  var yv = y0 + (vh - cb - iny) / (vh - ct - cb) * (y1 - y0);
  var g = svg.querySelector('.xhair');
  g.hidden = false;
  g.querySelector('.xh-v').setAttribute('x1', inx); g.querySelector('.xh-v').setAttribute('x2', inx);
  g.querySelector('.xh-h').setAttribute('y1', iny); g.querySelector('.xh-h').setAttribute('y2', iny);
  g.querySelector('.xh-mark').setAttribute('d',
    'M' + (inx - 8).toFixed(1) + ' ' + iny.toFixed(1) + 'H' + (inx + 8).toFixed(1) +
    'M' + inx.toFixed(1) + ' ' + (iny - 8).toFixed(1) + 'V' + (iny + 8).toFixed(1));
  var read = svg.parentNode.querySelector('.chart-read');
  if(read) read.innerHTML = svg.dataset.xl + ' = <b>' + xv.toFixed(+svg.dataset.xd) + '</b> · ' +
    svg.dataset.yl + ' = <b>' + yv.toFixed(+svg.dataset.yd) + '</b>' +
    (svg.dataset.pinned === '1' ? ' (고정 — 다시 누르면 풀립니다)' : '');
}
document.getElementById('tablePanel').addEventListener('pointermove', function(event){
  var svg = event.target.closest ? event.target.closest('svg[data-x0]') : null;
  if(!svg || svg.dataset.pinned === '1') return;
  chartReadout(svg, event);
});
document.getElementById('tablePanel').addEventListener('pointerdown', function(event){
  var svg = event.target.closest ? event.target.closest('svg[data-x0]') : null;
  if(!svg) return;
  var pinned = svg.dataset.pinned === '1';
  svg.dataset.pinned = pinned ? '0' : '1';
  var read = svg.parentNode.querySelector('.chart-read');
  if(read) read.classList.toggle('pinned', !pinned);
  chartReadout(svg, event);
});
// 계산기 입력은 결과 칸만 다시 그린다 — 표 전체를 다시 그리면 입력 칸의 초점이 날아간다.
function onInterpInput(event){
  var field = event.target.getAttribute && event.target.getAttribute('data-interp');
  if(!field) return;
  INTERP[field] = event.target.value;
  var box = event.target.closest('.interp');
  box.querySelector('.interp-out').innerHTML = interpResultHtml(box.getAttribute('data-interp-kind'));
}
document.getElementById('tablePanel').addEventListener('input', onInterpInput);
document.getElementById('tablePanel').addEventListener('change', onInterpInput);
document.getElementById('tablePanel').addEventListener('keydown',function(event){
  if(event.key !== 'Enter' && event.key !== ' ') return;
  var head = event.target.closest('thead th[data-cols]');
  if(head){ event.preventDefault(); toggleColumns(head); return; }
  var row = event.target.closest('tbody tr');
  if(row){
    event.preventDefault();
    row.classList.toggle('selected');
  }
});
</script>
