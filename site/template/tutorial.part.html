<!-- ★★ 스포트라이트 튜토리얼 — **두 화면이 함께 쓰는 한 벌** (분리 2026-08-18)

     사용자: [사용자 발화 인용 생략] · 뜨는 시점 판정은 제안 ②
     (처음 한 번만 뜨고 「설명 다시 보기」로 되부른다).

     ★ **왜 파일을 갈랐나** — 처음엔 뷰어 템플릿 안에만 있었는데, 사용자가 가리킨 자리는
       **별책 표 뷰어(`tables.html`)** 였다. 두 템플릿에 같은 코드를 두면 그 순간 두 벌이
       되고 한쪽만 고쳐진다(이 리포가 «재사용 = 복제 = 갈라짐» 으로 여러 번 닫은 자리).
       → **정본은 이 파일 하나**이고 빌드가 두 화면의 「part 마커」 자리로 끼운다.
       ★ 이 글에 마커를 **글자 그대로 쓰지 않는다** — 그 자리에도 조각이 끼워져 겹친다.
     ★ **자리를 여기 박지 않는다** — 무엇을 가리킬지는 각 화면이 `window.TUTORIAL` 로
       선언하고 이 코드는 읽기만 한다. 선언이 없으면 **DOM 을 하나도 안 만든다.**
     ★ **계약:** `window.TUTORIAL = { key: '<저장 키>', steps: [{target, text}, …] }`.
       「설명 다시 보기」 버튼이 붙을 자리는 그 화면이 `data-tut-host` 로 표시한다.
     ★ **못 찾은 대상을 조용히 넘기지 않는다** — 콘솔에 남긴다. 「없다」와 「못 찾았다」가
       같아 보이면 튜토리얼이 반쪽만 돈 채 통과로 읽힌다(규칙 11).
     ★ 크기 변수(`--fs-small` 등)에 **되돌림 값을 붙인다** — 표 뷰어에는 그 사다리가 없다.
-->
<style>
  /* ★ 구멍은 요소를 오려내는 것이 아니라 「막을 그림자로 두르는 것」이다 — `box-shadow` 를
       화면보다 크게(9999px) 주면 그 상자만 빼고 어두워진다. 요소를 복제해 위에 얹는 방식은
       그림자·스크롤·글꼴을 두 번 그리게 되어 자리마다 갈린다.
     ★ `position:fixed` 를 쓴다 — 스크롤 좌표를 손으로 더하지 않기 위해서다
       (`getBoundingClientRect` 가 이미 화면 좌표다). 대신 스크롤·리사이즈에 다시 잰다.
     ★ `pointer-events:none` — 구멍이 클릭을 먹으면 「누르라고 해 놓고 못 누르는」 꼴이 된다. */
  .tut-hole{position:fixed; border-radius:8px; z-index:60; pointer-events:none;
    box-shadow:0 0 0 9999px rgba(20,24,28,.62);
    transition:top .18s ease, left .18s ease, width .18s ease, height .18s ease;}
  .tut-box{position:fixed; z-index:61; max-width:360px; background:var(--paper-raised); color:var(--ink);
    border:1px solid var(--line-strong); border-radius:10px; padding:12px 14px;
    font-size:var(--fs-small, 13.5px); line-height:1.5; box-shadow:0 6px 20px rgba(20,24,28,.28);}
  .tut-box p{margin:0 0 10px;}
  .tut-actions{display:flex; align-items:center; gap:6px;}
  .tut-actions .tut-count{margin-right:auto; color:var(--sub); font-size:var(--fs-micro, 11.5px);}
  .tut-actions button{font-family:inherit; font-size:var(--fs-small, 13.5px); font-weight:700;
    border:1px solid var(--line-strong); background:var(--paper-raised); color:var(--ink);
    border-radius:6px; padding:5px 10px; cursor:pointer;}
  .tut-actions button:hover{border-color:var(--copper); color:var(--copper);}
  .tut-actions .tut-quit{border-color:transparent; color:var(--sub); font-weight:400;}
  .tut-replay{font-family:inherit; font-size:var(--fs-small, 13px); font-weight:700; cursor:pointer;
    border:1px solid var(--line-strong); background:var(--paper-raised); color:var(--sub);
    border-radius:6px; padding:6px 10px; min-height:36px;}
  .tut-replay:hover{border-color:var(--copper); color:var(--copper);}
</style>
<script>
(function(){
  var T = (typeof window.TUTORIAL === 'object' && window.TUTORIAL) || null;
  var steps = (T && T.steps) || [];
  if(!steps.length) return;
  var KEY = 'tut:' + (T.key || 'x');
  var hole = null, box = null, at = 0, live = [];

  function seen(){ try { return localStorage.getItem(KEY) === '1'; } catch(e){ return false; } }
  function markSeen(){ try { localStorage.setItem(KEY, '1'); } catch(e){} }

  // ★★ 대상이 **다른 탭에 살아 있는** 경우 (2026-08-18, 자리 선언을 처음 써 보고 드러났다).
  //   `.page{display:none}` 이라 안 열린 탭의 요소는 `querySelector` 로는 잡히는데 **크기가 0**
  //   이다 — 막의 구멍이 왼쪽 위 한 점으로 찍히고 설명 상자만 뜬다. 「못 찾았다」와 달리
  //   콘솔에도 안 남아서 **화면을 열어 봐야만 보이는** 부류다.
  //   ★ 탭이 없는 화면(표 뷰어)에서는 이 자리가 통째로 no-op 이다 — 있으면 쓰고 없으면 만다.
  function pageOf(el){ return el.closest ? el.closest('.page[data-page]') : null; }
  function ensureVisible(el){
    var page = pageOf(el);
    if(page && !page.classList.contains('active') && typeof showPage === 'function'){
      showPage(page.getAttribute('data-page'));
    }
  }

  function resolve(){
    live = [];
    steps.forEach(function(s, i){
      var el = (s && s.target) ? document.querySelector(s.target) : null;
      var page = el ? pageOf(el) : null;
      // 숨긴 탭(그 챕터가 `hiddenTabs` 로 안 쓰는 탭)의 대상은 **열지 않는다** — 열면 없앤 탭이
      // 튜토리얼 때문에 되살아난다. 조용히 넘기지도 않는다.
      if(el && page && typeof hiddenPages !== 'undefined'
         && hiddenPages.indexOf(page.getAttribute('data-page')) !== -1){
        console.warn('[튜토리얼] 숨긴 탭의 대상이라 건너뛴다 — 단계 ' + (i + 1) + ': ' + s.target);
        return;
      }
      if(el) live.push({ el: el, text: (s && s.text) || '' });
      else console.warn('[튜토리얼] 대상을 못 찾았다 — 단계 ' + (i + 1) + ': ' + (s && s.target));
    });
    return live.length;
  }

  function place(){
    var it = live[at]; if(!it || !hole || !box) return;
    var r = it.el.getBoundingClientRect(), pad = 6;
    hole.style.top = (r.top - pad) + 'px';
    hole.style.left = (r.left - pad) + 'px';
    hole.style.width = (r.width + pad * 2) + 'px';
    hole.style.height = (r.height + pad * 2) + 'px';
    var y = r.bottom + 12;
    if(y + box.offsetHeight > window.innerHeight - 12) y = Math.max(12, r.top - box.offsetHeight - 12);
    box.style.top = y + 'px';
    box.style.left = Math.max(12, Math.min(r.left, window.innerWidth - box.offsetWidth - 12)) + 'px';
  }

  function render(){
    var it = live[at];
    box.innerHTML = '';
    var p = document.createElement('p'); p.textContent = it.text; box.appendChild(p);
    var row = document.createElement('div'); row.className = 'tut-actions';
    var n = document.createElement('span'); n.className = 'tut-count';
    n.textContent = (at + 1) + ' / ' + live.length; row.appendChild(n);
    var quit = document.createElement('button'); quit.type = 'button';
    quit.className = 'tut-quit'; quit.textContent = '그만 보기';
    quit.addEventListener('click', close); row.appendChild(quit);
    if(at > 0){
      var prev = document.createElement('button'); prev.type = 'button'; prev.textContent = '이전';
      prev.addEventListener('click', function(){ at--; step(); }); row.appendChild(prev);
    }
    var next = document.createElement('button'); next.type = 'button';
    next.textContent = (at === live.length - 1) ? '끝' : '다음';
    next.addEventListener('click', function(){
      if(at === live.length - 1) close(); else { at++; step(); }
    });
    row.appendChild(next);
    box.appendChild(row);
  }

  function step(){
    if(!live[at]) return close();
    ensureVisible(live[at].el);            // 다른 탭이면 그 탭을 먼저 연다 (안 그러면 구멍이 0×0 이다)
    live[at].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    render();
    requestAnimationFrame(place);
    setTimeout(place, 260);
  }

  function onKey(e){ if(e.key === 'Escape') close(); }

  function open(){
    if(hole || !resolve()) return;
    at = 0;
    hole = document.createElement('div'); hole.className = 'tut-hole';
    box = document.createElement('div'); box.className = 'tut-box';
    document.body.appendChild(hole); document.body.appendChild(box);
    document.addEventListener('keydown', onKey);
    window.addEventListener('scroll', place, { passive: true });
    window.addEventListener('resize', place);
    step();
  }

  function close(){
    markSeen();
    document.removeEventListener('keydown', onKey);
    window.removeEventListener('scroll', place);
    window.removeEventListener('resize', place);
    if(hole && hole.parentNode) hole.parentNode.removeChild(hole);
    if(box && box.parentNode) box.parentNode.removeChild(box);
    hole = null; box = null;
  }

  // 「설명 다시 보기」가 붙을 자리는 **그 화면이 선언한다**(`data-tut-host`) — 여기서 화면마다
  // 다른 선택자를 알면 이 파일이 두 화면의 사정을 알게 된다.
  var host = document.querySelector('[data-tut-host]');
  if(host){
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'tut-replay'; b.textContent = '설명 다시 보기';
    b.addEventListener('click', open);
    host.appendChild(b);
  }
  if(!seen()) setTimeout(open, 400);
})();
</script>
